dam\", metrics=[\"accuracy\"])\nhistory = model.fit(X_train, y_train, epochs=10, validation_data=(X_valid, y_valid))\nprint(model.evaluate(X_test, y_test))\ny_pred = model.predict(X_test[:10])\nprint(np.argmax(y_pred, axis=-1), y_test[:10])", "note": "Conv2D 입력은 [높이, 너비, 채널] 3차원이어야 해서 흑백 이미지에 채널 차원(1)을 붙임.", "html": "", "out": "", "extra": ""}, {"sec": "cnn", "title": "CNN 파라미터 수 계산", "kw": "cnn 파라미터 계산 conv2d params 320 18496 3136 summary", "code": "", "note": "", "html": "<p><b>Conv2D<\/b> = (커널 높이 × 커널 너비 × 입력 채널 + 1) × 필터 수 &nbsp;·&nbsp; 풀링·Flatten·Dropout = 0<\/p>\n<table>\n<tr><th>층<\/th><th>출력 모양<\/th><th>계산<\/th><th>파라미터<\/th><\/tr>\n<tr><td>Conv2D(32, 3×3, same)<\/td><td>(28, 28, 32)<\/td><td>(3×3×1 + 1) × 32<\/td><td>320<\/td><\/tr>\n<tr><td>MaxPooling2D(2×2)<\/td><td>(14, 14, 32)<\/td><td>-<\/td><td>0<\/td><\/tr>\n<tr><td>Conv2D(64, 3×3, same)<\/td><td>(14, 14, 64)<\/td><td>(3×3×32 + 1) × 64<\/td><td>18,496<\/td><\/tr>\n<tr><td>MaxPooling2D(2×2)<\/td><td>(7, 7, 64)<\/td><td>-<\/td><td>0<\/td><\/tr>\n<tr><td>Flatten<\/td><td>(3136)<\/td><td>7 × 7 × 64<\/td><td>0<\/td><\/tr>\n<tr><td>Dense(128)<\/td><td>(128)<\/td><td>3136 × 128 + 128<\/td><td>401,536<\/td><\/tr>\n<tr><td>Dense(10)<\/td><td>(10)<\/td><td>128 × 10 + 10<\/td><td>1,290<\/td><\/tr>\n<tr><td colspan=\"3\">합계<\/td><td>421,642<\/td><\/tr>\n<\/table>\n<p>합성곱 층은 필터를 이미지 전체에 같이 쓰기 때문에(가중치 공유) 파라미터가 적음. 파라미터 대부분은 Flatten 뒤 Dense에 있음.<\/p>", "out": "", "extra": ""}, {"sec": "cnn", "title": "MLP vs CNN (숫자 인식, 교수님 7-2)", "kw": "mlp cnn 비교 숫자 mnist reshape 28 28 1 완전연결 fully connected", "code": "from tensorflow.keras.utils import to_categorical\n(X_train, y_train), (X_test, y_test) = keras.datasets.mnist.load_data()\n\n# MLP: 784개 한 줄로 펴서 입력 → 공간(위치) 정보가 사라짐\nXm_train = X_train.reshape(60000, 784).astype(\"float32\") / 255\nXm_test = X_test.reshape(10000, 784).astype(\"float32\") / 255\nmlp = keras.Sequential([\n    keras.layers.Input(shape=(784,)),\n    keras.layers.Dense(32, activation=\"relu\"),\n    keras.layers.Dense(32, activation=\"relu\"),\n    keras.layers.Dense(10, activation=\"softmax\")\n])\nmlp.compile(loss=\"categorical_crossentropy\", optimizer=\"adam\", metrics=[\"accuracy\"])\nmlp.fit(Xm_train, to_categorical(y_train, 10), batch_size=128, epochs=5, verbose=2)\nprint(\"MLP:\", mlp.evaluate(Xm_test, to_categorical(y_test, 10), verbose=0)[1])\n\n# CNN: 28x28x1 그대로 입력 → 주변 픽셀 관계(선·곡선)를 봄\nXc_train = X_train.reshape(-1, 28, 28, 1).astype(\"float32\") / 255\nXc_test = X_test.reshape(-1, 28, 28, 1).astype(\"float32\") / 255\ncnn = keras.Sequential([\n    keras.layers.Input(shape=(28, 28, 1)),\n    keras.layers.Conv2D(32, kernel_size=(3, 3), padding=\"same\"),\n    keras.layers.MaxPooling2D(pool_size=(2, 2)),\n    keras.layers.Conv2D(64, kernel_size=(3, 3), padding=\"same\"),\n    keras.layers.MaxPooling2D(pool_size=(2, 2)),\n    keras.layers.Flatten(),\n    keras.layers.Dense(128, activation=\"relu\"),\n    keras.layers.Dropout(0.2),\n    keras.layers.Dense(10, activation=\"softmax\")\n])\ncnn.compile(loss=\"sparse_categorical_crossentropy\", optimizer=\"adam\", metrics=[\"accuracy\"])\ncnn.fit(Xc_train, y_train, epochs=2, verbose=2)\nprint(\"CNN:\", cnn.evaluate(Xc_test, y_test, verbose=0)[1])", "note": "MLP는 원-핫 + categorical, CNN은 정수 레이블 + sparse_categorical로 교수님 노트북 그대로 둠.", "html": "", "out": "", "extra": ""}, {"sec": "cnn", "title": "합성곱 커널 예시 (scipy convolve)", "kw": "kernel 커널 sobel 소벨 엣지 edge 필터 예시 convolve scipy", "code": "from scipy.ndimage import convolve      # (옛 코드: scipy.ndimage.filters → 이제 scipy.ndimage)\nk1 = np.array([[-1, 0, 1], [-1, 0, 1], [-1, 0, 1]])        # 세로 경계\nk2 = np.array([[1, 1, 1], [0, 0, 0], [-1, -1, -1]])        # 가로 경계\nk3 = np.array([[-1, -1, -1], [-1, 8, -1], [-1, -1, -1]])   # 모든 방향 경계\nimg = keras.datasets.mnist.load_data()[0][0][0].astype(float)\nfor k in (k1, k2, k3):\n    res = convolve(img, k)\n    plt.imshow(res, cmap=\"gray\"); plt.axis(\"off\"); plt.show()", "note": "", "html": "", "out": "", "extra": ""}, {"sec": "tune", "title": "탐색용 데이터 준비 (빠르게 하려고 일부만)", "kw": "하이퍼파라미터 튜닝 준비 데이터 일부 subset fashion", "code": "(X_train_full, y_train_full), (X_test, y_test) = keras.datasets.fashion_mnist.load_data()\nX_train_full, X_test = X_train_full / 255., X_test / 255.\nX_train, X_valid = X_train_full[:-5000], X_train_full[-5000:]\ny_train, y_valid = y_train_full[:-5000], y_train_full[-5000:]\nclass_names = [\"T-shirt/top\", \"Trouser\", \"Pullover\", \"Dress\", \"Coat\",\n               \"Sandal\", \"Shirt\", \"Sneaker\", \"Bag\", \"Ankle boot\"]\n# 탐색은 오래 걸리니 시험에서는 일부만 써도 됨\nX_small, y_small = X_train[:10000], y_train[:10000]", "note": "", "html": "", "out": "", "extra": ""}, {"sec": "tune", "title": "그리드 탐색 직접 구현 (for 반복 → 결과 표 → 최적 선택)", "kw": "grid search 그리드 탐색 하이퍼파라미터 최적 조합 itertools 반복 결과 표 best", "code": "import itertools\n\ndef build_model(n_hidden=1, n_neurons=100, learning_rate=1e-3):\n    model = keras.Sequential([keras.layers.Input(shape=(28, 28)), keras.layers.Flatten()])\n    for _ in range(n_hidden):\n        model.add(keras.layers.Dense(n_neurons, activation=\"relu\", kernel_initializer=\"he_normal\"))\n    model.add(keras.layers.Dense(10, activation=\"softmax\"))\n    model.compile(loss=\"sparse_categorical_crossentropy\",\n                  optimizer=keras.optimizers.Adam(learning_rate=learning_rate),\n                  metrics=[\"accuracy\"])\n    return model\n\nparam_grid = {\"n_hidden\": [1, 2], \"n_neurons\": [100, 300], \"learning_rate\": [1e-3, 1e-2]}\n\nrows = []\nfor n_hidden, n_neurons, lr in itertools.product(*param_grid.values()):    # 2 x 2 x 2 = 8가지\n    keras.backend.clear_session()\n    m = build_model(n_hidden, n_neurons, lr)\n    h = m.fit(X_small, y_small, epochs=3, validation_data=(X_valid, y_valid), verbose=0)\n    rows.append({\"n_hidden\": n_hidden, \"n_neurons\": n_neurons, \"learning_rate\": lr,\n                 \"val_accuracy\": max(h.history[\"val_accuracy\"])})\n\nscores_df = pd.DataFrame(rows).sort_values(\"val_accuracy\", ascending=False)\nscores_df[\"rank\"] = range(1, len(scores_df) + 1)\nprint(scores_df)\nbest = scores_df.iloc[0]\nprint(\"최적 조합:\", best.to_dict())", "note": "GridSearchCV처럼 모든 조합을 돌려 검증 정확도로 순위를 매김. 테스트 세트는 고를 때 쓰지 않고 마지막에 한 번만.", "html": "", "out": "", "extra": ""}, {"sec": "tune", "title": "최적 하이퍼파라미터로 다시 학습", "kw": "최적 파라미터 재학습 best refit 다시 학습 조기종료", "code": "best_model = build_model(int(best[\"n_hidden\"]), int(best[\"n_neurons\"]), float(best[\"learning_rate\"]))\nearly_cb = keras.callbacks.EarlyStopping(patience=3, restore_best_weights=True)\nbest_model.fit(X_train, y_train, epochs=20, validation_data=(X_valid, y_valid),\n               callbacks=[early_cb], verbose=2)\nprint(\"테스트 정확도:\", best_model.evaluate(X_test, y_test, verbose=0)[1])", "note": "작년 시험의 'GridSearchCV로 구한 최적 조합으로 DecisionTree 생성하여 학습'과 같은 단계. 탐색은 일부 데이터·짧은 epoch, 재학습은 전체 데이터.", "html": "", "out": "", "extra": ""}, {"sec": "tune", "title": "Keras Tuner (RandomSearch)", "kw": "keras tuner kerastuner 랜덤 탐색 random search hp.Int hp.Float 자동 튜닝", "code": "# Colab: !pip install -q keras-tuner\nimport keras_tuner as kt\n\ndef build_hp(hp):\n    model = keras.Sequential([keras.layers.Input(shape=(28, 28)), keras.layers.Flatten()])\n    for _ in range(hp.Int(\"n_hidden\", 1, 3)):\n        model.add(keras.layers.Dense(hp.Int(\"n_neurons\", 50, 300, step=50), activation=\"relu\"))\n    model.add(keras.layers.Dense(10, activation=\"softmax\"))\n    lr = hp.Float(\"learning_rate\", 1e-4, 1e-2, sampling=\"log\")\n    model.compile(loss=\"sparse_categorical_crossentropy\",\n                  optimizer=keras.optimizers.Adam(learning_rate=lr), metrics=[\"accuracy\"])\n    return model\n\ntuner = kt.RandomSearch(build_hp, objective=\"val_accuracy\", max_trials=5,\n                        overwrite=True, directory=\"kt_dir\", project_name=\"fmnist\")\ntuner.search(X_small, y_small, epochs=3, validation_data=(X_valid, y_valid), verbose=0)\nbest_hp = tuner.get_best_hyperparameters()[0]\nprint(best_hp.values)\ntuned = tuner.hypermodel.build(best_hp)      # 최적 값으로 새 모델", "note": "RandomSearch: 정해진 범위에서 랜덤하게 max_trials개만 시도 → 조합이 많을 때 그리드보다 빠름. 로컬에서는 tensorboard도 필요(Colab엔 있음).", "html": "", "out": "", "extra": ""}, {"sec": "tune", "title": "scikit-learn GridSearchCV로 케라스 모델 탐색 (scikeras)", "kw": "gridsearchcv scikeras KerasClassifier sklearn 교차검증 cv cv_results_", "code": "# Colab: !pip install -q scikeras\nfrom scikeras.wrappers import KerasClassifier\nfrom sklearn.model_selection import GridSearchCV\n\ndef make_clf(n_neurons=100):\n    model = keras.Sequential([keras.layers.Input(shape=(28, 28)), keras.layers.Flatten(),\n                              keras.layers.Dense(n_neurons, activation=\"relu\"),\n                              keras.layers.Dense(10, activation=\"softmax\")])\n    model.compile(loss=\"sparse_categorical_crossentropy\", optimizer=\"adam\", metrics=[\"accuracy\"])\n    return model\n\nclf = KerasClassifier(model=make_clf, epochs=2, verbose=0)\ngrid = GridSearchCV(clf, param_grid={\"model__n_neurons\": [50, 100]}, cv=3, refit=True)\ngrid.fit(X_small[:3000], y_small[:3000])\nprint(grid.best_params_, grid.best_score_)\nscores = pd.DataFrame(grid.cv_results_)[[\"params\", \"mean_test_score\", \"rank_test_score\"]]\nprint(scores)", "note": "작년 시험과 같은 GridSearchCV를 그대로 쓰는 방법. 모델 함수 인자는 model__이름 으로 넘김. 교차검증이라 시간이 오래 걸리니 데이터를 줄일 것.", "html": "", "out": "", "extra": ""}, {"sec": "tune", "title": "혼동 행렬 · 정밀도 · 재현율 · F1 (classification_report)", "kw": "confusion matrix 혼동행렬 오차행렬 precision recall f1 정밀도 재현율 classification_report 평가 지표", "code": "from sklearn.metrics import (confusion_matrix, ConfusionMatrixDisplay, classification_report,\n                             accuracy_score, precision_score, recall_score, f1_score)\nmodel = best_model                                          # 평가할 모델\ny_pred = np.argmax(model.predict(X_test, verbose=0), axis=-1)\n\nprint(confusion_matrix(y_test, y_pred))                     # 행: 실제, 열: 예측\nConfusionMatrixDisplay.from_predictions(y_test, y_pred, display_labels=class_names, xticks_rotation=90)\nplt.show()\nprint(classification_report(y_test, y_pred, target_names=class_names, digits=3))\nprint(\"accuracy\", accuracy_score(y_test, y_pred))\nprint(\"precision(macro)\", precision_score(y_test, y_pred, average=\"macro\"))\nprint(\"recall(macro)\", recall_score(y_test, y_pred, average=\"macro\"))\nprint(\"F1(macro)\", f1_score(y_test, y_pred, average=\"macro\"))", "note": "다중 분류는 average='macro'(클래스별 평균) 또는 'weighted'(개수 가중) 지정 필요.", "html": "", "out": "", "extra": ""}, {"sec": "tune", "title": "ROC 곡선 · AUC (모델 여러 개 비교)", "kw": "roc auc curve roc_curve roc_auc_score fpr tpr 비교 이진 분류 one vs rest", "code": "from sklearn.metrics import roc_curve, roc_auc_score\n\ndef plotROC(fprs, tprs, label):                 # 작년 시험에서 준 함수 형태\n    plt.plot(fprs, tprs, label=label)\n\ntarget = class_names.index(\"Shirt\")             # 한 클래스를 양성(1)으로 보는 이진 문제로 바꿈\ny_true_bin = (y_test == target).astype(int)\n\nmodels = {\"best_model\": best_model, \"tuned\": tuned}    # 비교할 모델들 (tuned는 fit 후 사용)\ntuned.fit(X_small, y_small, epochs=3, verbose=0)\naucs = {}\nfor name, m in models.items():\n    proba = m.predict(X_test, verbose=0)[:, target]      # 양성 클래스일 확률\n    fprs, tprs, thresholds = roc_curve(y_true_bin, proba)\n    plotROC(fprs, tprs, name)\n    aucs[name] = roc_auc_score(y_true_bin, proba)\nplt.plot([0, 1], [0, 1], \"k--\", label=\"Random\")\nplt.xlabel(\"FPR (1 - Specificity)\"); plt.ylabel(\"TPR (Recall)\"); plt.legend(); plt.show()\nprint(sorted(aucs.items(), key=lambda x: x[1], reverse=True))   # AUC 좋은 순서\n\n# 10개 클래스 전체 AUC (one-vs-rest 평균)\nprint(roc_auc_score(y_test, best_model.predict(X_test, verbose=0), multi_class=\"ovr\"))", "note": "ROC는 이진 분류 기준이라 클래스 하나를 양성으로 정해서 그림. AUC가 1에 가까울수록 좋고 0.5는 랜덤.", "html": "", "out": "", "extra": ""}, {"sec": "tune", "title": "틀린 예측 이미지 보기", "kw": "틀린 오분류 misclassified 예측 틀린 이미지 시각화 확인", "code": "wrong = np.where(y_pred != y_test)[0]\nprint(\"틀린 개수:\", len(wrong))\nplt.figure(figsize=(12, 3))\nfor i, idx in enumerate(wrong[:8]):\n    plt.subplot(1, 8, i + 1)\n    plt.imshow(X_test[idx], cmap=\"binary\"); plt.axis(\"off\")\n    plt.title(f\"{class_names[y_pred[idx]]}\\n(true {class_names[y_test[idx]]})\", fontsize=8)\nplt.show()", "note": "", "html": "", "out": "", "extra": ""}, {"sec": "tune", "title": "모델 구조 그림 (plot_model)", "kw": "plot_model 모델 구조 그림 시각화 graphviz show_shapes", "code": "keras.utils.plot_model(best_model, \"model.png\", show_shapes=True)   # Colab: 그림이 바로 표시됨\n# 그림이 안 되면 (pydot/graphviz 없음): best_model.summary() 로 대신", "note": "", "html": "", "out": "", "extra": ""}, {"sec": "pandas", "title": "데이터 훑어보기", "kw": "head tail info describe shape columns 행 열 개수 요약", "code": "df = pd.read_csv(\"Salary2024.csv\")\nprint(df.shape)        # (행, 열)\ndf.head()              # 앞 5줄\n# df.tail(), df.info(), df.describe(), df.columns", "note": "", "html": "", "out": "(6599, 11)", "extra": ""}, {"sec": "pandas", "title": "항목별 개수 (value_counts)", "kw": "value_counts 개수 몇명 빈도 count 세기", "code": "df[\"job_title\"].value_counts()\n# 비율로: df[\"job_title\"].value_counts(normalize=True)\n# 상위 10개: df[\"job_title\"].value_counts().head(10)", "note": "", "html": "", "out": "experience_level\nSenior-level       4105\nMid-level          1675\nEntry-level         565\nExecutive-level     254\nName: count, dtype: int64", "extra": ""}, {"sec": "pandas", "title": "종류 수 · 종류 목록 (nunique / unique)", "kw": "nunique unique 종류 몇개 고유값 중복 제거", "code": "print(df[\"job_title\"].nunique())    # 종류 수\nprint(df[\"job_title\"].unique())     # 종류 목록", "note": "", "html": "", "out": "132", "extra": ""}, {"sec": "pandas", "title": "그룹별 최소·최대·평균 (groupby + agg)", "kw": "groupby 그룹 agg min max mean 최소 최대 평균 집계", "code": "df.groupby(\"job_title\")[\"salary_in_usd\"].agg([\"min\", \"max\", \"mean\"])\n# 평균만: df.groupby(\"job_title\")[\"salary_in_usd\"].mean()\n# 여러 기준: df.groupby([\"experience_level\", \"work_models\"])[\"salary_in_usd\"].mean()", "note": "", "html": "", "out": "                    min     max      mean\nexperience_level                         \nEntry-level       15000  350000   84448.9\nExecutive-level   15000  465000  189687.3\nMid-level         15000  750000  119019.8\nSenior-level      15809  750000  162071.1", "extra": ""}, {"sec": "pandas", "title": "그룹 평균 상위 N개", "kw": "정렬 sort_values 상위 top 내림차순 ascending 높은 순 nlargest", "code": "df.groupby(\"job_title\")[\"salary_in_usd\"].mean().sort_values(ascending=False).head(5)\n# 같은 결과: df.groupby(\"job_title\")[\"salary_in_usd\"].mean().nlargest(5)", "note": "", "html": "", "out": "job_title\nAnalytics Engineering Manager     399880.0\nData Science Tech Lead            375000.0\nManaging Director Data Science    280000.0\nAWS Data Architect                258000.0\nCloud Data Architect              250000.0\nName: salary_in_usd, dtype: float64", "extra": ""}, {"sec": "pandas", "title": "조건으로 행 거르기", "kw": "필터 filter 조건 boolean 불리언 and or & | 이상 이하 같은", "code": "high = df[df[\"salary_in_usd\"] >= 200000]\nremote_high = df[(df[\"work_models\"] == \"Remote\") & (df[\"salary_in_usd\"] >= 200000)]\nus_or_ca = df[(df[\"company_location\"] == \"United States\") | (df[\"company_location\"] == \"Canada\")]\nprint(len(remote_high))\n# 여러 값 중 하나: df[df[\"company_size\"].isin([\"Large\", \"Medium\"])]", "note": "", "html": "", "out": "448", "extra": ""}, {"sec": "pandas", "title": "열 선택 · 새 열 만들기", "kw": "열 선택 column 새 열 추가 계산 컬럼", "code": "sub = df[[\"job_title\", \"salary_in_usd\"]]\ndf[\"salary_k\"] = df[\"salary_in_usd\"] / 1000\ndf[\"is_remote\"] = df[\"work_models\"] == \"Remote\"", "note": "", "html": "", "out": "", "extra": ""}, {"sec": "pandas", "title": "loc · iloc", "kw": "loc iloc 인덱싱 위치 행 선택 슬라이싱", "code": "df.iloc[0:5, 0:3]                              # 위치로\ndf.loc[df[\"work_year\"] == 2024, [\"job_title\", \"salary_in_usd\"]]   # 조건 + 열 이름", "note": "", "html": "", "out": "", "extra": ""}, {"sec": "pandas", "title": "정렬", "kw": "sort_values 정렬 오름차순 내림차순 ascending", "code": "df.sort_values(\"salary_in_usd\", ascending=False).head(10)\ndf.sort_values([\"work_year\", \"salary_in_usd\"], ascending=[True, False])", "note": "", "html": "", "out": "", "extra": ""}, {"sec": "pandas", "title": "결측치", "kw": "결측치 null nan isnull dropna fillna 빈값 missing", "code": "df.isnull().sum()            # 열별 결측치 개수\ndf_clean = df.dropna()       # 결측 행 삭제\ndf_filled = df.fillna(0)     # 0으로 채우기", "note": "", "html": "", "out": "job_title           0\nexperience_level    0\nemployment_type     0\nwork_models         0\ndtype: int64", "extra": ""}, {"sec": "pandas", "title": "피벗 테이블", "kw": "pivot_table 피벗 교차표 crosstab 두 기준", "code": "df.pivot_table(index=\"experience_level\", columns=\"work_models\",\n               values=\"salary_in_usd\", aggfunc=\"mean\")\n# 개수 교차표: pd.crosstab(df[\"experience_level\"], df[\"company_size\"])", "note": "", "html": "", "out": "work_models         Hybrid   On-site    Remote\nexperience_level                              \nEntry-level        63998.0   96934.0   75154.0\nExecutive-level   147369.0  185062.0  198581.0\nMid-level          76991.0  129771.0  107084.0\nSenior-level      106146.0  166657.0  157343.0", "extra": ""}, {"sec": "pandas", "title": "그래프 (막대 · 히스토그램)", "kw": "plot bar 막대 그래프 hist 히스토그램 시각화 차트", "code": "df.groupby(\"work_year\")[\"salary_in_usd\"].mean().plot(kind=\"bar\")\nplt.ylabel(\"mean salary (USD)\")\nplt.show()\ndf[\"salary_in_usd\"].plot(kind=\"hist\", bins=30)\nplt.show()", "note": "", "html": "", "out": "", "extra": ""}, {"sec": "pandas", "title": "문자열 포함 검색", "kw": "str contains 포함 문자열 검색 대소문자", "code": "ml = df[df[\"job_title\"].str.contains(\"Machine Learning\")]\nprint(len(ml))", "note": "", "html": "", "out": "", "extra": ""}, {"sec": "pandas", "title": "중복 · 인덱스 정리", "kw": "drop_duplicates 중복 reset_index rename 이름 바꾸기", "code": "df_unique = df.drop_duplicates()\ng = df.groupby(\"job_title\")[\"salary_in_usd\"].mean().reset_index()   # 시리즈 → 표\ng = g.rename(columns={\"salary_in_usd\": \"mean_salary\"})", "note": "", "html": "", "out": "", "extra": ""}, {"sec": "pandas", "title": "작년 시험 유형: 직종별·연도별 연봉 집계 상위 10개", "kw": "작년 시험 기출 중간고사 직종별 연도별 상위 10개 groupby 두개 정렬 sort_values 2024년", "code": "df = pd.read_csv('/content/Salary2024.csv')        # Colab 업로드 경로\n\n# a. 직종별 연봉을 연도별로 각각 집계 → 평균 상위 10개\na = df.groupby(['job_title', 'work_year'])['salary_in_usd'].agg(['min', 'max', 'mean'])\na = a.sort_values(by='mean', ascending=False)      # ← 결과를 다시 저장해야 정렬이 반영됨\na.head(10)\n\n# b. 2024년 직종 평균 상위 10개\nb = df[df['work_year'] == 2024]                     # ← 2024년만 먼저 거르기\nb.groupby('job_title')['salary_in_usd'].mean().sort_values(ascending=False).head(10)", "note": "작년 답안에서 자주 틀린 두 곳: ① sort_values()는 원본을 바꾸지 않음 → 변수에 다시 넣거나 이어서(.head) 써야 함 ② '2024년' 조건이 있으면 groupby 전에 df[df['work_year'] == 2024]로 거르기.", "html": "", "out": "", "extra": ""}, {"sec": "numpy", "title": "sigmoid · softmax · 교차 엔트로피", "kw": "sigmoid softmax cross entropy 교차엔트로피 손실 함수 구현 numpy", "code": "def sigmoid(x):\n    return 1 / (1 + np.exp(-x))\n\ndef softmax(x):\n    exp_x = np.exp(x - np.max(x, axis=-1, keepdims=True))   # 오버플로 방지\n    return exp_x / np.sum(exp_x, axis=-1, keepdims=True)\n\ndef cross_entropy_loss(y_actual, y_pred):\n    y_pred = np.clip(y_pred, 1e-15, 1 - 1e-15)              # log(0) 방지\n    return -np.sum(y_actual * np.log(y_pred)) / len(y_actual)", "note": "", "html": "", "out": "", "extra": ""}, {"sec": "numpy", "title": "순전파 (784 → 16 → 16 → 10)", "kw": "순전파 feedforward forward 가중치 초기화 xavier 세이비어 dot", "code": "from tensorflow.keras.utils import to_categorical\nXb = X_train[:64].reshape(64, 784)\nYb = to_categorical(y_train[:64], 10)\nw_1 = np.random.randn(16, 784) * np.sqrt(2 / (784 + 16)); b_1 = np.zeros(16)\nw_2 = np.random.randn(16, 16) * np.sqrt(2 / (16 + 16));   b_2 = np.zeros(16)\nw_o = np.random.randn(10, 16) * np.sqrt(2 / (16 + 10));   b_o = np.zeros(10)\n\na_1 = sigmoid(np.dot(w_1, Xb.T).T + b_1)         # (64, 16)\na_2 = sigmoid(np.dot(w_2, a_1.T).T + b_2)        # (64, 16)\noutput = softmax(np.dot(w_o, a_2.T).T + b_o)     # (64, 10)\nprint(cross_entropy_loss(Yb, output))", "note": "", "html": "", "out": "", "extra": ""}, {"sec": "numpy", "title": "역전파 · 가중치 갱신", "kw": "역전파 backpropagation backprop gradient 기울기 체인룰 chain rule 갱신 update", "code": "lr = 1.0\nfor i in range(200):\n    a_1 = sigmoid(np.dot(w_1, Xb.T).T + b_1)\n    a_2 = sigmoid(np.dot(w_2, a_1.T).T + b_2)\n    output = softmax(np.dot(w_o, a_2.T).T + b_o)\n\n    d_output = output - Yb                                       # softmax + CE 미분\n    d_w_o = np.dot(d_output.T, a_2) / len(Yb); d_b_o = np.sum(d_output, axis=0) / len(Yb)\n    d_l2 = np.dot(d_output, w_o) * (a_2 * (1 - a_2))             # sigmoid 미분\n    d_w_2 = np.dot(d_l2.T, a_1) / len(Yb);     d_b_2 = np.sum(d_l2, axis=0) / len(Yb)\n    d_l1 = np.dot(d_l2, w_2) * (a_1 * (1 - a_1))\n    d_w_1 = np.dot(d_l1.T, Xb) / len(Yb);      d_b_1 = np.sum(d_l1, axis=0) / len(Yb)\n\n    w_o -= lr * d_w_o; b_o -= lr * d_b_o\n    w_2 -= lr * d_w_2; b_2 -= lr * d_b_2\n    w_1 -= lr * d_w_1; b_1 -= lr * d_b_1\n    if i % 50 == 0:\n        print(i, cross_entropy_loss(Yb, output))", "note": "", "html": "", "out": "", "extra": ""}, {"sec": "error", "title": "자주 나는 에러", "kw": "에러 error 오류 안됨 해결 경고 warning", "code": "", "note": "", "html": "<table>\n<tr><th>에러 / 증상<\/th><th>해결<\/th><\/tr>\n<tr><td><code>No module named 'tensorflow'<\/code><\/td><td><code>!pip install tensorflow<\/code> 후 커널 재시작<\/td><\/tr>\n<tr><td><code>predict_classes<\/code> 없음<\/td><td><code>np.argmax(model.predict(X), axis=-1)<\/code><\/td><\/tr>\n<tr><td><code>lr<\/code> 인자 에러<\/td><td><code>learning_rate=<\/code><\/td><\/tr>\n<tr><td><code>model.save<\/code> 확장자 에러<\/td><td>파일명 끝에 <code>.keras<\/code><\/td><\/tr>\n<tr><td><code>Shapes (None, 10) and (None, 1) are incompatible<\/code><\/td><td>정수 레이블이면 <code>sparse_categorical_crossentropy<\/code>, 원-핫이면 <code>categorical_crossentropy<\/code><\/td><\/tr>\n<tr><td><code>Do not pass an input_shape<\/code> 경고<\/td><td>첫 줄에 <code>keras.layers.Input(shape=(28, 28))<\/code> (경고라 무시해도 동작함)<\/td><\/tr>\n<tr><td>LeakyReLU <code>alpha<\/code> 경고<\/td><td><code>negative_slope=0.2<\/code><\/td><\/tr>\n<tr><td><code>FileNotFoundError<\/code> (CSV)<\/td><td>로컬은 노트북과 같은 폴더에 두고 파일명만, Colab은 <code>/content/<\/code><\/td><\/tr>\n<tr><td><code>KeyError: '열이름'<\/code><\/td><td><code>df.columns<\/code>로 정확한 철자 확인<\/td><\/tr>\n<tr><td>옵티마이저 관련 <code>Unknown variable<\/code><\/td><td>옵티마이저 객체를 모델마다 새로 만들기<\/td><\/tr>\n<tr><td>정확도 10% 근처에서 안 오름<\/td><td>/255 했는지, loss 종류, 출력층 softmax 확인<\/td><\/tr>\n<tr><td>학습이 너무 오래 걸림<\/td><td>epochs 줄이기, <code>verbose=2<\/code><\/td><\/tr>\n<tr><td><code>No module named 'keras.layers.core'<\/code><\/td><td><code>from keras.layers import Dense, Dropout, Flatten, Activation<\/code> (core 빼기)<\/td><\/tr>\n<tr><td><code>scipy.ndimage.filters<\/code> 경고·에러<\/td><td><code>from scipy.ndimage import convolve<\/code><\/td><\/tr>\n<tr><td>Conv2D <code>expected ndim=4<\/code><\/td><td>채널 차원 추가: <code>X[..., np.newaxis]<\/code> 또는 <code>X.reshape(-1, 28, 28, 1)<\/code><\/td><\/tr>\n<tr><td>불러오기 <code>Could not locate function 'huber_fn'<\/code><\/td><td><code>load_model(..., custom_objects={\"huber_fn\": huber_fn})<\/code><\/td><\/tr>\n<tr><td>GradientTape 결과가 <code>None<\/code><\/td><td>변수가 constant → <code>tf.Variable<\/code>로 만들거나 <code>tape.watch(c)<\/code><\/td><\/tr>\n<tr><td><code>InvalidArgumentError<\/code> (float32 + int32)<\/td><td><code>tf.cast(t, tf.float32)<\/code>로 타입 맞추기<\/td><\/tr>\n<tr><td><code>'ResourceVariable' object does not support item assignment<\/code><\/td><td><code>v[1] = ...<\/code> 대신 <code>v[1].assign(...)<\/code><\/td><\/tr>\n<tr><td><code>google.colab<\/code> 에러<\/td><td>Colab 전용 코드(손글씨 그리기). 로컬에서는 그 셀 건너뛰기<\/td><\/tr>\n<\/table>", "out": "", "extra": ""}, {"sec": "words", "title": "기법 한 줄 정리 (마크다운 답안용)", "kw": "정리 설명 한줄 마크다운 he relu elu 배치정규화 adam 모멘텀 nag dropout 조기종료", "code": "", "note": "", "html": "<ul>\n<li><b>He 초기화<\/b>: ReLU 계열에 맞게 처음 가중치 크기(분산 2/fan_in)를 잡아 학습이 잘 시작되게 함<\/li>\n<li><b>Glorot(Xavier) 초기화<\/b>: 케라스 기본값. 분산 1/fan_avg. sigmoid·tanh와 짝<\/li>\n<li><b>ReLU<\/b>: 0보다 작으면 0, 크면 그대로. sigmoid보다 기울기 소실이 적음<\/li>\n<li><b>LeakyReLU<\/b>: 음수에도 작은 기울기를 줘서 뉴런이 죽는(출력 0에 갇히는) 문제를 줄임<\/li>\n<li><b>ELU<\/b>: 음수 쪽을 지수함수로 부드럽게. 평균이 0에 가까워 학습이 안정적<\/li>\n<li><b>SELU<\/b>: 스케일된 ELU. 르쿤 초기화와 함께 쓰면 층마다 스스로 정규화됨<\/li>\n<li><b>배치 정규화<\/b>: 미니배치마다 층 출력의 평균 0, 분산 1로 맞춘 뒤 γ·β로 조정. 학습이 빠르고 안정적<\/li>\n<li><b>Momentum<\/b>: 이전에 가던 방향으로 관성을 줘 더 빨리 내려감<\/li>\n<li><b>NAG<\/b>: 관성 방향으로 먼저 가본 위치의 기울기를 써서 진동이 줄고 더 빨리 수렴<\/li>\n<li><b>AdaGrad<\/b>: 많이 움직인 방향은 학습률을 줄임. 너무 일찍 멈추는 단점<\/li>\n<li><b>RMSProp<\/b>: 최근 기울기만 반영(지수 이동평균)해 AdaGrad 단점 보완<\/li>\n<li><b>Adam<\/b>: Momentum + RMSProp. 실무에서 가장 많이 씀<\/li>\n<li><b>Nadam<\/b>: Adam + Nesterov<\/li>\n<li><b>Dropout<\/b>: 학습 때 뉴런 일부를 랜덤하게 꺼서 특정 뉴런 의존을 줄이고 과대적합 방지<\/li>\n<li><b>L1 / L2 규제<\/b>: 가중치가 커지지 않게 벌점. L1은 0으로 만들어 희소하게<\/li>\n<li><b>조기 종료<\/b>: 검증 손실이 더 안 좋아지면 학습을 멈추고 가장 좋았던 가중치로 되돌림<\/li>\n<li><b>전이 학습<\/b>: 학습된 모델의 앞쪽 층을 재사용(동결)하고 출력층만 새로 학습<\/li>\n<li><b>데이터 증강<\/b>: 회전·이동 등으로 훈련 이미지를 늘려 일반화 향상<\/li>\n<\/ul>", "out": "", "extra": ""}, {"sec": "words", "title": "문제점 한 줄 정리", "kw": "기울기 소실 폭주 vanishing exploding 과대적합 overfitting 과적합 문제점", "code": "", "note": "", "html": "<ul>\n<li><b>기울기 소실<\/b>: 역전파 중 아래층으로 갈수록 기울기가 0에 가까워져 학습이 안 됨. sigmoid 도함수 최대 0.25가 층마다 곱해지는 것이 원인 → 초기화, ReLU 계열, 배치 정규화로 완화<\/li>\n<li><b>기울기 폭주<\/b>: 기울기가 점점 커져 발산. RNN처럼 되먹임 구조에서 주로 발생<\/li>\n<li><b>과대적합<\/b>: 훈련 데이터에만 맞고 새 데이터에 약함. loss는 줄어드는데 val_loss가 오르면 신호 → Dropout, 규제, 조기 종료, 데이터 증강<\/li>\n<li><b>학습률<\/b>: 너무 크면 발산, 너무 작으면 매우 느림<\/li>\n<li><b>softmax + 교차 엔트로피<\/b>: 미분이 (예측 − 정답)으로 간단해서 분류에 씀. 회귀는 MSE<\/li>\n<\/ul>", "out": "", "extra": ""}, {"sec": "words", "title": "옵티마이저 비교표", "kw": "옵티마이저 비교 수렴 속도 품질 표 11-2", "code": "", "note": "", "html": "<table>\n<tr><th>옵티마이저<\/th><th>수렴 속도<\/th><th>수렴 품질<\/th><\/tr>\n<tr><td>SGD<\/td><td>느림<\/td><td>좋음<\/td><\/tr>\n<tr><td>Momentum / NAG<\/td><td>보통<\/td><td>좋음<\/td><\/tr>\n<tr><td>Adagrad<\/td><td>빠름<\/td><td>나쁨 (너무 일찍 멈춤)<\/td><\/tr>\n<tr><td>RMSprop / Adam / Nadam<\/td><td>빠름<\/td><td>보통~좋음<\/td><\/tr>\n<\/table>", "out": "", "extra": ""}]}</script>
<script>
(function(){
  var data = JSON.parse(document.getElementById('data').textContent);
  var S = data.items, SECS = data.sections;
  var list = document.getElementById('list'), q = document.getElementById('q'),
      nav = document.getElementById('nav'), count = document.getElementById('count');
  var current = 'all';
  function norm(t){ return (t||'').toLowerCase().replace(/[\s·\-_.,/()]+/g,''); }
  function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function stripTags(h){ var d=document.createElement('div'); d.innerHTML=h; return d.textContent; }
  S.forEach(function(s){ s.hay = norm(s.title+' '+s.kw+' '+s.code+' '+s.note+' '+stripTags(s.html||'')+' '+(s.out||'')+' '+stripTags(s.extra||'')); });

  // nav
  var allBtn = mk('전체','all'); nav.appendChild(allBtn);
  SECS.forEach(function(p){ nav.appendChild(mk(p[1], p[0])); });
  function mk(label, key){
    var b=document.createElement('button'); b.type='button'; b.textContent=label; b.dataset.k=key;
    b.setAttribute('aria-pressed', key==='all'?'true':'false');
    b.onclick=function(){ current=key; [].forEach.call(nav.children,function(x){x.setAttribute('aria-pressed', x.dataset.k===key?'true':'false')}); render(); };
    return b;
  }
  function hl(text, toks){
    var h = esc(text);
    toks.forEach(function(t){ if(t.length<2) return;
      var re = new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
      h = h.replace(re,'<mark>$1</mark>'); });
    return h;
  }
  function render(){
    var raw = q.value.trim(), toks = raw.split(/\s+/).filter(Boolean), ntoks = toks.map(norm).filter(Boolean);
    var shown = S.filter(function(s){
      if(current!=='all' && s.sec!==current) return false;
      return ntoks.every(function(t){ return s.hay.indexOf(t)>-1; });
    });
    if(ntoks.length){
      shown.forEach(function(x,i){ x._i=i; var t=norm(x.title), k=norm(x.kw);
        x._sc = (ntoks.every(function(q){return t.indexOf(q)>-1})?4:0) + (ntoks.every(function(q){return k.indexOf(q)>-1})?2:0) + (x.sec==='concept'?1:0); });
      shown.sort(function(a,b){ return (b._sc-a._sc) || (a._i-b._i); });
    }
    count.textContent = shown.length+'개';
    list.innerHTML='';
    if(!shown.length){ list.innerHTML='<div class="empty">찾는 내용이 없습니다. 다른 표현(영문/한글)으로 검색해 보세요.</div>'; return; }
    var lastSec=null;
    shown.forEach(function(s){
      if(!ntoks.length && s.sec!==lastSec){ var h=document.createElement('div'); h.className='sec'; h.textContent=SECS.filter(function(p){return p[0]===s.sec})[0][1]; list.appendChild(h); lastSec=s.sec; }
      var c=document.createElement('article'); c.className='card';
      var secName=SECS.filter(function(p){return p[0]===s.sec})[0][1];
      var inner='<h2>'+hl(s.title,toks)+'<span class="tag">'+secName+'</span></h2>';
      var codeBlock = s.code ? '<div class="codewrap"><pre><code>'+hl(s.code,toks)+'</code></pre><button class="copy" type="button">복사</button></div>' : '';
      if((s.sec==='concept'||s.sec==='lecture'||s.sec==='practice'||s.sec==='nberr') && s.html && s.code){
        inner+='<div class="duo"><div class="html concept">'+s.html+'</div><div class="ex"><div class="outlbl">예제</div>'+codeBlock+'</div></div>';
      } else {
        inner+=codeBlock;
        if(s.out) inner+='<div class="outlbl">출력 예시</div><pre class="out"><code>'+esc(s.out)+'</code></pre>';
        if(s.html) inner+='<div class="html">'+s.html+'</div>';
      }
      if(s.extra) inner+='<div class="extra">'+s.extra+'</div>';
      if(s.note) inner+='<p class="note">'+hl(s.note,toks)+'</p>';
      c.innerHTML=inner;
      c.querySelectorAll('.qa-toggle').forEach(function(b){ b.onclick=function(){
        var t=c.querySelector('table.qa'); var on=t.classList.toggle('hide');
        t.querySelectorAll('td.ans').forEach(function(td){ td.classList.remove('show'); });
        b.setAttribute('aria-pressed', on?'true':'false'); b.textContent = on ? '답 모두 보이기' : '답 가리기 (연습)'; }; });
      c.querySelectorAll('table.qa td.ans').forEach(function(td){ td.onclick=function(){
        if(td.closest('table').classList.contains('hide')) td.classList.toggle('show'); }; });
      var btn=c.querySelector('.copy');
      if(btn){ btn.onclick=function(){ copy(s.code, btn); }; }
      list.appendChild(c);
    });
  }
  function copy(text, btn){
    function ok(){ btn.textContent='복사됨'; btn.classList.add('done'); setTimeout(function(){btn.textContent='복사'; btn.classList.remove('done');},1200); }
    if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(ok, fallback); } else fallback();
    function fallback(){ var t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); try{document.execCommand('copy'); ok();}catch(e){} document.body.removeChild(t); }
  }
  q.addEventListener('input', render);
  document.addEventListener('keydown', function(e){
    if(e.key==='/' && document.activeElement!==q){ e.preventDefault(); q.focus(); q.select(); }
    if(e.key==='Escape'){ q.value=''; render(); q.focus(); }
  });
  var m = location.hash.match(/^#q=(.*)$/); if(m){ q.value=decodeURIComponent(m[1]); }
  render();
})();
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DL Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f4f6f7; --surface:#fff; --fg:#17262e; --muted:#5a6b74; --line:#d8e0e4;
  --accent:#0b6670; --accent-soft:#dff0f1; --code:#eef2f4; --mark:#ffe9a8; --mark-fg:#4d3600;
  --f:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --m:"JetBrains Mono",Consolas,ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#10171b; --surface:#162026; --fg:#e2eaee; --muted:#93a3ac; --line:#29373e;
  --accent:#5ec4cc; --accent-soft:#163439; --code:#0c1316; --mark:#56450f; --mark-fg:#ffe7a3; color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.6}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hin{max-width:1040px;margin:0 auto;padding:14px 16px 10px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0;letter-spacing:-.01em;white-space:nowrap}
h1 span{color:var(--accent)}
#q{flex:1 1 260px;min-width:0;font:inherit;font-size:1rem;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
#q:focus{outline:none;border-color:var(--accent)}
#count{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
nav button{font:inherit;font-size:.82rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
nav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
nav button:focus-visible,.copy:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{max-width:1040px;margin:0 auto;padding:16px 16px 80px}
.sec{margin:22px 0 8px;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;min-width:0}
.card h2{font-size:1rem;margin:0 0 6px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h2 .tag{font-size:.7rem;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.note{color:var(--muted);font-size:.88rem;margin:6px 0 0}
.codewrap{position:relative}
pre{margin:6px 0 0;background:var(--code);border-radius:6px;padding:12px 14px;overflow-x:auto;font-family:var(--m);font-size:.8rem;line-height:1.55}
.copy{position:absolute;top:6px;right:6px;font:inherit;font-size:.75rem;padding:3px 10px;border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.copy.done{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.html{overflow-x:auto;margin-top:6px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.78rem}
code{font-family:var(--m);font-size:.84em;background:var(--code);padding:1px 5px;border-radius:4px}
kbd{font-family:var(--m);font-size:.78em;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
ul{margin:6px 0;padding-left:20px} li{margin:3px 0}
mark{background:var(--mark);color:var(--mark-fg);border-radius:2px}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.hint{font-size:.78rem;color:var(--muted);margin-top:6px}
pre code{background:none;padding:0;font-size:inherit}
@media (max-width:600px){.hint{display:none} nav{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px} nav button{flex:0 0 auto} html{scroll-padding-top:120px}}
</style>
</head>
<body>
<header><div class="hin">
  <div class="row">
    <h1>DL <span>Notes</span></h1>
    <input id="q" type="search" placeholder="검색: 배치정규화, groupby, nesterov, 조기종료, 에러 …" autocomplete="off" autofocus aria-label="검색">
    <span id="count"></span>
  </div>
  <nav id="nav" aria-label="분류"></nav>
  <div class="hint"><kbd>/</kbd> 검색창으로 · <kbd>Esc</kbd> 지우기 · 띄어쓰기 상관없이 찾음 · 여러 단어는 모두 포함된 것만</div>
</div></header>

test.shape)   # (55000,28,28) (5000,28,28) (10000,28,28)", "note": "", "html": ""}, {"sec": "data", "title": "Fashion MNIST + 클래스 이름", "kw": "fashion 패션 의류 class_names 클래스 이름", "code": "(X_train_full, y_train_full), (X_test, y_test) = keras.datasets.fashion_mnist.load_data()\nX_valid, X_train = X_train_full[:5000] / 255., X_train_full[5000:] / 255.\ny_valid, y_train = y_train_full[:5000], y_train_full[5000:]\nX_test = X_test / 255.\nclass_names = [\"T-shirt/top\", \"Trouser\", \"Pullover\", \"Dress\", \"Coat\",\n               \"Sandal\", \"Shirt\", \"Sneaker\", \"Bag\", \"Ankle boot\"]", "note": "", "html": ""}, {"sec": "data", "title": "이미지 보기", "kw": "imshow 그림 이미지 출력 plot 시각화", "code": "plt.imshow(X_train[0], cmap=\"binary\")\nplt.title(str(y_train[0]))\nplt.axis(\"off\")\nplt.show()", "note": "", "html": ""}, {"sec": "data", "title": "원-핫 인코딩", "kw": "one-hot 원핫 to_categorical categorical 레이블", "code": "from tensorflow.keras.utils import to_categorical\nY_train = to_categorical(y_train, 10)\nY_test = to_categorical(y_test, 10)", "note": "원-핫으로 바꿨으면 loss는 categorical_crossentropy. 정수 그대로면 sparse_categorical_crossentropy.", "html": ""}, {"sec": "data", "title": "784 벡터로 펴기 (NumPy용)", "kw": "reshape flatten 784 펴기 벡터 astype float32", "code": "X_train_flat = X_train.reshape(-1, 784).astype(\"float32\")\nX_test_flat = X_test.reshape(-1, 784).astype(\"float32\")", "note": "", "html": ""}, {"sec": "data", "title": "CSV 읽기", "kw": "csv read_csv 파일 읽기 업로드 content 경로", "code": "df = pd.read_csv(\"Salary2024.csv\")             # 노트북과 같은 폴더 (로컬 주피터)\n# df = pd.read_csv(\"/content/Salary2024.csv\")  # Colab에 업로드한 경우", "note": "", "html": ""}, {"sec": "data", "title": "캘리포니아 주택 (회귀) + 스케일링", "kw": "california housing 회귀 regression StandardScaler 스케일 train_test_split", "code": "from sklearn.datasets import fetch_california_housing\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import StandardScaler\nhousing = fetch_california_housing()\nX_train_full, X_test, y_train_full, y_test = train_test_split(housing.data, housing.target, random_state=42)\nX_train, X_valid, y_train, y_valid = train_test_split(X_train_full, y_train_full, random_state=42)\nscaler = StandardScaler()\nX_train = scaler.fit_transform(X_train)   # fit은 훈련 세트에만\nX_valid = scaler.transform(X_valid)\nX_test = scaler.transform(X_test)", "note": "", "html": ""}, {"sec": "model", "title": "문제 문구 → 코드", "kw": "사양 spec 변환 표 initializer activation optimizer he elu nag momentum 배치정규화 dropout", "code": "", "note": "", "html": "<table>\n<tr><th>문제에 적힌 것<\/th><th>코드<\/th><\/tr>\n<tr><td>Hidden 300개<\/td><td><code>keras.layers.Dense(300, ...)<\/code><\/td><\/tr>\n<tr><td>Activation: ReLU / ELU / sigmoid / tanh<\/td><td><code>activation=\"relu\"<\/code> / <code>\"elu\"<\/code> / <code>\"sigmoid\"<\/code> / <code>\"tanh\"<\/code><\/td><\/tr>\n<tr><td>Activation: SELU<\/td><td><code>activation=\"selu\", kernel_initializer=\"lecun_normal\"<\/code><\/td><\/tr>\n<tr><td>Activation: LeakyReLU<\/td><td>Dense 다음 줄 <code>keras.layers.LeakyReLU(alpha=0.2)<\/code><\/td><\/tr>\n<tr><td>Initializer: He<\/td><td><code>kernel_initializer=\"he_normal\"<\/code><\/td><\/tr>\n<tr><td>Initializer: Glorot(Xavier)<\/td><td>기본값 (안 써도 됨) / <code>\"glorot_normal\"<\/code><\/td><\/tr>\n<tr><td>Initializer: LeCun<\/td><td><code>kernel_initializer=\"lecun_normal\"<\/code><\/td><\/tr>\n<tr><td>배치정규화 적용<\/td><td>Dense 다음 줄 <code>keras.layers.BatchNormalization()<\/code><\/td><\/tr>\n<tr><td>Dropout 0.2<\/td><td><code>keras.layers.Dropout(0.2)<\/code><\/td><\/tr>\n<tr><td>L2 규제<\/td><td><code>kernel_regularizer=keras.regularizers.l2(0.01)<\/code><\/td><\/tr>\n<tr><td>Optimizer: SGD<\/td><td><code>optimizer=\"sgd\"<\/code><\/td><\/tr>\n<tr><td>Momentum 0.9<\/td><td><code>keras.optimizers.SGD(learning_rate=0.01, momentum=0.9)<\/code><\/td><\/tr>\n<tr><td>NAG (Nesterov)<\/td><td><code>keras.optimizers.SGD(learning_rate=0.01, momentum=0.9, nesterov=True)<\/code><\/td><\/tr>\n<tr><td>Adam / RMSprop / Nadam / Adagrad<\/td><td><code>optimizer=\"adam\"<\/code> / <code>\"rmsprop\"<\/code> / <code>\"nadam\"<\/code> / <code>\"adagrad\"<\/code><\/td><\/tr>\n<tr><td>Output: Softmax (10개)<\/td><td><code>keras.layers.Dense(10, activation=\"softmax\")<\/code><\/td><\/tr>\n<\/table>"}, {"sec": "model", "title": "기본 모델 (은닉 300·100)", "kw": "sequential 시퀀셜 모델 dense 은닉층 hidden relu softmax 기본", "code": "model = keras.Sequential([\n    keras.layers.Input(shape=(28, 28)),\n    keras.layers.Flatten(),                          # 28x28 → 784\n    keras.layers.Dense(300, activation=\"relu\"),\n    keras.layers.Dense(100, activation=\"relu\"),\n    keras.layers.Dense(10, activation=\"softmax\")     # 0~9\n])\nmodel.summary()", "note": "", "html": ""}, {"sec": "model", "title": "He 초기화 / 르쿤 / 랜덤 정규분포", "kw": "initializer 초기화 he_normal kernel_initializer glorot xavier lecun RandomNormal", "code": "model = keras.Sequential([\n    keras.layers.Input(shape=(28, 28)),\n    keras.layers.Flatten(),\n    keras.layers.Dense(300, activation=\"relu\", kernel_initializer=\"he_normal\"),\n    keras.layers.Dense(100, activation=\"relu\", kernel_initializer=\"he_normal\"),\n    keras.layers.Dense(10, activation=\"softmax\")\n])\n# 다른 초기화\n# kernel_initializer=\"glorot_uniform\"   (기본값)\n# kernel_initializer=\"lecun_normal\"     (SELU와 함께)\n# kernel_initializer=keras.initializers.RandomNormal(mean=0.0, stddev=0.05)", "note": "짝: ReLU·ELU·LeakyReLU → He / sigmoid·tanh·softmax → Glorot / SELU → LeCun", "html": ""}, {"sec": "model", "title": "ELU · SELU · sigmoid 모델", "kw": "elu selu sigmoid tanh 활성화 activation 바꾸기", "code": "model_elu = keras.Sequential([\n    keras.layers.Input(shape=(28, 28)),\n    keras.layers.Flatten(),\n    keras.layers.Dense(300, activation=\"elu\", kernel_initializer=\"he_normal\"),\n    keras.layers.Dense(100, activation=\"elu\", kernel_initializer=\"he_normal\"),\n    keras.layers.Dense(10, activation=\"softmax\")\n])\nmodel_selu = keras.Sequential([\n    keras.layers.Input(shape=(28, 28)),\n    keras.layers.Flatten(),\n    keras.layers.Dense(300, activation=\"selu\", kernel_initializer=\"lecun_normal\"),\n    keras.layers.Dense(100, activation=\"selu\", kernel_initializer=\"lecun_normal\"),\n    keras.layers.Dense(10, activation=\"softmax\")\n])", "note": "", "html": ""}, {"sec": "model", "title": "LeakyReLU", "kw": "leaky relu 리키렐루 리키 alpha negative_slope 죽은 relu dying", "code": "model = keras.Sequential([\n    keras.layers.Input(shape=(28, 28)),\n    keras.layers.Flatten(),\n    keras.layers.Dense(300, kernel_initializer=\"he_normal\"),\n    keras.layers.LeakyReLU(alpha=0.2),               # activation 문자열이 아니라 층으로\n    keras.layers.Dense(100, kernel_initializer=\"he_normal\"),\n    keras.layers.LeakyReLU(alpha=0.2),\n    keras.layers.Dense(10, activation=\"softmax\")\n])", "note": "경고가 나오면 alpha 대신 negative_slope=0.2 (Keras 3).", "html": ""}, {"sec": "model", "title": "배치 정규화 (Dense 뒤)", "kw": "batch normalization 배치정규화 배치 정규화 BN BatchNormalization", "code": "model = keras.Sequential([\n    keras.layers.Input(shape=(28, 28)),\n    keras.layers.Flatten(),\n    keras.layers.Dense(300, activation=\"relu\", kernel_initializer=\"he_normal\"),\n    keras.layers.BatchNormalization(),\n    keras.layers.Dense(100, activation=\"relu\", kernel_initializer=\"he_normal\"),\n    keras.layers.BatchNormalization(),\n    keras.layers.Dense(10, activation=\"softmax\")\n])", "note": "", "html": ""}, {"sec": "model", "title": "배치 정규화 (활성화 앞, Week4 방식)", "kw": "batch normalization 배치정규화 활성화 앞 use_bias Activation week4 과제", "code": "model = keras.Sequential([\n    keras.layers.Input(shape=(28, 28)),\n    keras.layers.Flatten(),\n    keras.layers.Dense(200, kernel_initializer=\"he_normal\", use_bias=False),\n    keras.layers.BatchNormalization(),\n    keras.layers.Activation(\"elu\"),\n    keras.layers.Dense(100, kernel_initializer=\"he_normal\", use_bias=False),\n    keras.layers.BatchNormalization(),\n    keras.layers.Activation(\"elu\"),\n    keras.layers.Dense(10, activation=\"softmax\")\n])", "note": "BN의 β가 편향 역할을 하므로 use_bias=False (안 써도 동작은 같음).", "html": ""}, {"sec": "model", "title": "Dropout", "kw": "dropout 드롭아웃 드랍아웃 과대적합 overfitting 규제", "code": "model = keras.Sequential([\n    keras.layers.Input(shape=(28, 28)),\n    keras.layers.Flatten(),\n    keras.layers.Dense(300, activation=\"relu\", kernel_initializer=\"he_normal\"),\n    keras.layers.Dropout(0.2),\n    keras.layers.Dense(100, activation=\"relu\", kernel_initializer=\"he_normal\"),\n    keras.layers.Dropout(0.2),\n    keras.layers.Dense(10, activation=\"softmax\")\n])", "note": "비율 10~50%. 학습할 때만 꺼지고 evaluate·predict 때는 모두 사용.", "html": ""}, {"sec": "model", "title": "L1 · L2 규제", "kw": "l1 l2 regularizer 규제 kernel_regularizer 가중치 감쇠", "code": "model = keras.Sequential([\n    keras.layers.Input(shape=(28, 28)),\n    keras.layers.Flatten(),\n    keras.layers.Dense(300, activation=\"relu\", kernel_initializer=\"he_normal\",\n                       kernel_regularizer=keras.regularizers.l2(0.01)),\n    keras.layers.Dense(100, activation=\"relu\", kernel_initializer=\"he_normal\",\n                       kernel_regularizer=keras.regularizers.l1(0.01)),\n    keras.layers.Dense(10, activation=\"softmax\")\n])\n# 둘 다: keras.regularizers.l1_l2(l1=0.01, l2=0.01)", "note": "L1은 가중치를 0으로 만들어 희소하게, L2는 가중치를 작게 유지.", "html": ""}, {"sec": "model", "title": "함수형 API (와이드 & 딥)", "kw": "functional 함수형 wide deep 와이드 딥 concatenate Input Model", "code": "input_ = keras.layers.Input(shape=[8])\nhidden1 = keras.layers.Dense(30, activation=\"relu\")(input_)\nhidden2 = keras.layers.Dense(30, activation=\"relu\")(hidden1)\nconcat = keras.layers.concatenate([input_, hidden2])\noutput = keras.layers.Dense(1)(concat)\nmodel_wd = keras.Model(inputs=[input_], outputs=[output])\nmodel_wd.summary()", "note": "", "html": ""}, {"sec": "model", "title": "입력 2개 모델", "kw": "다중 입력 multi input 입력 두개 wide_input deep_input", "code": "input_A = keras.layers.Input(shape=[5], name=\"wide_input\")\ninput_B = keras.layers.Input(shape=[6], name=\"deep_input\")\nhidden1 = keras.layers.Dense(30, activation=\"relu\")(input_B)\nhidden2 = keras.layers.Dense(30, activation=\"relu\")(hidden1)\nconcat = keras.layers.concatenate([input_A, hidden2])\noutput = keras.layers.Dense(1, name=\"output\")(concat)\nmodel_ab = keras.Model(inputs=[input_A, input_B], outputs=[output])\nmodel_ab.compile(loss=\"mse\", optimizer=keras.optimizers.SGD(learning_rate=1e-3))\n# fit할 때 튜플로: model_ab.fit((X_train[:, :5], X_train[:, 2:]), y_train, epochs=20)", "note": "", "html": ""}, {"sec": "model", "title": "전이 학습 (층 재사용 · 동결)", "kw": "transfer learning 전이학습 전이 학습 freeze 동결 trainable 재사용", "code": "model_B = keras.Sequential(model.layers[:-1])            # 출력층 빼고 재사용\nmodel_B.add(keras.layers.Dense(5, activation=\"softmax\"))  # 새 출력층\nfor layer in model_B.layers[:-1]:\n    layer.trainable = False                                # 동결\nmodel_B.compile(loss=\"sparse_categorical_crossentropy\", optimizer=\"sgd\", metrics=[\"accuracy\"])\n# 몇 epoch 학습 후 동결 풀고 다시 compile → 작은 학습률로 미세 조정", "note": "", "html": ""}, {"sec": "model", "title": "오토인코더 (784 → 20 → 784)", "kw": "autoencoder 오토인코더 인코더 디코더 encoder decoder 이상 탐지 anomaly", "code": "encoder = keras.Sequential([keras.layers.Input(shape=(784,)),\n                            keras.layers.Dense(20, activation=\"relu\")])\ndecoder = keras.Sequential([keras.layers.Input(shape=(20,)),\n                            keras.layers.Dense(784, activation=\"sigmoid\")])\nautoencoder = keras.Sequential([encoder, decoder])\nautoencoder.compile(loss=\"mse\", optimizer=\"adam\")\n# autoencoder.fit(X, X, epochs=5)   # 입력 = 정답", "note": "", "html": ""}, {"sec": "model", "title": "파라미터 수 계산", "kw": "summary 파라미터 params param 개수 계산 trainable non-trainable", "code": "", "note": "", "html": "<p><b>Dense<\/b> = 입력 수 × 뉴런 수 + 뉴런 수 &nbsp;·&nbsp; <b>BatchNormalization<\/b> = 입력 수 × 4 (γ·β 훈련 가능, 이동평균·분산 훈련 불가) &nbsp;·&nbsp; Flatten·Dropout = 0<\/p>\n<table>\n<tr><th>층<\/th><th>계산<\/th><th>값<\/th><\/tr>\n<tr><td>Dense(300) ← 784<\/td><td>784×300+300<\/td><td>235,500<\/td><\/tr>\n<tr><td>Dense(100) ← 300<\/td><td>300×100+100<\/td><td>30,100<\/td><\/tr>\n<tr><td>Dense(10) ← 100<\/td><td>100×10+10<\/td><td>1,010<\/td><\/tr>\n<tr><td colspan=\"2\">합계<\/td><td>266,610<\/td><\/tr>\n<tr><td>Dense(200, use_bias=False) ← 784<\/td><td>784×200<\/td><td>156,800<\/td><\/tr>\n<tr><td>BatchNormalization(200)<\/td><td>200×4<\/td><td>800<\/td><\/tr>\n<\/table>"}, {"sec": "compile", "title": "compile 기본 + 손실 함수 고르기", "kw": "compile 컴파일 loss 손실 sparse_categorical_crossentropy categorical binary mse metrics accuracy", "code": "model.compile(loss=\"sparse_categorical_crossentropy\",\n              optimizer=\"sgd\",\n              metrics=[\"accuracy\"])", "note": "", "html": "<table>\n<tr><th>상황<\/th><th>출력층<\/th><th>loss<\/th><\/tr>\n<tr><td>레이블이 정수 0~9<\/td><td>Dense(10, softmax)<\/td><td><code>sparse_categorical_crossentropy<\/code><\/td><\/tr>\n<tr><td>레이블이 원-핫<\/td><td>Dense(10, softmax)<\/td><td><code>categorical_crossentropy<\/code><\/td><\/tr>\n<tr><td>이진 분류<\/td><td>Dense(1, sigmoid)<\/td><td><code>binary_crossentropy<\/code><\/td><\/tr>\n<tr><td>회귀(숫자 예측)<\/td><td>Dense(1)<\/td><td><code>mse<\/code><\/td><\/tr>\n<\/table>"}, {"sec": "compile", "title": "SGD · Momentum · NAG", "kw": "sgd momentum 모멘텀 nesterov 네스테로프 nag 확률적 경사하강법", "code": "opt_sgd = keras.optimizers.SGD(learning_rate=0.01)\nopt_momentum = keras.optimizers.SGD(learning_rate=0.01, momentum=0.9)\nopt_nag = keras.optimizers.SGD(learning_rate=0.01, momentum=0.9, nesterov=True)\nmodel.compile(loss=\"sparse_categorical_crossentropy\", optimizer=opt_nag, metrics=[\"accuracy\"])", "note": "", "html": ""}, {"sec": "compile", "title": "Adam · RMSprop · Nadam · Adagrad", "kw": "adam rmsprop nadam adagrad 아담 옵티마이저 optimizer beta", "code": "opt_adam = keras.optimizers.Adam(learning_rate=0.001, beta_1=0.9, beta_2=0.999)\nopt_rms = keras.optimizers.RMSprop(learning_rate=0.001, rho=0.9)\nopt_nadam = keras.optimizers.Nadam(learning_rate=0.001)\nopt_adagrad = keras.optimizers.Adagrad(learning_rate=0.01)\nmodel.compile(loss=\"sparse_categorical_crossentropy\", optimizer=opt_adam, metrics=[\"accuracy\"])\n# 기본값 그대로면 문자열로: optimizer=\"adam\" / \"rmsprop\" / \"nadam\" / \"adagrad\"", "note": "옵티마이저 객체는 모델마다 새로 만들기 (한 객체를 두 모델에 같이 쓰면 에러).", "html": ""}, {"sec": "train", "title": "학습 (fit)", "kw": "fit 학습 훈련 epochs 에포크 batch_size 배치 validation_data verbose", "code": "history = model.fit(X_train, y_train, epochs=5, batch_size=32,\n                    validation_data=(X_valid, y_valid), verbose=2)", "note": "verbose=2면 epoch당 한 줄만 출력. 1epoch 스텝 수 = 55000/32 = 1719.", "html": ""}, {"sec": "train", "title": "테스트 정확도 출력 (evaluate)", "kw": "evaluate 평가 정확도 accuracy 테스트 test 출력", "code": "test_loss, test_acc = model.evaluate(X_test, y_test)\nprint(f\"테스트 정확도: {test_acc:.4f}\")", "note": "", "html": ""}, {"sec": "train", "title": "예측 (predict + argmax)", "kw": "predict 예측 argmax predict_classes 확률 클래스", "code": "y_proba = model.predict(X_test[:5])\nprint(y_proba.round(2))\ny_pred = np.argmax(y_proba, axis=-1)\nprint(\"예측:\", y_pred)\nprint(\"정답:\", y_test[:5])\n# Fashion MNIST면 이름으로: np.array(class_names)[y_pred]", "note": "", "html": ""}, {"sec": "train", "title": "학습 곡선 그리기", "kw": "history 학습곡선 그래프 plot loss accuracy val_loss 시각화", "code": "pd.DataFrame(history.history).plot(figsize=(8, 5))\nplt.grid(True)\nplt.gca().set_ylim(0, 1)\nplt.xlabel(\"epoch\")\nplt.show()", "note": "", "html": ""}, {"sec": "train", "title": "두 모델 손실 비교 그래프", "kw": "비교 compare 손실 loss 그래프 두개 여러 모델 plot legend", "code": "h1 = history          # 첫 번째 모델 fit 결과\nh2 = history          # 두 번째 모델 fit 결과 (예: h2 = model2.fit(...))\nplt.plot(h1.history[\"loss\"], label=\"model 1\")\nplt.plot(h2.history[\"loss\"], label=\"model 2\")\nplt.xlabel(\"epoch\"); plt.ylabel(\"loss\"); plt.legend()\nplt.show()", "note": "", "html": ""}, {"sec": "train", "title": "옵티마이저 여러 개 한 번에 비교", "kw": "for 반복 비교 optimizer 옵티마이저 실험 여러개 결과 표", "code": "def build_model():\n    return keras.Sequential([\n        keras.layers.Input(shape=(28, 28)),\n        keras.layers.Flatten(),\n        keras.layers.Dense(300, activation=\"relu\", kernel_initializer=\"he_normal\"),\n        keras.layers.Dense(100, activation=\"relu\", kernel_initializer=\"he_normal\"),\n        keras.layers.Dense(10, activation=\"softmax\")\n    ])\n\noptimizers = {\n    \"SGD\": lambda: keras.optimizers.SGD(learning_rate=0.01),\n    \"Momentum\": lambda: keras.optimizers.SGD(learning_rate=0.01, momentum=0.9),\n    \"NAG\": lambda: keras.optimizers.SGD(learning_rate=0.01, momentum=0.9, nesterov=True),\n    \"Adam\": lambda: keras.optimizers.Adam(learning_rate=0.001),\n}\nresults, histories = {}, {}\nfor name, make_opt in optimizers.items():\n    m = build_model()\n    m.compile(loss=\"sparse_categorical_crossentropy\", optimizer=make_opt(), metrics=[\"accuracy\"])\n    histories[name] = m.fit(X_train, y_train, epochs=3, validation_data=(X_valid, y_valid), verbose=0)\n    results[name] = m.evaluate(X_test, y_test, verbose=0)[1]\n    print(name, results[name])\n\nfor name, h in histories.items():\n    plt.plot(h.history[\"val_loss\"], label=name)\nplt.legend(); plt.xlabel(\"epoch\"); plt.ylabel(\"val_loss\"); plt.show()", "note": "", "html": ""}, {"sec": "train", "title": "조기 종료 (EarlyStopping)", "kw": "early stopping 조기종료 조기 종료 patience restore_best_weights callback 콜백", "code": "early_stopping_cb = keras.callbacks.EarlyStopping(patience=10, restore_best_weights=True)\nhistory = model.fit(X_train, y_train, epochs=100,\n                    validation_data=(X_valid, y_valid),\n                    callbacks=[early_stopping_cb], verbose=2)\nprint(\"실제 학습한 epoch 수:\", len(history.history[\"loss\"]))", "note": "", "html": ""}, {"sec": "train", "title": "체크포인트 (ModelCheckpoint)", "kw": "checkpoint 체크포인트 save_best_only 최상 모델 저장 callback 콜백", "code": "checkpoint_cb = keras.callbacks.ModelCheckpoint(\"my_keras_model.keras\", save_best_only=True)\nhistory = model.fit(X_train, y_train, epochs=10,\n                    validation_data=(X_valid, y_valid),\n                    callbacks=[checkpoint_cb], verbose=2)\nmodel = keras.models.load_model(\"my_keras_model.keras\")   # 최상의 모델로 되돌리기", "note": "", "html": ""}, {"sec": "train", "title": "모델 저장 · 불러오기", "kw": "save load 저장 불러오기 load_model keras h5", "code": "model.save(\"my_model.keras\")\nmodel2 = keras.models.load_model(\"my_model.keras\")", "note": "파일 이름은 .keras 또는 .h5로 끝나야 함.", "html": ""}, {"sec": "train", "title": "층 · 가중치 꺼내 보기", "kw": "layers get_weights 가중치 weights bias 편향 get_layer shape", "code": "print(model.layers)\nhidden1 = model.layers[1]\nweights, biases = hidden1.get_weights()\nprint(weights.shape, biases.shape)", "note": "", "html": ""}, {"sec": "pandas", "title": "데이터 훑어보기", "kw": "head tail info describe shape columns 행 열 개수 요약", "code": "df = pd.read_csv(\"Salary2024.csv\")\nprint(df.shape)        # (행, 열)\ndf.head()              # 앞 5줄\n# df.tail(), df.info(), df.describe(), df.columns", "note": "", "html": ""}, {"sec": "pandas", "title": "항목별 개수 (value_counts)", "kw": "value_counts 개수 몇명 빈도 count 세기", "code": "df[\"job_title\"].value_counts()\n# 비율로: df[\"job_title\"].value_counts(normalize=True)\n# 상위 10개: df[\"job_title\"].value_counts().head(10)", "note": "", "html": ""}, {"sec": "pandas", "title": "종류 수 · 종류 목록 (nunique / unique)", "kw": "nunique unique 종류 몇개 고유값 중복 제거", "code": "print(df[\"job_title\"].nunique())    # 종류 수\nprint(df[\"job_title\"].unique())     # 종류 목록", "note": "", "html": ""}, {"sec": "pandas", "title": "그룹별 최소·최대·평균 (groupby + agg)", "kw": "groupby 그룹 agg min max mean 최소 최대 평균 집계", "code": "df.groupby(\"job_title\")[\"salary_in_usd\"].agg([\"min\", \"max\", \"mean\"])\n# 평균만: df.groupby(\"job_title\")[\"salary_in_usd\"].mean()\n# 여러 기준: df.groupby([\"experience_level\", \"work_models\"])[\"salary_in_usd\"].mean()", "note": "", "html": ""}, {"sec": "pandas", "title": "그룹 평균 상위 N개", "kw": "정렬 sort_values 상위 top 내림차순 ascending 높은 순 nlargest", "code": "df.groupby(\"job_title\")[\"salary_in_usd\"].mean().sort_values(ascending=False).head(5)\n# 같은 결과: df.groupby(\"job_title\")[\"salary_in_usd\"].mean().nlargest(5)", "note": "", "html": ""}, {"sec": "pandas", "title": "조건으로 행 거르기", "kw": "필터 filter 조건 boolean 불리언 and or & | 이상 이하 같은", "code": "high = df[df[\"salary_in_usd\"] >= 200000]\nremote_high = df[(df[\"work_models\"] == \"Remote\") & (df[\"salary_in_usd\"] >= 200000)]\nus_or_ca = df[(df[\"company_location\"] == \"United States\") | (df[\"company_location\"] == \"Canada\")]\nprint(len(remote_high))\n# 여러 값 중 하나: df[df[\"company_size\"].isin([\"Large\", \"Medium\"])]", "note": "", "html": ""}, {"sec": "pandas", "title": "열 선택 · 새 열 만들기", "kw": "열 선택 column 새 열 추가 계산 컬럼", "code": "sub = df[[\"job_title\", \"salary_in_usd\"]]\ndf[\"salary_k\"] = df[\"salary_in_usd\"] / 1000\ndf[\"is_remote\"] = df[\"work_models\"] == \"Remote\"", "note": "", "html": ""}, {"sec": "pandas", "title": "loc · iloc", "kw": "loc iloc 인덱싱 위치 행 선택 슬라이싱", "code": "df.iloc[0:5, 0:3]                              # 위치로\ndf.loc[df[\"work_year\"] == 2024, [\"job_title\", \"salary_in_usd\"]]   # 조건 + 열 이름", "note": "", "html": ""}, {"sec": "pandas", "title": "정렬", "kw": "sort_values 정렬 오름차순 내림차순 ascending", "code": "df.sort_values(\"salary_in_usd\", ascending=False).head(10)\ndf.sort_values([\"work_year\", \"salary_in_usd\"], ascending=[True, False])", "note": "", "html": ""}, {"sec": "pandas", "title": "결측치", "kw": "결측치 null nan isnull dropna fillna 빈값 missing", "code": "df.isnull().sum()            # 열별 결측치 개수\ndf_clean = df.dropna()       # 결측 행 삭제\ndf_filled = df.fillna(0)     # 0으로 채우기", "note": "", "html": ""}, {"sec": "pandas", "title": "피벗 테이블", "kw": "pivot_table 피벗 교차표 crosstab 두 기준", "code": "df.pivot_table(index=\"experience_level\", columns=\"work_models\",\n               values=\"salary_in_usd\", aggfunc=\"mean\")\n# 개수 교차표: pd.crosstab(df[\"experience_level\"], df[\"company_size\"])", "note": "", "html": ""}, {"sec": "pandas", "title": "그래프 (막대 · 히스토그램)", "kw": "plot bar 막대 그래프 hist 히스토그램 시각화 차트", "code": "df.groupby(\"work_year\")[\"salary_in_usd\"].mean().plot(kind=\"bar\")\nplt.ylabel(\"mean salary (USD)\")\nplt.show()\ndf[\"salary_in_usd\"].plot(kind=\"hist\", bins=30)\nplt.show()", "note": "", "html": ""}, {"sec": "pandas", "title": "문자열 포함 검색", "kw": "str contains 포함 문자열 검색 대소문자", "code": "ml = df[df[\"job_title\"].str.contains(\"Machine Learning\")]\nprint(len(ml))", "note": "", "html": ""}, {"sec": "pandas", "title": "중복 · 인덱스 정리", "kw": "drop_duplicates 중복 reset_index rename 이름 바꾸기", "code": "df_unique = df.drop_duplicates()\ng = df.groupby(\"job_title\")[\"salary_in_usd\"].mean().reset_index()   # 시리즈 → 표\ng = g.rename(columns={\"salary_in_usd\": \"mean_salary\"})", "note": "", "html": ""}, {"sec": "numpy", "title": "sigmoid · softmax · 교차 엔트로피", "kw": "sigmoid softmax cross entropy 교차엔트로피 손실 함수 구현 numpy", "code": "def sigmoid(x):\n    return 1 / (1 + np.exp(-x))\n\ndef softmax(x):\n    exp_x = np.exp(x - np.max(x, axis=-1, keepdims=True))   # 오버플로 방지\n    return exp_x / np.sum(exp_x, axis=-1, keepdims=True)\n\ndef cross_entropy_loss(y_actual, y_pred):\n    y_pred = np.clip(y_pred, 1e-15, 1 - 1e-15)              # log(0) 방지\n    return -np.sum(y_actual * np.log(y_pred)) / len(y_actual)", "note": "", "html": ""}, {"sec": "numpy", "title": "순전파 (784 → 16 → 16 → 10)", "kw": "순전파 feedforward forward 가중치 초기화 xavier 세이비어 dot", "code": "from tensorflow.keras.utils import to_categorical\nXb = X_train[:64].reshape(64, 784)\nYb = to_categorical(y_train[:64], 10)\nw_1 = np.random.randn(16, 784) * np.sqrt(2 / (784 + 16)); b_1 = np.zeros(16)\nw_2 = np.random.randn(16, 16) * np.sqrt(2 / (16 + 16));   b_2 = np.zeros(16)\nw_o = np.random.randn(10, 16) * np.sqrt(2 / (16 + 10));   b_o = np.zeros(10)\n\na_1 = sigmoid(np.dot(w_1, Xb.T).T + b_1)         # (64, 16)\na_2 = sigmoid(np.dot(w_2, a_1.T).T + b_2)        # (64, 16)\noutput = softmax(np.dot(w_o, a_2.T).T + b_o)     # (64, 10)\nprint(cross_entropy_loss(Yb, output))", "note": "", "html": ""}, {"sec": "numpy", "title": "역전파 · 가중치 갱신", "kw": "역전파 backpropagation backprop gradient 기울기 체인룰 chain rule 갱신 update", "code": "lr = 1.0\nfor i in range(200):\n    a_1 = sigmoid(np.dot(w_1, Xb.T).T + b_1)\n    a_2 = sigmoid(np.dot(w_2, a_1.T).T + b_2)\n    output = softmax(np.dot(w_o, a_2.T).T + b_o)\n\n    d_output = output - Yb                                       # softmax + CE 미분\n    d_w_o = np.dot(d_output.T, a_2) / len(Yb); d_b_o = np.sum(d_output, axis=0) / len(Yb)\n    d_l2 = np.dot(d_output, w_o) * (a_2 * (1 - a_2))             # sigmoid 미분\n    d_w_2 = np.dot(d_l2.T, a_1) / len(Yb);     d_b_2 = np.sum(d_l2, axis=0) / len(Yb)\n    d_l1 = np.dot(d_l2, w_2) * (a_1 * (1 - a_1))\n    d_w_1 = np.dot(d_l1.T, Xb) / len(Yb);      d_b_1 = np.sum(d_l1, axis=0) / len(Yb)\n\n    w_o -= lr * d_w_o; b_o -= lr * d_b_o\n    w_2 -= lr * d_w_2; b_2 -= lr * d_b_2\n    w_1 -= lr * d_w_1; b_1 -= lr * d_b_1\n    if i % 50 == 0:\n        print(i, cross_entropy_loss(Yb, output))", "note": "", "html": ""}, {"sec": "error", "title": "자주 나는 에러", "kw": "에러 error 오류 안됨 해결 경고 warning", "code": "", "note": "", "html": "<table>\n<tr><th>에러 / 증상<\/th><th>해결<\/th><\/tr>\n<tr><td><code>No module named 'tensorflow'<\/code><\/td><td><code>!pip install tensorflow<\/code> 후 커널 재시작<\/td><\/tr>\n<tr><td><code>predict_classes<\/code> 없음<\/td><td><code>np.argmax(model.predict(X), axis=-1)<\/code><\/td><\/tr>\n<tr><td><code>lr<\/code> 인자 에러<\/td><td><code>learning_rate=<\/code><\/td><\/tr>\n<tr><td><code>model.save<\/code> 확장자 에러<\/td><td>파일명 끝에 <code>.keras<\/code><\/td><\/tr>\n<tr><td><code>Shapes (None, 10) and (None, 1) are incompatible<\/code><\/td><td>정수 레이블이면 <code>sparse_categorical_crossentropy<\/code>, 원-핫이면 <code>categorical_crossentropy<\/code><\/td><\/tr>\n<tr><td><code>Do not pass an input_shape<\/code> 경고<\/td><td>첫 줄에 <code>keras.layers.Input(shape=(28, 28))<\/code> (경고라 무시해도 동작함)<\/td><\/tr>\n<tr><td>LeakyReLU <code>alpha<\/code> 경고<\/td><td><code>negative_slope=0.2<\/code><\/td><\/tr>\n<tr><td><code>FileNotFoundError<\/code> (CSV)<\/td><td>로컬은 노트북과 같은 폴더에 두고 파일명만, Colab은 <code>/content/<\/code><\/td><\/tr>\n<tr><td><code>KeyError: '열이름'<\/code><\/td><td><code>df.columns<\/code>로 정확한 철자 확인<\/td><\/tr>\n<tr><td>옵티마이저 관련 <code>Unknown variable<\/code><\/td><td>옵티마이저 객체를 모델마다 새로 만들기<\/td><\/tr>\n<tr><td>정확도 10% 근처에서 안 오름<\/td><td>/255 했는지, loss 종류, 출력층 softmax 확인<\/td><\/tr>\n<tr><td>학습이 너무 오래 걸림<\/td><td>epochs 줄이기, <code>verbose=2<\/code><\/td><\/tr>\n<tr><td><code>google.colab<\/code> 에러<\/td><td>Colab 전용 코드(손글씨 그리기). 로컬에서는 그 셀 건너뛰기<\/td><\/tr>\n<\/table>"}, {"sec": "words", "title": "기법 한 줄 정리 (마크다운 답안용)", "kw": "정리 설명 한줄 마크다운 he relu elu 배치정규화 adam 모멘텀 nag dropout 조기종료", "code": "", "note": "", "html": "<ul>\n<li><b>He 초기화<\/b>: ReLU 계열에 맞게 처음 가중치 크기(분산 2/fan_in)를 잡아 학습이 잘 시작되게 함<\/li>\n<li><b>Glorot(Xavier) 초기화<\/b>: 케라스 기본값. 분산 1/fan_avg. sigmoid·tanh와 짝<\/li>\n<li><b>ReLU<\/b>: 0보다 작으면 0, 크면 그대로. sigmoid보다 기울기 소실이 적음<\/li>\n<li><b>LeakyReLU<\/b>: 음수에도 작은 기울기를 줘서 뉴런이 죽는(출력 0에 갇히는) 문제를 줄임<\/li>\n<li><b>ELU<\/b>: 음수 쪽을 지수함수로 부드럽게. 평균이 0에 가까워 학습이 안정적<\/li>\n<li><b>SELU<\/b>: 스케일된 ELU. 르쿤 초기화와 함께 쓰면 층마다 스스로 정규화됨<\/li>\n<li><b>배치 정규화<\/b>: 미니배치마다 층 출력의 평균 0, 분산 1로 맞춘 뒤 γ·β로 조정. 학습이 빠르고 안정적<\/li>\n<li><b>Momentum<\/b>: 이전에 가던 방향으로 관성을 줘 더 빨리 내려감<\/li>\n<li><b>NAG<\/b>: 관성 방향으로 먼저 가본 위치의 기울기를 써서 진동이 줄고 더 빨리 수렴<\/li>\n<li><b>AdaGrad<\/b>: 많이 움직인 방향은 학습률을 줄임. 너무 일찍 멈추는 단점<\/li>\n<li><b>RMSProp<\/b>: 최근 기울기만 반영(지수 이동평균)해 AdaGrad 단점 보완<\/li>\n<li><b>Adam<\/b>: Momentum + RMSProp. 실무에서 가장 많이 씀<\/li>\n<li><b>Nadam<\/b>: Adam + Nesterov<\/li>\n<li><b>Dropout<\/b>: 학습 때 뉴런 일부를 랜덤하게 꺼서 특정 뉴런 의존을 줄이고 과대적합 방지<\/li>\n<li><b>L1 / L2 규제<\/b>: 가중치가 커지지 않게 벌점. L1은 0으로 만들어 희소하게<\/li>\n<li><b>조기 종료<\/b>: 검증 손실이 더 안 좋아지면 학습을 멈추고 가장 좋았던 가중치로 되돌림<\/li>\n<li><b>전이 학습<\/b>: 학습된 모델의 앞쪽 층을 재사용(동결)하고 출력층만 새로 학습<\/li>\n<li><b>데이터 증강<\/b>: 회전·이동 등으로 훈련 이미지를 늘려 일반화 향상<\/li>\n<\/ul>"}, {"sec": "words", "title": "문제점 한 줄 정리", "kw": "기울기 소실 폭주 vanishing exploding 과대적합 overfitting 과적합 문제점", "code": "", "note": "", "html": "<ul>\n<li><b>기울기 소실<\/b>: 역전파 중 아래층으로 갈수록 기울기가 0에 가까워져 학습이 안 됨. sigmoid 도함수 최대 0.25가 층마다 곱해지는 것이 원인 → 초기화, ReLU 계열, 배치 정규화로 완화<\/li>\n<li><b>기울기 폭주<\/b>: 기울기가 점점 커져 발산. RNN처럼 되먹임 구조에서 주로 발생<\/li>\n<li><b>과대적합<\/b>: 훈련 데이터에만 맞고 새 데이터에 약함. loss는 줄어드는데 val_loss가 오르면 신호 → Dropout, 규제, 조기 종료, 데이터 증강<\/li>\n<li><b>학습률<\/b>: 너무 크면 발산, 너무 작으면 매우 느림<\/li>\n<li><b>softmax + 교차 엔트로피<\/b>: 미분이 (예측 − 정답)으로 간단해서 분류에 씀. 회귀는 MSE<\/li>\n<\/ul>"}, {"sec": "words", "title": "옵티마이저 비교표", "kw": "옵티마이저 비교 수렴 속도 품질 표 11-2", "code": "", "note": "", "html": "<table>\n<tr><th>옵티마이저<\/th><th>수렴 속도<\/th><th>수렴 품질<\/th><\/tr>\n<tr><td>SGD<\/td><td>느림<\/td><td>좋음<\/td><\/tr>\n<tr><td>Momentum / NAG<\/td><td>보통<\/td><td>좋음<\/td><\/tr>\n<tr><td>Adagrad<\/td><td>빠름<\/td><td>나쁨 (너무 일찍 멈춤)<\/td><\/tr>\n<tr><td>RMSprop / Adam / Nadam<\/td><td>빠름<\/td><td>보통~좋음<\/td><\/tr>\n<\/table>"}]}</script>
<script>
(function(){
  var data = JSON.parse(document.getElementById('data').textContent);
  var S = data.items, SECS = data.sections;
  var list = document.getElementById('list'), q = document.getElementById('q'),
      nav = document.getElementById('nav'), count = document.getElementById('count');
  var current = 'all';
  function norm(t){ return (t||'').toLowerCase().replace(/[\s·\-_.,/()]+/g,''); }
  function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function stripTags(h){ var d=document.createElement('div'); d.innerHTML=h; return d.textContent; }
  S.forEach(function(s){ s.hay = norm(s.title+' '+s.kw+' '+s.code+' '+s.note+' '+stripTags(s.html||'')); });

  // nav
  var allBtn = mk('전체','all'); nav.appendChild(allBtn);
  SECS.forEach(function(p){ nav.appendChild(mk(p[1], p[0])); });
  function mk(label, key){
    var b=document.createElement('button'); b.type='button'; b.textContent=label; b.dataset.k=key;
    b.setAttribute('aria-pressed', key==='all'?'true':'false');
    b.onclick=function(){ current=key; [].forEach.call(nav.children,function(x){x.setAttribute('aria-pressed', x.dataset.k===key?'true':'false')}); render(); };
    return b;
  }
  function hl(text, toks){
    var h = esc(text);
    toks.forEach(function(t){ if(t.length<2) return;
      var re = new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
      h = h.replace(re,'<mark>$1</mark>'); });
    return h;
  }
  function render(){
    var raw = q.value.trim(), toks = raw.split(/\s+/).filter(Boolean), ntoks = toks.map(norm).filter(Boolean);
    var shown = S.filter(function(s){
      if(current!=='all' && s.sec!==current) return false;
      return ntoks.every(function(t){ return s.hay.indexOf(t)>-1; });
    });
    count.textContent = shown.length+'개';
    list.innerHTML='';
    if(!shown.length){ list.innerHTML='<div class="empty">찾는 내용이 없습니다. 다른 표현(영문/한글)으로 검색해 보세요.</div>'; return; }
    var lastSec=null;
    shown.forEach(function(s){
      if(s.sec!==lastSec){ var h=document.createElement('div'); h.className='sec'; h.textContent=SECS.filter(function(p){return p[0]===s.sec})[0][1]; list.appendChild(h); lastSec=s.sec; }
      var c=document.createElement('article'); c.className='card';
      var secName=SECS.filter(function(p){return p[0]===s.sec})[0][1];
      var inner='<h2>'+hl(s.title,toks)+'<span class="tag">'+secName+'</span></h2>';
      if(s.code) inner+='<div class="codewrap"><pre><code>'+hl(s.code,toks)+'</code></pre><button class="copy" type="button">복사</button></div>';
      if(s.html) inner+='<div class="html">'+s.html+'</div>';
      if(s.note) inner+='<p class="note">'+hl(s.note,toks)+'</p>';
      c.innerHTML=inner;
      var btn=c.querySelector('.copy');
      if(btn){ btn.onclick=function(){ copy(s.code, btn); }; }
      list.appendChild(c);
    });
  }
  function copy(text, btn){
    function ok(){ btn.textContent='복사됨'; btn.classList.add('done'); setTimeout(function(){btn.textContent='복사'; btn.classList.remove('done');},1200); }
    if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(ok, fallback); } else fallback();
    function fallback(){ var t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); try{document.execCommand('copy'); ok();}catch(e){} document.body.removeChild(t); }
  }
  q.addEventListener('input', render);
  document.addEventListener('keydown', function(e){
    if(e.key==='/' && document.activeElement!==q){ e.preventDefault(); q.focus(); q.select(); }
    if(e.key==='Escape'){ q.value=''; render(); q.focus(); }
  });
  var m = location.hash.match(/^#q=(.*)$/); if(m){ q.value=decodeURIComponent(m[1]); }
  render();
})();
</script>
</body>
</html>

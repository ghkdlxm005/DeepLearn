 metrics=[\"accuracy\"])\nhistory = model.fit(X_train, y_train, epochs=10, validation_data=(X_valid, y_valid))\ntest_loss, test_acc = model.evaluate(X_test, y_test)\nprint(f\"테스트 정확도: {test_acc:.4f}\")", "note": "", "html": "<h3 class=\"pq\">문제<\/h3><p>Week4 모델을 다음처럼 바꾸시오.<\/p><ul><li>Flatten 층을 쓰지 말고 데이터를 (샘플 수, 784)로 reshape해서 입력<\/li><li>라벨을 원-핫으로 바꾸고 손실은 categorical_crossentropy<\/li><li>나머지(200·100, ELU, He, NAG 0.9, 배치 정규화)는 Week4와 같음<\/li><li>10 epoch<\/li><\/ul><h3 class=\"pq\">정리 (마크다운에 쓸 요점)<\/h3><ul><li>입력 모양이 (784,)로 바뀌므로 <code>Input(shape=(784,))<\/code><\/li>\n<li>원-핫 라벨 + categorical_crossentropy, 정수 라벨 + sparse_categorical_crossentropy. 섞으면 <code>Shapes ... are incompatible<\/code> 에러<\/li>\n<li>결과는 Week4와 거의 같음 (같은 모델을 다르게 표현했을 뿐)<\/li><\/ul><p class=\"res\"><b>실제 실행 결과<\/b>: 테스트 정확도 0.9802 (Week4 제출본 0.9804와 거의 같음)<\/p>", "out": "", "extra": ""}, {"sec": "practice", "title": "[Week4] 연습 6. 옵티마이저만 바꿔 비교 (9/26 실습 · 10/10 \"옵티마이저 바꿔 보기\")", "kw": "옵티마이저 비교 sgd momentum nesterov adagrad rmsprop adam nadam 학습률 발산 learning rate 1.0 week4 변형 연습 문제 과제 형식 mnist 신경망", "code": "import tensorflow as tf\nfrom tensorflow import keras\nimport numpy as np\n\n(X_train_full, y_train_full), (X_test, y_test) = keras.datasets.mnist.load_data()\nX_train_full = X_train_full.astype(\"float32\") / 255.0\nX_test = X_test.astype(\"float32\") / 255.0\nX_train, X_valid = X_train_full[:-5000], X_train_full[-5000:]\ny_train, y_valid = y_train_full[:-5000], y_train_full[-5000:]\n\ndef build():\n    return keras.Sequential([\n        keras.layers.Input(shape=(28, 28)), keras.layers.Flatten(),\n        keras.layers.Dense(200, kernel_initializer=\"he_normal\", use_bias=False),\n        keras.layers.BatchNormalization(), keras.layers.Activation(\"elu\"),\n        keras.layers.Dense(100, kernel_initializer=\"he_normal\", use_bias=False),\n        keras.layers.BatchNormalization(), keras.layers.Activation(\"elu\"),\n        keras.layers.Dense(10, activation=\"softmax\")])\n\noptimizers = {\n    \"SGD\": lambda: keras.optimizers.SGD(learning_rate=0.01),\n    \"모멘텀\": lambda: keras.optimizers.SGD(learning_rate=0.01, momentum=0.9),\n    \"NAG\": lambda: keras.optimizers.SGD(learning_rate=0.01, momentum=0.9, nesterov=True),\n    \"Adagrad\": lambda: keras.optimizers.Adagrad(learning_rate=0.01),\n    \"RMSprop\": lambda: keras.optimizers.RMSprop(learning_rate=0.001),\n    \"Adam\": lambda: keras.optimizers.Adam(learning_rate=0.001),\n    \"Nadam\": lambda: keras.optimizers.Nadam(learning_rate=0.001),\n    \"Adam lr=1.0\": lambda: keras.optimizers.Adam(learning_rate=1.0),\n}\nfor name, make in optimizers.items():\n    model = build()\n    model.compile(loss=\"sparse_categorical_crossentropy\", optimizer=make(), metrics=[\"accuracy\"])\n    h = model.fit(X_train, y_train, epochs=3, validation_data=(X_valid, y_valid), verbose=0)\n    print(f\"{name:12s} val_accuracy {h.history['val_accuracy'][-1]:.4f}\")", "note": "", "html": "<h3 class=\"pq\">문제<\/h3><p>Week4 모델에서 옵티마이저만 바꿔 3 epoch 검증 정확도를 비교하시오. 학습률을 1.0으로 키우면 어떻게 되는지도 확인하시오.<\/p><ul><li>SGD / SGD+모멘텀 0.9 / NAG / Adagrad / RMSprop / Adam / Nadam<\/li><li>Adam(learning_rate=1.0)<\/li><\/ul><h3 class=\"pq\">정리 (마크다운에 쓸 요점)<\/h3><ul><li>옵티마이저 객체는 모델마다 <b>새로 만들어야<\/b> 함 (그래서 lambda로 매번 생성)<\/li>\n<li>기본 SGD는 3 epoch에선 느림 → 모멘텀·NAG로 빨라짐. Adam·Nadam이 보통 빠르게 좋음 (9/26)<\/li>\n<li>학습률이 너무 크면 크게 흔들리다 발산 → 정확도가 떨어짐 (9/26 \"너무 크면 발산\")<\/li><\/ul><p class=\"res\"><b>실제 실행 결과<\/b>: 3 epoch 검증 정확도 — SGD 0.9638 · 모멘텀 0.9748 · NAG 0.9758 · Adagrad 0.9694 · RMSprop 0.9720 · Adam 0.9746 · Nadam 0.9764 · Adam lr=1.0 <b>0.8702<\/b><\/p>", "out": "", "extra": ""}, {"sec": "practice", "title": "[Week4] 연습 7. 콜백: ModelCheckpoint · EarlyStopping (9/12·9/19)", "kw": "callback 콜백 earlystopping patience restore_best_weights modelcheckpoint save_best_only epochs 100 week4 변형 연습 문제 과제 형식 mnist 신경망", "code": "import tensorflow as tf\nfrom tensorflow import keras\nimport numpy as np\n\n(X_train_full, y_train_full), (X_test, y_test) = keras.datasets.mnist.load_data()\nX_train_full = X_train_full.astype(\"float32\") / 255.0\nX_test = X_test.astype(\"float32\") / 255.0\nX_train, X_valid = X_train_full[:-5000], X_train_full[-5000:]\ny_train, y_valid = y_train_full[:-5000], y_train_full[-5000:]\n\nmodel = keras.Sequential([\n    keras.layers.Input(shape=(28, 28)), keras.layers.Flatten(),\n    keras.layers.Dense(200, kernel_initializer=\"he_normal\", use_bias=False),\n    keras.layers.BatchNormalization(), keras.layers.Activation(\"elu\"),\n    keras.layers.Dense(100, kernel_initializer=\"he_normal\", use_bias=False),\n    keras.layers.BatchNormalization(), keras.layers.Activation(\"elu\"),\n    keras.layers.Dense(10, activation=\"softmax\")])\nmodel.compile(loss=\"sparse_categorical_crossentropy\",\n              optimizer=keras.optimizers.SGD(learning_rate=0.01, momentum=0.9, nesterov=True),\n              metrics=[\"accuracy\"])\n\ncheckpoint_cb = keras.callbacks.ModelCheckpoint(\"best_mnist.keras\", save_best_only=True)\nearly_stopping_cb = keras.callbacks.EarlyStopping(patience=5, restore_best_weights=True)\nhistory = model.fit(X_train, y_train, epochs=100, validation_data=(X_valid, y_valid),\n                    callbacks=[checkpoint_cb, early_stopping_cb])\nprint(\"실제로 돈 epoch:\", len(history.history[\"loss\"]))\n\nmodel = keras.models.load_model(\"best_mnist.keras\")\ntest_loss, test_acc = model.evaluate(X_test, y_test)\nprint(f\"테스트 정확도: {test_acc:.4f}\")", "note": "", "html": "<h3 class=\"pq\">문제<\/h3><p>Week4 모델을 다음 조건으로 학습하시오.<\/p><ul><li>epochs=100으로 주되, 검증 손실이 5 epoch 동안 나아지지 않으면 멈추고 가장 좋았던 가중치로 되돌릴 것<\/li><li>가장 좋은 모델을 <code>best_mnist.keras<\/code>로 저장<\/li><li>저장한 모델을 불러와 테스트 정확도 확인<\/li><\/ul><h3 class=\"pq\">정리 (마크다운에 쓸 요점)<\/h3><ul><li>EarlyStopping 기본 감시값은 <code>val_loss<\/code> → validation_data가 있어야 함<\/li>\n<li>save_best_only = 점수가 아니라 <b>가장 좋았을 때의 가중치(모델)<\/b>를 저장<\/li>\n<li>callbacks 리스트 순서는 상관없음 (9/19)<\/li><\/ul><p class=\"res\"><b>실제 실행 결과<\/b>: 14 epoch에서 조기 종료, 불러온 모델 테스트 정확도 0.9785<\/p>", "out": "", "extra": ""}, {"sec": "practice", "title": "[Week4] 연습 8. L2 규제 · 드롭아웃 · 학습 곡선 그리기", "kw": "l2 규제 regularizer kernel_regularizer dropout 과적합 history 학습 곡선 pandas plot week4 변형 연습 문제 과제 형식 mnist 신경망", "code": "import tensorflow as tf\nfrom tensorflow import keras\nimport numpy as np\n\n(X_train_full, y_train_full), (X_test, y_test) = keras.datasets.fashion_mnist.load_data()\nX_train_full = X_train_full.astype(\"float32\") / 255.0\nX_test = X_test.astype(\"float32\") / 255.0\nX_train, X_valid = X_train_full[:-5000], X_train_full[-5000:]\ny_train, y_valid = y_train_full[:-5000], y_train_full[-5000:]\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\nmodel = keras.Sequential([\n    keras.layers.Input(shape=(28, 28)), keras.layers.Flatten(),\n    keras.layers.Dense(300, activation=\"relu\", kernel_initializer=\"he_normal\",\n                       kernel_regularizer=keras.regularizers.l2(0.0001)),\n    keras.layers.Dropout(0.3),\n    keras.layers.Dense(100, activation=\"relu\", kernel_initializer=\"he_normal\",\n                       kernel_regularizer=keras.regularizers.l2(0.0001)),\n    keras.layers.Dropout(0.3),\n    keras.layers.Dense(10, activation=\"softmax\")])\nmodel.compile(loss=\"sparse_categorical_crossentropy\", optimizer=\"adam\", metrics=[\"accuracy\"])\nhistory = model.fit(X_train, y_train, epochs=10, validation_data=(X_valid, y_valid))\n\npd.DataFrame(history.history).plot(figsize=(8, 5))\nplt.grid(True); plt.xlabel(\"epoch\"); plt.show()\ntest_loss, test_acc = model.evaluate(X_test, y_test)\nprint(f\"테스트 정확도: {test_acc:.4f}\")", "note": "", "html": "<h3 class=\"pq\">문제<\/h3><p>Fashion MNIST로 다음 모델을 만들고 학습 곡선을 그리시오.<\/p><ul><li>Hidden: 300개, 100개, ReLU, He<\/li><li>각 은닉층에 L2 규제 0.0001<\/li><li>각 은닉층 뒤 Dropout 0.3<\/li><li>Optimizer: Adam, 10 epoch<\/li><li>history로 loss·accuracy·val_loss·val_accuracy 그래프<\/li><\/ul><h3 class=\"pq\">정리 (마크다운에 쓸 요점)<\/h3><ul><li>L2 규제: 가중치가 커지지 않게 손실에 벌점을 더함 (10/10 사용자 정의 훈련 반복의 <code>model.losses<\/code>가 이것)<\/li>\n<li>드롭아웃: 학습 때 뉴런을 랜덤하게 끊어 특정 뉴런에 의존하지 않게 함 → 과적합 감소 (9/26 '철수' 비유)<\/li>\n<li>Dropout 때문에 훈련 정확도가 검증 정확도보다 낮게 나올 수 있음 (훈련 때만 끊기므로)<\/li><\/ul><p class=\"res\"><b>실제 실행 결과<\/b>: 테스트 정확도 0.8714 (마지막 epoch 훈련 0.8698 < 검증 0.8766 → 드롭아웃 때문)<\/p>", "out": "", "extra": ""}, {"sec": "practice", "title": "[Week4] 연습 9. 같은 모델을 함수형 API로 (9/12)", "kw": "함수형 api functional keras.Model input week4 변환 층을 함수처럼 week4 변형 연습 문제 과제 형식 mnist 신경망", "code": "import tensorflow as tf\nfrom tensorflow import keras\nimport numpy as np\n\n(X_train_full, y_train_full), (X_test, y_test) = keras.datasets.mnist.load_data()\nX_train_full = X_train_full.astype(\"float32\") / 255.0\nX_test = X_test.astype(\"float32\") / 255.0\nX_train, X_valid = X_train_full[:-5000], X_train_full[-5000:]\ny_train, y_valid = y_train_full[:-5000], y_train_full[-5000:]\n\ninput_ = keras.layers.Input(shape=(28, 28))\nx = keras.layers.Flatten()(input_)\nfor n in [200, 100]:\n    x = keras.layers.Dense(n, kernel_initializer=\"he_normal\", use_bias=False)(x)\n    x = keras.layers.BatchNormalization()(x)\n    x = keras.layers.Activation(\"elu\")(x)\noutput = keras.layers.Dense(10, activation=\"softmax\")(x)\nmodel = keras.Model(inputs=[input_], outputs=[output])\nmodel.summary()\n\nmodel.compile(loss=\"sparse_categorical_crossentropy\",\n              optimizer=keras.optimizers.SGD(learning_rate=0.01, momentum=0.9, nesterov=True),\n              metrics=[\"accuracy\"])\nhistory = model.fit(X_train, y_train, epochs=10, validation_data=(X_valid, y_valid))\ntest_loss, test_acc = model.evaluate(X_test, y_test)\nprint(f\"테스트 정확도: {test_acc:.4f}\")", "note": "", "html": "<h3 class=\"pq\">문제<\/h3><p>Week4 모델(200·100, ELU, He, BN, NAG 0.9)을 Sequential이 아닌 함수형 API로 다시 만들고 summary로 같은지 확인하시오.<\/p><ul><\/ul><h3 class=\"pq\">정리 (마크다운에 쓸 요점)<\/h3><ul><li>층을 만들고 바로 <code>(이전 출력)<\/code>을 넣어 호출하면 연결됨 → 마지막에 <code>keras.Model(inputs, outputs)<\/code><\/li>\n<li>파라미터 수: Dense 784×200 = 156,800 (use_bias=False), BN 200×4 = 800, Dense 200×100 = 20,000, BN 400, 출력 100×10+10 = 1,010 → 합계 179,010<\/li><\/ul><p class=\"res\"><b>실제 실행 결과<\/b>: Total params 179,010 · 테스트 정확도 0.9792<\/p>", "out": "", "extra": ""}, {"sec": "practice", "title": "[Week4] 연습 10. 같은 데이터를 CNN으로 (10/17)", "kw": "cnn conv2d maxpool2d mnist 합성곱 파라미터 320 18496 reshape 채널 week4 변형 연습 문제 과제 형식 mnist 신경망", "code": "import tensorflow as tf\nfrom tensorflow import keras\nimport numpy as np\n\n(X_train_full, y_train_full), (X_test, y_test) = keras.datasets.mnist.load_data()\nX_train_full = X_train_full.astype(\"float32\") / 255.0\nX_test = X_test.astype(\"float32\") / 255.0\nX_train, X_valid = X_train_full[:-5000], X_train_full[-5000:]\ny_train, y_valid = y_train_full[:-5000], y_train_full[-5000:]\n\nX_train, X_valid, X_test = X_train[..., np.newaxis], X_valid[..., np.newaxis], X_test[..., np.newaxis]   # (N, 28, 28, 1)\n\nmodel = keras.Sequential([\n    keras.layers.Input(shape=(28, 28, 1)),\n    keras.layers.Conv2D(32, 3, padding=\"same\", activation=\"relu\"),\n    keras.layers.MaxPool2D(2),\n    keras.layers.Conv2D(64, 3, padding=\"same\", activation=\"relu\"),\n    keras.layers.MaxPool2D(2),\n    keras.layers.Flatten(),\n    keras.layers.Dense(128, activation=\"relu\"),\n    keras.layers.Dropout(0.5),\n    keras.layers.Dense(10, activation=\"softmax\")])\nmodel.summary()\nmodel.compile(loss=\"sparse_categorical_crossentropy\", optimizer=\"adam\", metrics=[\"accuracy\"])\nhistory = model.fit(X_train, y_train, epochs=5, validation_data=(X_valid, y_valid))\ntest_loss, test_acc = model.evaluate(X_test, y_test)\nprint(f\"테스트 정확도: {test_acc:.4f}\")", "note": "", "html": "<h3 class=\"pq\">문제<\/h3><p>MNIST를 CNN으로 학습하고, 각 층의 파라미터 수를 설명하시오.<\/p><ul><li>Conv2D 32개, 3×3, padding same, ReLU → MaxPool 2<\/li><li>Conv2D 64개, 3×3, padding same, ReLU → MaxPool 2<\/li><li>Flatten → Dense 128 ReLU → Dropout 0.5 → Dense 10 Softmax<\/li><li>Optimizer: Adam, 5 epoch<\/li><\/ul><h3 class=\"pq\">정리 (마크다운에 쓸 요점)<\/h3><ul><li>Conv2D는 채널 축이 필요 → <code>[..., np.newaxis]<\/code>로 (28, 28) → (28, 28, 1)<\/li>\n<li>파라미터: conv1 (3×3×1+1)×32 = 320, conv2 (3×3×32+1)×64 = 18,496, 풀링 0, Dense 7×7×64×128+128 = 401,536, 출력 1,290<\/li>\n<li>MLP보다 정확도가 높음: 이웃 픽셀(2차원 구조)을 그대로 봄 (10/17)<\/li><\/ul><p class=\"res\"><b>실제 실행 결과<\/b>: Total params 421,642 · 5 epoch 테스트 정확도 0.9917 (MLP들보다 높음)<\/p>", "out": "", "extra": ""}, {"sec": "practice", "title": "[6주차 형식] 함수 한 줄 설명 + 에러 원인 쓰는 법", "kw": "6주차 과제 형식 한 줄 설명 에러 원인 수정 마크다운 쓰는 법 예시", "code": "", "note": "", "html": "<p>6주차 제출본에서 쓴 형식 그대로:<\/p>\n<pre class=\"out\"><code>`MyDense` : Dense 층을 직접 구현한 것.\n- `__init__` : 뉴런 수와 활성화 함수를 저장\n- `build` : 입력 크기를 처음 알게 될 때 가중치(kernel)와 편향(bias)을 생성\n- `call` : 입력 @ 가중치 + 편향 후 활성화 함수 적용\n- `get_config` : 모델 저장 시 units, activation 값도 함께 저장되도록 반환<\/code><\/pre>\n<pre class=\"out\"><code>**에러 원인**\n`TypeError: hi2() takes 1 positional argument but 2 were given`\n`hi2`는 인자를 하나(`Names`)만 받도록 정의되어 있는데 '이순신', '안중근' 두 개를 넣어서 에러가 발생했다.\n**수정** : 두 이름을 리스트 하나로 묶어서 전달했다.<\/code><\/pre>\n<ul><li>순서: <b>무엇을 하는지<\/b>(한 줄) → 메서드별로 <b>언제·무엇을<\/b><\/li>\n<li>에러: <b>에러 메시지 그대로<\/b> → <b>왜<\/b>(정의와 사용이 어떻게 안 맞는지) → <b>어떻게 고쳤는지<\/b><\/li>\n<li>다른 노트북의 에러는 \"노트북 에러 수정\" 분류에 같은 형식의 문장이 있음<\/li><\/ul>", "out": "", "extra": ""}, {"sec": "practice", "title": "[6주차 형식] 5장 함수·클래스 한 줄 설명", "kw": "5장 한 줄 설명 huber_fn create_huber HuberLoss my_softplus MyGlorotInitializer MyL1Regularizer MyPositiveWeights HuberMetric", "code": "", "note": "", "html": "<table><tr><th>이름<\/th><th>한 줄 설명<\/th><\/tr><tr><td><code>huber_fn<\/code><\/td><td>오차가 1보다 작으면 제곱/2, 크면 |오차|−0.5를 tf.where로 골라 반환하는 손실 함수<\/td><\/tr><tr><td><code>create_huber<\/code><\/td><td>threshold를 받아 그 값을 기준으로 하는 huber_fn을 만들어 반환하는 함수(함수를 만드는 함수)<\/td><\/tr><tr><td><code>HuberLoss<\/code><\/td><td>keras.losses.Loss를 상속한 후버 손실 클래스. get_config로 threshold도 모델에 저장됨<\/td><\/tr><tr><td><code>my_softplus<\/code><\/td><td>사용자 정의 활성화 함수 log(1 + e^z)<\/td><\/tr><tr><td><code>MyGlorotInitializer<\/code><\/td><td>표준편차 √(2/(fan_in+fan_out))인 정규분포로 가중치를 초기화하는 사용자 정의 초기화<\/td><\/tr><tr><td><code>MyL1Regularizer<\/code><\/td><td>가중치 절댓값 합 × 계수(0.01 또는 factor)를 손실에 더하는 L1 규제. factor 버전은 get_config로 계수도 저장<\/td><\/tr><tr><td><code>MyPositiveWeights<\/code><\/td><td>음수 가중치를 0으로 바꾸는 제약(constraint)<\/td><\/tr><tr><td><code>HuberMetric<\/code><\/td><td>배치마다 후버 값의 합(total)과 개수(count)를 누적해 평균을 내는 스트리밍 지표<\/td><\/tr><tr><td><code>update_state<\/code><\/td><td>새 배치의 값을 total·count에 더하는 메서드<\/td><\/tr><tr><td><code>result<\/code><\/td><td>지금까지 누적한 total / count를 반환하는 메서드<\/td><\/tr><tr><td><code>@register_keras_serializable()<\/code><\/td><td>사용자 정의 클래스를 저장·로드할 때 케라스가 이름으로 찾을 수 있게 등록<\/td><\/tr><\/table>", "out": "", "extra": ""}, {"sec": "practice", "title": "[6주차 형식] 6장 함수·클래스 한 줄 설명", "kw": "6장 한 줄 설명 Lambda MyDense MyMultiLayer AddGaussianNoise ResidualBlock ResidualRegressor GradientTape random_batch print_status_bar tf.function", "code": "", "note": "", "html": "<table><tr><th>이름<\/th><th>한 줄 설명<\/th><\/tr><tr><td><code>keras.layers.Lambda<\/code><\/td><td>가중치 없이 정해진 계산만 하는 층(예: 입력에 e^x)<\/td><\/tr><tr><td><code>MyDense<\/code><\/td><td>Dense 층을 직접 구현. build에서 가중치·편향 생성, call에서 입력@가중치+편향 후 활성화<\/td><\/tr><tr><td><code>MyMultiLayer<\/code><\/td><td>입력 두 개를 받아 더하기·곱하기·나누기 세 결과를 반환하는 층(가중치 없음)<\/td><\/tr><tr><td><code>AddGaussianNoise<\/code><\/td><td>훈련할 때(training=True)만 입력에 가우시안 노이즈를 더하는 층<\/td><\/tr><tr><td><code>compute_output_shape<\/code><\/td><td>층의 출력 크기를 알려 주는 메서드(노이즈 층은 입력과 같음)<\/td><\/tr><tr><td><code>ResidualBlock<\/code><\/td><td>Dense 여러 개를 통과한 결과에 원래 입력을 더하는(스킵 연결) 블록<\/td><\/tr><tr><td><code>ResidualRegressor<\/code><\/td><td>keras.Model을 상속한 사용자 정의 모델: Dense → ResidualBlock 반복 → 출력<\/td><\/tr><tr><td><code>tf.GradientTape<\/code><\/td><td>with 블록 안의 계산을 기록했다가 tape.gradient로 미분값을 자동 계산<\/td><\/tr><tr><td><code>tape.watch<\/code><\/td><td>상수(tf.constant)도 미분 대상으로 기록하게 강제<\/td><\/tr><tr><td><code>random_batch<\/code><\/td><td>훈련 데이터에서 batch_size개를 무작위로 뽑아 미니배치를 만듦<\/td><\/tr><tr><td><code>print_status_bar<\/code><\/td><td>현재 진행 수와 손실·지표 값을 한 줄로 출력<\/td><\/tr><tr><td><code>optimizer.apply_gradients<\/code><\/td><td>구한 기울기로 가중치를 갱신<\/td><\/tr><tr><td><code>tf.function<\/code><\/td><td>파이썬 함수를 텐서플로 그래프로 바꿔 빠르게 실행<\/td><\/tr><tr><td><code>get_concrete_function<\/code><\/td><td>특정 입력 타입에 맞춰 만들어진 실제 그래프 함수를 가져옴<\/td><\/tr><\/table>", "out": "", "extra": ""}, {"sec": "practice", "title": "[6주차 형식] 7장 함수·클래스 한 줄 설명", "kw": "7장 cnn 한 줄 설명 plot_image crop feature_map_size manual_same_padding DepthMaxPool tf.nn.conv2d Conv2D MaxPool2D", "code": "", "note": "", "html": "<table><tr><th>이름<\/th><th>한 줄 설명<\/th><\/tr><tr><td><code>load_sample_image<\/code><\/td><td>사이킷런 예제 사진(china.jpg, flower.jpg)을 불러옴 (427×640×3)<\/td><\/tr><tr><td><code>plot_image / plot_color_image<\/code><\/td><td>흑백/컬러 이미지를 축 없이 그려 주는 함수<\/td><\/tr><tr><td><code>inspectFilters<\/code><\/td><td>필터 배열(7×7×3×2)의 값을 행·채널별로 출력해 보는 함수<\/td><\/tr><tr><td><code>tf.nn.conv2d<\/code><\/td><td>직접 만든 필터로 합성곱을 계산 (strides: 몇 칸씩, padding: SAME/VALID)<\/td><\/tr><tr><td><code>crop<\/code><\/td><td>이미지의 일부 영역(150:220, 130:250)만 잘라 반환<\/td><\/tr><tr><td><code>feature_map_size<\/code><\/td><td>입력 크기·커널·스트라이드·패딩으로 출력(특성 맵) 크기를 계산<\/td><\/tr><tr><td><code>pad_before_and_padded_size<\/code><\/td><td>SAME 패딩에 필요한 앞쪽 패딩 수와 패딩 후 크기를 계산<\/td><\/tr><tr><td><code>manual_same_padding<\/code><\/td><td>이미지 둘레에 0을 채워 SAME 패딩을 직접 구현<\/td><\/tr><tr><td><code>keras.layers.Conv2D<\/code><\/td><td>합성곱 층. 필터 값은 학습되는 가중치<\/td><\/tr><tr><td><code>keras.layers.MaxPool2D<\/code><\/td><td>칸 안의 최댓값만 남겨 크기를 줄이는 층(파라미터 0)<\/td><\/tr><tr><td><code>DepthMaxPool<\/code><\/td><td>채널(깊이) 방향으로 최댓값 풀링하는 사용자 정의 층<\/td><\/tr><\/table>", "out": "", "extra": ""}, {"sec": "nberr", "title": "한눈에: 교수님 노트북에서 실제로 나는 에러", "kw": "에러 목록 요약 한눈에 전체 에러 수정 원인 노트북 실행 과제 텍스트 박스", "code": "", "note": "", "html": "<p>노트북 8개를 처음부터 끝까지 실행한 결과. <b>일부러 에러를 보여 주는 셀<\/b>(교수님이 바로 아래에 고친 셀이나 \"왜 예외가 발생했을까?\"를 둔 곳)과 <b>버전이 바뀌어서 나는 에러<\/b>가 섞여 있음.<\/p>\n<table>\n<tr><th>노트북<\/th><th>셀 코드<\/th><th>에러<\/th><th>한 줄 원인 → 수정<\/th><\/tr>\n<tr><td>5장<\/td><td><code>tf.constant(2.0) + t2<\/code><\/td><td>InvalidArgumentError<\/td><td>float32 + float64, 자동 형변환 없음 → <code>tf.cast(t2, tf.float32)<\/code><\/td><\/tr>\n<tr><td>5장<\/td><td><code>v[1] = [7., 8., 9.]<\/code><\/td><td>TypeError<\/td><td>Variable은 = 로 대입 불가 → <code>v[1].assign([7., 8., 9.])<\/code><\/td><\/tr>\n<tr><td>5장<\/td><td><code>s6 = tf.sparse.to_dense(s5)<\/code> 후 <code>s6<\/code><\/td><td>InvalidArgumentError → NameError<\/td><td>희소 텐서 인덱스가 정렬 안 됨 → <code>tf.sparse.reorder(s5)<\/code><\/td><\/tr>\n<tr><td>6장<\/td><td><code>hi2('이순신', '안중근')<\/code><\/td><td>TypeError<\/td><td>매개변수에 * 가 없어 하나만 받음 → <code>def hi2(*Names)<\/code><\/td><\/tr>\n<tr><td>7-2<\/td><td><code>from keras.layers.core import ...<\/code><\/td><td>ModuleNotFoundError<\/td><td>Keras 3에서 core 경로가 없어짐 → <code>from keras.layers import ...<\/code><\/td><\/tr>\n<tr><td>7-2<\/td><td><code>mlp.save('/content/drive/MyDrive/mlp')<\/code><\/td><td>ValueError<\/td><td>Keras 3는 확장자 필수 → <code>'... /mlp.keras'<\/code> (+ 드라이브 마운트)<\/td><\/tr>\n<tr><td>7-2<\/td><td><code>Image.open('/content/digit.png')<\/code><\/td><td>FileNotFoundError<\/td><td>이미지 파일을 안 올림 → 업로드하거나 MNIST 이미지로 대신<\/td><\/tr>\n<tr><td>3·4장<\/td><td>그림 그리기(<code>draw<\/code>), <code>torchvision<\/code><\/td><td>NameError 등<\/td><td>Colab 전용 기능. Colab에선 위 셀부터 순서대로 실행하면 됨<\/td><\/tr>\n<\/table>\n<p><b>경고(에러 아님)<\/b>: <code>input_shape=<\/code>를 층에 넣음, <code>LeakyReLU(alpha=)<\/code>, <code>scipy.ndimage.filters<\/code> → 돌아가지만 새 방식으로 바꾸면 좋음 (아래 카드)<\/p>\n<p><b>NameError가 줄줄이 나오면<\/b>: 맨 처음 에러 하나 때문에 변수가 안 만들어진 것. <b>첫 번째 에러만 고치면<\/b> 뒤는 사라짐<\/p>", "out": "", "extra": ""}, {"sec": "nberr", "title": "[5장] tf.constant(2.0) + t2 → InvalidArgumentError", "kw": "float32 float64 자동 형변환 tf.cast InvalidArgumentError AddV2 double float 에러 수정 원인 노트북 실행 과제 텍스트 박스", "code": "t2 = tf.constant(40., dtype=tf.float64)\n# tf.constant(2.0) + t2                    # 에러\nprint(tf.constant(2.0) + tf.cast(t2, tf.float32))   # 42.0", "note": "", "html": "<p><b>에러 메시지<\/b><\/p><pre class=\"out\"><code>InvalidArgumentError: cannot compute AddV2 as input #1(zero-based) was expected to be a float tensor but is a double tensor [Op:AddV2]<\/code><\/pre><p><b>원인<\/b>: tf.constant(2.0)은 float32, t2는 float64(double). 텐서플로는 타입을 자동으로 바꿔 주지 않음(속도·의도치 않은 변환 방지)<\/p><p><b>텍스트 박스에 쓸 문장 (예시, 자기 말로 바꿔 쓰기)<\/b><\/p><blockquote>float32 텐서와 float64 텐서를 더해서 에러가 났다. 텐서플로는 자동 형변환을 하지 않으므로 tf.cast로 t2를 float32로 바꿔서 더했다.<\/blockquote>", "out": "", "extra": ""}, {"sec": "nberr", "title": "[5장] v[1] = [7., 8., 9.] → TypeError", "kw": "variable assign 대입 item assignment ResourceVariable TypeError 에러 수정 원인 노트북 실행 과제 텍스트 박스", "code": "v = tf.Variable([[1., 2., 3.], [4., 5., 6.]])\n# v[1] = [7., 8., 9.]                      # 에러\nv[1].assign([7., 8., 9.])\nprint(v)", "note": "", "html": "<p><b>에러 메시지<\/b><\/p><pre class=\"out\"><code>TypeError: 'ResourceVariable' object does not support item assignment<\/code><\/pre><p><b>원인<\/b>: tf.Variable은 = 부호로 원소에 값을 넣을 수 없음. 값을 바꿀 땐 assign을 써야 함 (교수님 노트북 위 마크다운: \"= 부호로 assign을 할 수 없다\")<\/p><p><b>텍스트 박스에 쓸 문장 (예시, 자기 말로 바꿔 쓰기)<\/b><\/p><blockquote>tf.Variable의 일부를 = 로 바꾸려고 해서 에러가 났다. 변수 값은 assign()으로 바꿔야 하므로 v[1].assign([7., 8., 9.])로 고쳤다.<\/blockquote>", "out": "", "extra": ""}, {"sec": "nberr", "title": "[5장] 희소 텐서 s6 → InvalidArgumentError, 그 다음 NameError", "kw": "sparse 희소 텐서 reorder 정렬 인덱스 to_dense s5 s6 NameError 에러 수정 원인 노트북 실행 과제 텍스트 박스", "code": "s5 = tf.SparseTensor(indices=[[0, 2], [0, 1]],\n                     values=[1., 2.],\n                     dense_shape=[3, 4])\ns6 = tf.sparse.to_dense(tf.sparse.reorder(s5))     # 인덱스를 정렬한 뒤 변환\nprint(s6)", "note": "", "html": "<p><b>에러 메시지<\/b><\/p><pre class=\"out\"><code>indices[1] = [0,1] is out of order. Many sparse ops require sorted indices.\n    Use `tf.sparse.reorder` to create a correctly ordered copy.\n...\nNameError: name 's6' is not defined<\/code><\/pre><p><b>원인<\/b>: 인덱스 [0,2] 다음에 [0,1]이 와서 (행, 열) 순서가 정렬되어 있지 않음. try에서 to_dense가 실패해 s6이 만들어지지 않았고, 그래서 마지막 줄 s6에서 NameError<\/p><p><b>텍스트 박스에 쓸 문장 (예시, 자기 말로 바꿔 쓰기)<\/b><\/p><blockquote>희소 텐서의 인덱스가 순서대로 정렬되어 있지 않아 to_dense에서 에러가 났고, 그 때문에 s6이 만들어지지 않아 NameError도 났다. tf.sparse.reorder로 정렬한 뒤 변환했다.<\/blockquote>", "out": "", "extra": ""}, {"sec": "nberr", "title": "[6장] hi2('이순신', '안중근') → TypeError", "kw": "*args 별표 가변 인자 hi hi2 hi3 TypeError positional argument 에러 수정 원인 노트북 실행 과제 텍스트 박스", "code": "def hi2(*Names):                 # * 를 붙이면 여러 개를 튜플로 받음\n    for name in Names:\n        print(\"%s %s\" % (name[0], name[1:3]), end=' ')\n    print(\"\\n\")\n    print(type(Names), Names)\n\nhi2('이순신', '안중근')\n# 또는 * 없이 두고 하나로 묶어서 넘기기: hi2_원래(['이순신', '안중근'])", "note": "", "html": "<p><b>에러 메시지<\/b><\/p><pre class=\"out\"><code>TypeError: hi2() takes 1 positional argument but 2 were given<\/code><\/pre><p><b>원인<\/b>: hi2는 매개변수 앞에 * 가 없어서 인자를 하나만 받는데 두 개를 넘김 (바로 위 hi는 *Names라서 됨, 10/10 \"별표 하나는 뭘 할 것 같아?\")<\/p><p><b>텍스트 박스에 쓸 문장 (예시, 자기 말로 바꿔 쓰기)<\/b><\/p><blockquote>hi2는 인자를 하나만 받도록 정의됐는데 두 개를 넘겨서 에러가 났다. 매개변수를 *Names로 바꿔 여러 값을 튜플로 받게 했다.<\/blockquote>", "out": "", "extra": ""}, {"sec": "nberr", "title": "[7-2] from keras.layers.core import ... → ModuleNotFoundError", "kw": "keras.layers.core ModuleNotFoundError import 경로 keras 3 Dense Dropout Activation Flatten NameError model 에러 수정 원인 노트북 실행 과제 텍스트 박스", "code": "from keras.models import Sequential\nfrom keras.layers import Dense, Dropout, Activation, Flatten, MaxPooling2D, Conv2D\n\ninput_shape = (28, 28, 1)\nmodel = Sequential()\nmodel.add(keras.layers.Input(shape=input_shape))          # input_shape= 대신 Input 층 (경고 없애기)\nmodel.add(Conv2D(32, kernel_size=(3, 3), padding='same'))\nmodel.add(MaxPooling2D(pool_size=(2, 2)))\nmodel.add(Conv2D(64, kernel_size=(3, 3), padding='same'))\nmodel.add(MaxPooling2D(pool_size=(2, 2)))\nmodel.add(Flatten())\nmodel.add(Dense(128))\nmodel.add(Activation('relu'))\nmodel.add(Dropout(0.2))\nmodel.add(Dense(10))\nmodel.add(Activation('softmax'))\nmodel.summary()", "note": "", "html": "<p><b>에러 메시지<\/b><\/p><pre class=\"out\"><code>ModuleNotFoundError: No module named 'keras.layers.core'\n(이후 셀) NameError: name 'model' is not defined<\/code><\/pre><p><b>원인<\/b>: 예전 Keras는 Dense 등이 keras.layers.core에 있었지만 지금 Keras 3에는 그 경로가 없음. import가 실패해 model이 안 만들어져서 뒤 셀(compile·fit·evaluate·predict)이 전부 NameError<\/p><p><b>텍스트 박스에 쓸 문장 (예시, 자기 말로 바꿔 쓰기)<\/b><\/p><blockquote>keras.layers.core 모듈이 현재 버전에 없어서 import 에러가 났고, 그래서 model이 정의되지 않아 뒤 셀들도 NameError가 났다. from keras.layers import로 경로를 바꿨다.<\/blockquote>", "out": "", "extra": ""}, {"sec": "nberr", "title": "[7-2] mlp.save('/content/drive/MyDrive/mlp') → ValueError", "kw": "save 저장 확장자 .keras h5 ValueError drive mount 드라이브 에러 수정 원인 노트북 실행 과제 텍스트 박스", "code": "# Colab에서 드라이브에 저장하려면 먼저 마운트\n# from google.colab import drive\n# drive.mount('/content/drive')\nmlp = keras.Sequential([keras.layers.Input(shape=(784,)), keras.layers.Dense(10, activation=\"softmax\")])\nmlp.save('mlp.keras')                               # 확장자 .keras\nmlp2 = keras.models.load_model('mlp.keras')\nprint(mlp2.count_params())", "note": "", "html": "<p><b>에러 메시지<\/b><\/p><pre class=\"out\"><code>ValueError: Invalid filepath extension for saving. Please add either a `.keras` extension for the native Keras format (recommended) or a `.h5` extension.<\/code><\/pre><p><b>원인<\/b>: Keras 3는 저장할 때 파일 이름에 .keras(또는 .h5) 확장자가 꼭 있어야 함. 드라이브 경로를 쓰려면 drive.mount도 먼저 해야 함<\/p><p><b>텍스트 박스에 쓸 문장 (예시, 자기 말로 바꿔 쓰기)<\/b><\/p><blockquote>모델 저장 경로에 확장자가 없어서 에러가 났다. 현재 Keras는 .keras 확장자가 필요하므로 'mlp.keras'로 저장했다.<\/blockquote>", "out": "", "extra": ""}, {"sec": "nberr", "title": "[7-2] Image.open('/content/digit.png') → FileNotFoundError (+ scipy 경고)", "kw": "FileNotFoundError digit.png 파일 업로드 convolve scipy.ndimage.filters deprecated np_img 에러 수정 원인 노트북 실행 과제 텍스트 박스", "code": "import numpy as np\nfrom scipy.ndimage import convolve                    # filters 경로는 곧 없어짐\nimport matplotlib.pyplot as plt\nfrom tensorflow import keras\n\n(X_train, y_train), _ = keras.datasets.mnist.load_data()\nnp_img = X_train[0].astype(float)                      # digit.png 대신 MNIST 숫자 하나\nk1 = np.array([[-1, 0, 1], [-1, 0, 1], [-1, 0, 1]])\nres = convolve(np_img, k1)\nplt.subplot(1, 2, 1); plt.imshow(np_img, cmap='gray')\nplt.subplot(1, 2, 2); plt.imshow(res, cmap='gray')\nplt.show()", "note": "", "html": "<p><b>에러 메시지<\/b><\/p><pre class=\"out\"><code>FileNotFoundError: [Errno 2] No such file or directory: '/content/digit.png'\n(이후 셀) NameError: name 'np_img' is not defined<\/code><\/pre><p><b>원인<\/b>: digit.png 파일을 Colab에 올리지 않아서 이미지를 못 읽음 → np_img가 안 만들어져 아래 합성곱·풀링 셀이 NameError. 그리고 scipy.ndimage.filters는 곧 없어질 경로라 경고<\/p><p><b>텍스트 박스에 쓸 문장 (예시, 자기 말로 바꿔 쓰기)<\/b><\/p><blockquote>digit.png 파일이 없어서 에러가 났다. 파일을 업로드하거나, MNIST 이미지 하나를 np_img로 써서 필터를 적용했다.<\/blockquote>", "out": "", "extra": ""}, {"sec": "nberr", "title": "경고(에러는 아님): input_shape · LeakyReLU(alpha) · predict_classes · np_utils", "kw": "경고 warning UserWarning input_shape alpha negative_slope predict_classes np_utils to_categorical deprecated 에러 수정 원인 노트북 실행 과제 텍스트 박스", "code": "model = keras.Sequential([\n    keras.layers.Input(shape=(28, 28)),                 # Flatten(input_shape=[28, 28]) 대신\n    keras.layers.Flatten(),\n    keras.layers.Dense(100, kernel_initializer=\"he_normal\"),\n    keras.layers.LeakyReLU(negative_slope=0.2),         # LeakyReLU(alpha=0.2) 대신\n    keras.layers.Dense(10, activation=\"softmax\")])\nX_new = np.zeros((3, 28, 28), dtype=\"float32\")\ny_pred = np.argmax(model.predict(X_new, verbose=0), axis=-1)   # predict_classes 대신\ny_onehot = keras.utils.to_categorical([3, 1, 4], 10)           # np_utils.to_categorical 대신\nprint(y_pred, y_onehot.shape)", "note": "", "html": "<table>\n<tr><th>옛 코드 (교수님 노트북)<\/th><th>나오는 것<\/th><th>새 방식<\/th><\/tr>\n<tr><td><code>Flatten(input_shape=[28, 28])<\/code>, <code>Dense(30, input_shape=[8])<\/code><\/td><td>UserWarning (실행은 됨)<\/td><td>맨 앞에 <code>keras.layers.Input(shape=...)<\/code><\/td><\/tr>\n<tr><td><code>LeakyReLU(alpha=0.2)<\/code> (4장)<\/td><td>UserWarning: alpha is deprecated<\/td><td><code>LeakyReLU(negative_slope=0.2)<\/code><\/td><\/tr>\n<tr><td><code>model.predict_classes(X_new)<\/code> (2장, 주석 처리됨)<\/td><td>AttributeError (없어진 함수)<\/td><td><code>np.argmax(model.predict(X_new), axis=-1)<\/code><\/td><\/tr>\n<tr><td><code>from keras.utils import np_utils<\/code> (7-2, 주석 처리됨)<\/td><td>ImportError<\/td><td><code>from keras.utils import to_categorical<\/code><\/td><\/tr>\n<tr><td><code>from scipy.ndimage.filters import convolve<\/code> (7-2)<\/td><td>DeprecationWarning<\/td><td><code>from scipy.ndimage import convolve<\/code><\/td><\/tr>\n<\/table>\n<p>경고는 빨간 글씨여도 실행은 끝난 것. 시험에서 \"에러를 고쳐라\"면 진짜 에러(Traceback이 있고 셀이 멈춘 것)부터<\/p>", "out": "", "extra": ""}, {"sec": "nberr", "title": "Colab 전용 셀 (내 PC 주피터에서만 나는 에러)", "kw": "google.colab eval_js 그림 그리기 draw canvas torchvision drawing.png colab 전용 로컬 에러 수정 원인 노트북 실행 과제 텍스트 박스", "code": "", "note": "", "html": "<ul>\n<li><b>3·4장·Optimizer·7-2의 숫자 그리기<\/b>: <code>from google.colab.output import eval_js<\/code> → Colab에서만 됨. 내 PC 주피터에선 <code>ModuleNotFoundError: No module named 'google.colab'<\/code>, 이어서 <code>draw<\/code>·<code>digit<\/code> NameError<\/li>\n<li><b>데이터 증강 셀<\/b>: <code>from torchvision import transforms<\/code> → Colab엔 설치돼 있음. 로컬이면 <code>pip install torchvision<\/code><\/li>\n<li><b>drawing.png<\/b>: 그리기 셀을 먼저 실행해야 파일이 생김<\/li>\n<li>시험은 교수님이 주는 Colab에서 보므로 이 셀들은 <b>위에서부터 순서대로 실행<\/b>하면 됨. 중간 셀부터 돌리면 위에서 만든 변수가 없어서 NameError<\/li>\n<\/ul>", "out": "", "extra": ""}, {"sec": "fill", "title": "# 데이터 로딩 (Fashion MNIST) · 정규화 · 학습/검증 분리", "kw": "데이터 로딩 load_data fashion 정규화 255 학습 검증 분리 X_train_full 빈칸 주석 채우기 시험", "code": "fashion_mnist = keras.datasets.fashion_mnist\n(X_train_full, y_train_full), (X_test, y_test) = fashion_mnist.load_data()\nX_valid, X_train = X_train_full[:5000] / 255., X_train_full[5000:] / 255.\ny_valid, y_train = y_train_full[:5000], y_train_full[5000:]\nX_test = X_test / 255.\nclass_names = [\"T-shirt/top\", \"Trouser\", \"Pullover\", \"Dress\", \"Coat\",\n               \"Sandal\", \"Shirt\", \"Sneaker\", \"Bag\", \"Ankle boot\"]", "note": "변수 이름: 2. 케라스 노트북과 동일", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 데이터 로딩 (MNIST) · 784로 펴기 · 원-핫 인코딩", "kw": "mnist 숫자 reshape 784 to_categorical 원핫 nb_classes Y_train 빈칸 주석 채우기 시험", "code": "from keras.datasets import mnist\nfrom keras.utils import to_categorical\n(X_train, y_train), (X_test, y_test) = mnist.load_data()\nX_train = X_train.reshape(60000, 784)\nX_test = X_test.reshape(10000, 784)\nX_train = X_train.astype('float32')\nX_test = X_test.astype('float32')\nX_train /= 255\nX_test /= 255\nnb_classes = 10\nY_train = to_categorical(y_train, nb_classes)\nY_test = to_categorical(y_test, nb_classes)", "note": "변수 이름: 3·4장 MNIST 노트북과 동일 (원-핫은 대문자 Y_train / Y_test)", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 데이터 로딩 (캘리포니아 주택) · 스케일링", "kw": "california housing 회귀 StandardScaler X_train_scaled 스케일 빈칸 주석 채우기 시험", "code": "from sklearn.datasets import fetch_california_housing\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import StandardScaler\nhousing = fetch_california_housing()\nX_train_full, X_test, y_train_full, y_test = train_test_split(\n    housing.data, housing.target.reshape(-1, 1), random_state=42)\nX_train, X_valid, y_train, y_valid = train_test_split(X_train_full, y_train_full, random_state=42)\nscaler = StandardScaler()\nX_train_scaled = scaler.fit_transform(X_train)\nX_valid_scaled = scaler.transform(X_valid)\nX_test_scaled = scaler.transform(X_test)\ninput_shape = X_train.shape[1:]", "note": "변수 이름: 5. 사용자 정의 모델 노트북과 동일", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 모델 생성 (시퀀셜)", "kw": "모델 생성 sequential dense 은닉층 model 빈칸 주석 채우기 시험", "code": "model = keras.models.Sequential([\n    keras.layers.Flatten(input_shape=[28, 28]),\n    keras.layers.Dense(300, activation=\"relu\"),\n    keras.layers.Dense(100, activation=\"relu\"),\n    keras.layers.Dense(10, activation=\"softmax\")\n])\nmodel.summary()", "note": "변수 이름: 2. 케라스 노트북과 동일", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 모델 컴파일", "kw": "compile 컴파일 loss optimizer metrics 빈칸 주석 채우기 시험", "code": "model.compile(loss=\"sparse_categorical_crossentropy\",\n              optimizer=\"sgd\",\n              metrics=[\"accuracy\"])", "note": "변수 이름: 2. 케라스 노트북과 동일 · 원-핫(Y_train)이면 loss='categorical_crossentropy'", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 학습", "kw": "학습 fit history epochs validation_data 빈칸 주석 채우기 시험", "code": "history = model.fit(X_train, y_train, epochs=30,\n                    validation_data=(X_valid, y_valid))", "note": "변수 이름: 2. 케라스 노트북과 동일", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 평가", "kw": "평가 evaluate 테스트 정확도 score 빈칸 주석 채우기 시험", "code": "model.evaluate(X_test, y_test)\n# 3·4장 스타일:\n# score = model.evaluate(X_test, Y_test)\n# print('Test score:', score[0])\n# print('Test accuracy:', score[1])", "note": "변수 이름: 2. 케라스 노트북과 동일", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 예측 (새 샘플 3개)", "kw": "예측 predict X_new y_proba y_pred argmax class_names 빈칸 주석 채우기 시험", "code": "X_new = X_test[:3]\ny_proba = model.predict(X_new)\ny_proba.round(2)\ny_pred = np.argmax(model.predict(X_new), axis=-1)\nnp.array(class_names)[y_pred]", "note": "변수 이름: 2. 케라스 노트북과 동일", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 학습 곡선 그리기", "kw": "학습곡선 history plot DataFrame 그래프 loss accuracy 빈칸 주석 채우기 시험", "code": "import pandas as pd\npd.DataFrame(history.history).plot(figsize=(8, 5))\nplt.grid(True)\nplt.gca().set_ylim(0, 1)\nplt.show()", "note": "변수 이름: 2. 케라스 노트북과 동일", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 모델 생성 (함수형 API, 와이드 & 딥)", "kw": "함수형 functional wide deep concatenate input_ hidden1 hidden2 concat output 빈칸 주석 채우기 시험", "code": "input_ = keras.layers.Input(shape=X_train.shape[1:])\nhidden1 = keras.layers.Dense(30, activation=\"relu\")(input_)\nhidden2 = keras.layers.Dense(30, activation=\"relu\")(hidden1)\nconcat = keras.layers.concatenate([input_, hidden2])\noutput = keras.layers.Dense(1)(concat)\nmodel = keras.models.Model(inputs=[input_], outputs=[output])", "note": "변수 이름: 2. 케라스 노트북과 동일 (캘리포니아 주택 데이터)", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 저장과 복원", "kw": "save load 저장 복원 my_keras_model model2 빈칸 주석 채우기 시험", "code": "model.save(\"my_keras_model.keras\")\nmodel2 = keras.models.load_model(\"my_keras_model.keras\")", "note": "변수 이름: 2. 케라스 노트북과 동일", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 훈련 과정에서 콜백 사용하기 (체크포인트 · 조기 종료)", "kw": "callback 콜백 checkpoint_cb early_stopping_cb ModelCheckpoint EarlyStopping 빈칸 주석 채우기 시험", "code": "model = keras.models.Sequential([\n    keras.layers.Dense(30, activation=\"relu\", input_shape=[8]),\n    keras.layers.Dense(30, activation=\"relu\"),\n    keras.layers.Dense(1)\n])\nmodel.compile(loss=\"mse\", optimizer=keras.optimizers.SGD(learning_rate=1e-3))\ncheckpoint_cb = keras.callbacks.ModelCheckpoint(\"my_keras_model.keras\", save_best_only=True)\nearly_stopping_cb = keras.callbacks.EarlyStopping(patience=10, restore_best_weights=True)\nhistory = model.fit(X_train, y_train, epochs=100,\n                    validation_data=(X_valid, y_valid),\n                    callbacks=[checkpoint_cb, early_stopping_cb])\nmodel = keras.models.load_model(\"my_keras_model.keras\")  # 최상의 모델로 롤백\nmse_test = model.evaluate(X_test, y_test)", "note": "변수 이름: 2. 케라스 노트북과 동일 (캘리포니아 주택 데이터, 스케일링한 X_train 사용)", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 초기화를 바꿔 학습하고 손실 비교 (h_he · plot_loss)", "kw": "initializer he_normal h_he plot_loss 비교 history 초기화 활성화 빈칸 주석 채우기 시험", "code": "np.random.seed(42)\ntf.random.set_seed(42)\nmodel = keras.models.Sequential([\n    keras.layers.Flatten(input_shape=[28, 28]),\n    keras.layers.Dense(300, activation=\"relu\", kernel_initializer='he_normal'),\n    keras.layers.Dense(100, activation=\"relu\", kernel_initializer='he_normal'),\n    keras.layers.Dense(10, activation=\"softmax\")\n])\nmodel.compile(loss=\"sparse_categorical_crossentropy\", optimizer=\"sgd\", metrics=[\"accuracy\"])\nh_he = model.fit(X_train, y_train, epochs=20, validation_data=(X_valid, y_valid))\nmodel.evaluate(X_test, y_test)\n\ndef plot_loss(*args, figsize=(10, 5)):          # 노트북에 이미 있는 함수\n    def plot_ind_loss(history, label):\n        plt.plot(history.history['loss'], label=label)\n        plt.title('loss over epochs'); plt.ylabel('loss'); plt.xlabel('epochs'); plt.legend()\n    plt.figure(figsize=figsize)\n    for i, fstr in enumerate(args):\n        f = globals().get(fstr) if isinstance(fstr, str) else fstr\n        fstr = fstr if isinstance(fstr, str) else i\n        plot_ind_loss(f, fstr)\n\nplot_loss(\"history\", \"h_he\")      # 변수 이름을 문자열로 전달", "note": "변수 이름: 4. 신경망 요소 노트북과 동일 · 다른 실험도 h_random, h_sigmoid, h_leaky, h_leaky_he, h_selu 처럼 이름을 붙여 plot_loss에 넘김", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 배치 정규화 적용 모델", "kw": "batch normalization 배치정규화 BatchNormalization elu he_normal 빈칸 주석 채우기 시험", "code": "model = keras.models.Sequential([\n    keras.layers.Flatten(input_shape=[28, 28]),\n    keras.layers.BatchNormalization(),\n    keras.layers.Dense(300, activation=\"elu\", kernel_initializer='he_normal'),\n    keras.layers.BatchNormalization(),\n    keras.layers.Dense(100, activation=\"elu\", kernel_initializer='he_normal'),\n    keras.layers.BatchNormalization(),\n    keras.layers.Dense(10, activation=\"softmax\")\n])\nmodel.compile(loss=\"sparse_categorical_crossentropy\", optimizer=\"sgd\", metrics=[\"accuracy\"])\nmodel.fit(X_train, y_train, epochs=20, validation_data=(X_valid, y_valid))\nmodel.evaluate(X_test, y_test)", "note": "변수 이름: 4. 신경망 요소 노트북과 동일", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# Optimizer 지정 (Momentum · NAG · Adam)", "kw": "optimizer 옵티마이저 momentum nag nesterov adam beta_1 beta_2 빈칸 주석 채우기 시험", "code": "optimizer = keras.optimizers.SGD(learning_rate=0.001, momentum=0.9)                 # Momentum\noptimizer = keras.optimizers.SGD(learning_rate=0.001, momentum=0.9, nesterov=True)  # NAG\noptimizer = keras.optimizers.Adam(learning_rate=0.001, beta_1=0.9, beta_2=0.999)     # Adam\nmodel.compile(loss=\"sparse_categorical_crossentropy\",\n              optimizer=optimizer,\n              metrics=[\"accuracy\"])", "note": "변수 이름: 4. 신경망 요소 노트북과 동일 · 셋 중 쓰는 한 줄만 남김", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# Dropout 적용", "kw": "dropout 드롭아웃 rate 빈칸 주석 채우기 시험", "code": "model = keras.models.Sequential([\n    keras.layers.Flatten(input_shape=[28, 28]),\n    keras.layers.Dense(300, activation=\"relu\", kernel_initializer='he_normal'),\n    keras.layers.Dense(100, activation=\"relu\", kernel_initializer='he_normal'),\n    keras.layers.Dropout(rate=0.2),\n    keras.layers.Dense(10, activation=\"softmax\")\n])", "note": "변수 이름: 4. 신경망 요소 노트북과 동일", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# feed forward (z_1, a_1, ... output)", "kw": "feed forward 순전파 numpy z_1 a_1 w_1 b_1 sigmoid softmax output 빈칸 주석 채우기 시험", "code": "w_1 = np.random.rand(16, 784)   # (# of neurons, # of inputs)\nb_1 = np.random.rand(16)\nw_2 = np.random.rand(16, 16)\nb_2 = np.random.rand(16)\nw_o = np.random.rand(10, 16)\nb_o = np.random.rand(10)\n\nz_1 = np.dot(w_1, X_train.T)\nz_1 = z_1.T + b_1\na_1 = sigmoid(z_1)\nz_2 = np.dot(w_2, a_1.T)\nz_2 = z_2.T + b_2\na_2 = sigmoid(z_2)\nz_o = np.dot(w_o, a_2.T)\nz_o = z_o.T + b_o\noutput = softmax(z_o)", "note": "변수 이름: 4. 신경망요소-Optimizer(NumPy) 노트북과 동일 · X_train은 (60000, 784)로 편 상태, sigmoid·softmax 함수는 노트북에 정의됨", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 손실 구하기 (cross entropy)", "kw": "손실 loss cross_entropy_loss 교차 엔트로피 numpy 빈칸 주석 채우기 시험", "code": "def cross_entropy_loss(y_actual, y_pred):\n    epsilon = 1e-15\n    y_pred = np.clip(y_pred, epsilon, 1 - epsilon)\n    return -np.sum(y_actual * np.log(y_pred)) / len(y_actual)\n\nloss = cross_entropy_loss(Y_train, output)\nprint(\"Loss:\", loss)", "note": "변수 이름: 4. 신경망요소-Optimizer(NumPy) 노트북과 동일", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# Backpropagation (출력층 → 은닉층 경사)", "kw": "backpropagation 역전파 경사 gradient d_output d_weight_o d_bias_o d_layer2 d_layer1 빈칸 주석 채우기 시험", "code": "# Gradient of the output layer\nd_output = output - Y_train\n# Gradient of the output layer weights and biases\nd_weight_o = np.dot(d_output.T, a_2) / len(Y_train)\nd_bias_o = np.sum(d_output, axis=0) / len(Y_train)\n# Gradient of the second hidden layer\nd_layer2 = np.dot(d_output, w_o) * (a_2 * (1 - a_2))\n# Gradient of the second hidden layer weights and biases\nd_weight_2 = np.dot(d_layer2.T, a_1) / len(Y_train)\nd_bias_2 = np.sum(d_layer2, axis=0) / len(Y_train)\n# Gradient of the first hidden layer\nd_layer1 = np.dot(d_layer2, w_2) * (a_1 * (1 - a_1))\n# Gradient of the first hidden layer weights and biases\nd_weight_1 = np.dot(d_layer1.T, X_train) / len(Y_train)\nd_bias_1 = np.sum(d_layer1, axis=0) / len(Y_train)", "note": "변수 이름: 4. 신경망요소-Optimizer(NumPy) 노트북과 동일 (주석도 노트북과 같음)", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# Optimization step (가중치 갱신)", "kw": "optimization step 가중치 갱신 update learning_rate numpy 빈칸 주석 채우기 시험", "code": "learning_rate = 0.01\nw_1 = w_1 - learning_rate * d_weight_1\nb_1 = b_1 - learning_rate * d_bias_1\nw_2 = w_2 - learning_rate * d_weight_2\nb_2 = b_2 - learning_rate * d_bias_2\nw_o = w_o - learning_rate * d_weight_o\nb_o = b_o - learning_rate * d_bias_o", "note": "변수 이름: 4. 신경망요소-Optimizer(NumPy) 노트북과 동일", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 사용자 정의 손실 함수 (huber_fn) 로 학습", "kw": "huber_fn 사용자 정의 손실 custom loss compile nadam mae 빈칸 주석 채우기 시험", "code": "def huber_fn(y_true, y_pred):\n    error = y_true - y_pred\n    is_small_error = tf.abs(error) < 1\n    squared_loss = tf.square(error) / 2\n    linear_loss  = tf.abs(error) - 0.5\n    return tf.where(is_small_error, squared_loss, linear_loss)\n\nmodel = keras.models.Sequential([\n    keras.layers.Input(shape=input_shape),\n    keras.layers.Dense(30, activation=\"selu\", kernel_initializer=\"lecun_normal\"),\n    keras.layers.Dense(1),\n])\nmodel.compile(loss=huber_fn, optimizer=\"nadam\", metrics=[\"mae\"])\nmodel.fit(X_train_scaled, y_train, epochs=2,\n          validation_data=(X_valid_scaled, y_valid))", "note": "변수 이름: 5. 사용자 정의 모델 노트북과 동일", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 사용자 정의 요소를 가진 모델을 저장하고 로드하기", "kw": "custom_objects 저장 로드 사용자 정의 huber 빈칸 주석 채우기 시험", "code": "model.save(\"my_model_with_a_custom_loss.keras\")\nmodel = keras.models.load_model(\"my_model_with_a_custom_loss.keras\",\n                                custom_objects={\"huber_fn\": huber_fn})", "note": "변수 이름: 5. 사용자 정의 모델 노트북과 동일", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 사용자 정의 Layer (MyDense) 로 모델 만들기", "kw": "MyDense 사용자 정의 층 build call kernel bias 빈칸 주석 채우기 시험", "code": "class MyDense(tf.keras.layers.Layer):\n    def __init__(self, units, activation=None, **kwargs):\n        super().__init__(**kwargs)\n        self.units = units\n        self.activation = tf.keras.activations.get(activation)\n\n    def build(self, batch_input_shape):\n        self.kernel = self.add_weight(\n            name=\"kernel\", shape=[batch_input_shape[-1], self.units],\n            initializer=\"he_normal\")\n        self.bias = self.add_weight(\n            name=\"bias\", shape=[self.units], initializer=\"zeros\")\n\n    def call(self, X):\n        return self.activation(X @ self.kernel + self.bias)\n\n    def get_config(self):\n        base_config = super().get_config()\n        return {**base_config, \"units\": self.units,\n                \"activation\": tf.keras.activations.serialize(self.activation)}\n\nmodel = keras.models.Sequential([\n    keras.layers.Input(shape=input_shape),\n    MyDense(30, activation=\"relu\"),\n    MyDense(1)\n])\nmodel.compile(loss=\"mse\", optimizer=\"nadam\")\nmodel.fit(X_train_scaled, y_train, epochs=2, validation_data=(X_valid_scaled, y_valid))\nmodel.evaluate(X_test_scaled, y_test)", "note": "변수 이름: 6. 사용자 정의 모델 2 노트북과 동일", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# GradientTape로 그레이디언트 계산하기", "kw": "gradienttape 자동 미분 tape gradient w1 w2 dy_dx 빈칸 주석 채우기 시험", "code": "x = tf.Variable(7.0)\na = 3\nb = 3\nwith tf.GradientTape() as tape:\n  y = a * x ** 2 + b\ndy_dx = tape.gradient(y, x)\nprint(dy_dx)                          # 42\n\ndef f(w1, w2):\n    return 3 * w1 ** 2 + 2 * w1 * w2\nw1, w2 = tf.Variable(5.), tf.Variable(3.)\nwith tf.GradientTape() as tape:\n    z = f(w1, w2)\ngradients = tape.gradient(z, [w1, w2])\ngradients                             # [36, 10]", "note": "변수 이름: 6. 사용자 정의 모델 2 노트북과 동일", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 사용자 정의 훈련 반복", "kw": "custom training loop 훈련 반복 n_epochs n_steps random_batch loss_fn mean_loss apply_gradients 빈칸 주석 채우기 시험", "code": "def random_batch(X, y, batch_size=32):\n    idx = np.random.randint(len(X), size=batch_size)\n    return X[idx], y[idx]\n\nl2_reg = keras.regularizers.l2(0.05)\nmodel = keras.models.Sequential([\n    keras.layers.Dense(30, activation=\"elu\", kernel_initializer=\"he_normal\",\n                       kernel_regularizer=l2_reg),\n    keras.layers.Dense(1, kernel_regularizer=l2_reg)\n])\nn_epochs = 5\nbatch_size = 32\nn_steps = len(X_train) // batch_size\noptimizer = keras.optimizers.Nadam(learning_rate=0.01)\nloss_fn = keras.losses.MeanSquaredError()\nmean_loss = keras.metrics.Mean()\nmetrics = [keras.metrics.MeanAbsoluteError()]\n\nfor epoch in range(1, n_epochs + 1):\n    print(\"Epoch {}/{}\".format(epoch, n_epochs))\n    for step in range(1, n_steps + 1):\n        X_batch, y_batch = random_batch(X_train_scaled, y_train)\n        with tf.GradientTape() as tape:\n            y_pred = model(X_batch)\n            main_loss = tf.reduce_mean(loss_fn(y_batch, y_pred))\n            loss = tf.add_n([main_loss] + model.losses)\n        gradients = tape.gradient(loss, model.trainable_variables)\n        optimizer.apply_gradients(zip(gradients, model.trainable_variables))\n        mean_loss(loss)\n        for metric in metrics:\n            metric(y_batch, y_pred)\n    print(\"loss:\", float(mean_loss.result()), [float(m.result()) for m in metrics])\n    for metric in [mean_loss] + metrics:\n        metric.reset_state()", "note": "변수 이름: 6. 사용자 정의 모델 2 노트북과 동일", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 2개의 필터를 만들고 합성곱 하기 (수직선 · 수평선)", "kw": "filters 필터 conv2d images outputs 수직선 수평선 load_sample_image china flower 빈칸 주석 채우기 시험", "code": "from sklearn.datasets import load_sample_image\nchina = load_sample_image(\"china.jpg\") / 255\nflower = load_sample_image(\"flower.jpg\") / 255\nimages = np.array([china, flower])\nbatch_size, height, width, channels = images.shape\n\nfilters = np.zeros(shape=(7, 7, channels, 2), dtype=np.float32)\nfilters[:, 3, :, 0] = 1  # 수직선\nfilters[3, :, :, 1] = 1  # 수평선\noutputs = tf.nn.conv2d(images, filters, strides=1, padding=\"SAME\")\nplt.imshow(outputs[0, :, :, 1], cmap=\"gray\"); plt.axis(\"off\"); plt.show()", "note": "변수 이름: 7-1 / 7-2 CNN 노트북과 동일", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 풀링 층 (max_pool · avg_pool · global_avg_pool)", "kw": "pooling 풀링 max_pool avg_pool global_avg_pool cropped_images 빈칸 주석 채우기 시험", "code": "def crop(images):\n    return images[150:220, 130:250]\ncropped_images = np.array([crop(image) for image in images], dtype=np.float32)\nmax_pool = keras.layers.MaxPool2D(pool_size=2)\noutput = max_pool(cropped_images)\navg_pool = keras.layers.AvgPool2D(pool_size=2)\noutput_avg = avg_pool(cropped_images)\nglobal_avg_pool = keras.layers.GlobalAvgPool2D()\nglobal_avg_pool(cropped_images)", "note": "변수 이름: 7-1 / 7-2 CNN 노트북과 동일", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# CNN용 데이터 준비 (표준화 · 채널 차원 추가)", "kw": "cnn 데이터 X_mean X_std newaxis 표준화 채널 빈칸 주석 채우기 시험", "code": "(X_train_full, y_train_full), (X_test, y_test) = keras.datasets.fashion_mnist.load_data()\nX_train, X_valid = X_train_full[:-5000], X_train_full[-5000:]\ny_train, y_valid = y_train_full[:-5000], y_train_full[-5000:]\nX_mean = X_train.mean(axis=0, keepdims=True)\nX_std = X_train.std(axis=0, keepdims=True) + 1e-7\nX_train = (X_train - X_mean) / X_std\nX_valid = (X_valid - X_mean) / X_std\nX_test = (X_test - X_mean) / X_std\nX_train = X_train[..., np.newaxis]\nX_valid = X_valid[..., np.newaxis]\nX_test = X_test[..., np.newaxis]", "note": "변수 이름: 7-1 / 7-2 CNN 노트북과 동일", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# CNN 모델 생성 · 학습 · 예측", "kw": "cnn 모델 Conv2D MaxPooling2D model.add Flatten Dense Dropout Activation nadam 빈칸 주석 채우기 시험", "code": "from tensorflow.keras.models import Sequential\nfrom keras.layers import Dense, Dropout, Activation, Flatten\nfrom keras.layers import MaxPooling2D, Conv2D\n\nmodel = Sequential()\nmodel.add(Conv2D(32, kernel_size=(3,3), input_shape=[28, 28, 1], padding='same'))\nmodel.add(MaxPooling2D(pool_size=(2, 2)))\nmodel.add(Conv2D(64, kernel_size=(3,3), padding='same'))\nmodel.add(MaxPooling2D(pool_size=(2, 2)))\nmodel.add(Flatten())\nmodel.add(Dense(128))\nmodel.add(Activation('relu'))\nmodel.add(Dropout(0.2))\nmodel.add(Dense(10))\nmodel.add(Activation('softmax'))\nmodel.summary()\n\nmodel.compile(loss=\"sparse_categorical_crossentropy\", optimizer=\"nadam\", metrics=[\"accuracy\"])\nhistory = model.fit(X_train, y_train, epochs=10, validation_data=(X_valid, y_valid))\nscore = model.evaluate(X_test, y_test)\nX_new = X_test[:10]\ny_pred = model.predict(X_new)\nind = np.argmax(y_pred[0])\nprint(class_names[ind])", "note": "변수 이름: 7-1 / 7-2 CNN 노트북과 동일 (7-2 노트북의 from keras.layers.core 는 에러 → keras.layers 로)", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 레이블 값이 1일때의 예측 확률 및 fprs, tprs, thresholds 구하기", "kw": "roc_curve fprs tprs thresholds pred_proba_class1 예측 확률 레이블 1 빈칸 주석 채우기 시험", "code": "from sklearn.metrics import roc_curve, roc_auc_score\n# 케라스 분류 모델: softmax 출력의 1번 열 = 레이블 1일 확률\npred_proba_class1 = model.predict(X_test)[:, 1]\n# sklearn 분류기라면: pred_proba_class1 = lr_clf.predict_proba(X_test)[:, 1]\nfprs, tprs, thresholds = roc_curve(y_test == 1, pred_proba_class1)   # 정답이 1인가(이진)", "note": "변수 이름: 작년 같은 교수님 시험 노트북과 동일 (fprs, tprs, thresholds, pred_proba_class1, scores_df, plotROC)", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# ROC curve 그리기 (plotROC 사용)", "kw": "plotROC roc 그리기 그래프 fprs tprs 빈칸 주석 채우기 시험", "code": "def plotROC(fprs, tprs):                       # 시험 노트북에 주어지는 함수\n    plt.plot(fprs, tprs, label='ROC')\n    plt.plot([0, 1], [0, 1], 'k--', label='Random')\n    plt.legend()\n    start, end = plt.xlim()\n    plt.xticks(np.round(np.arange(start, end, 0.1), 2))\n    plt.xlim(0, 1); plt.ylim(0, 1)\n    plt.xlabel('FPR( 1 - Specificity )'); plt.ylabel('TPR( Recall )')\n\nplotROC(fprs, tprs)\nplt.show()", "note": "변수 이름: 작년 같은 교수님 시험 노트북과 동일 (fprs, tprs, thresholds, pred_proba_class1, scores_df, plotROC)", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# AUC 구하기 · 좋은 순서로 나열", "kw": "auc roc_auc_score 비교 순서 정렬 나열 빈칸 주석 채우기 시험", "code": "auc = roc_auc_score(y_test == 1, pred_proba_class1)\nprint(\"AUC:\", round(auc, 4))\n# 모델 여러 개 비교: aucs = {\"모델A\": auc_a, \"모델B\": auc_b, ...}\naucs = {\"model\": auc}\nsorted(aucs.items(), key=lambda x: x[1], reverse=True)", "note": "변수 이름: 작년 같은 교수님 시험 노트북과 동일 (fprs, tprs, thresholds, pred_proba_class1, scores_df, plotROC)", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# GridSearchCV 결과 추출하여 DataFrame으로 변환", "kw": "cv_results_ scores_df grid 결과 DataFrame rank_test_score mean_test_score params 빈칸 주석 채우기 시험", "code": "# grid_dtree(또는 grid)가 fit된 GridSearchCV 객체일 때\nscores_df = pd.DataFrame(grid_dtree.cv_results_)\nscores_df[['params', 'mean_test_score', 'rank_test_score',\n           'split0_test_score', 'split1_test_score', 'split2_test_score']]\nprint(grid_dtree.best_params_, grid_dtree.best_score_)", "note": "변수 이름: 작년 같은 교수님 시험 노트북과 동일 (fprs, tprs, thresholds, pred_proba_class1, scores_df, plotROC)", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 구한 최적 parameter 조합으로 모델 생성하여 학습", "kw": "최적 파라미터 best_params_ 재학습 best_estimator_ refit 빈칸 주석 채우기 시험", "code": "best_params = grid_dtree.best_params_            # 예: {'max_depth': 3, 'min_samples_split': 2}\ndt_clf2 = DecisionTreeClassifier(random_state=11, **best_params)   # ** : 딕셔너리를 인자로 풀어 넣음\ndt_clf2.fit(X_train, y_train)\n# 또는 refit=True면 이미 최적 모델: grid_dtree.best_estimator_", "note": "변수 이름: 작년 같은 교수님 시험 노트북과 동일 (fprs, tprs, thresholds, pred_proba_class1, scores_df, plotROC) · ** 사용법은 '변수 앞의 * · **' 카드 참고", "html": "", "out": "", "extra": ""}, {"sec": "fill", "title": "# 업로드한 CSV 읽기", "kw": "csv 업로드 read_csv datafile content df 빈칸 주석 채우기 시험", "code": "datafile = '/content/Salary2024.csv'\ndf = pd.read_csv(datafile)\ndf.head(10)", "note": "변수 이름: 작년 시험·Week3 과제와 동일 (datafile, df)", "html": "", "out": "", "extra": ""}, {"sec": "change", "title": "epochs를 바꾸면", "kw": "epoch 에포크 에폭 반복 횟수 epochs 바꾸면 비교 실험 결과", "code": "# epochs=5\nmodel.fit(..., epochs=5)\n# epochs=20\nmodel.fit(..., epochs=20)", "note": "기준 모델: Fashion MNIST · 300-100 ReLU · SGD(lr 0.01) · batch 32 · 10 epoch · 기본 초기화. 한 번에 하나만 바꿔서 실행 (CPU, seed 42). 정확도는 같은 설정이라도 실행마다 ±0.5%p 정도 달라질 수 있음.", "html": "<div style=\"overflow-x:auto\"><table><tr><th>바꾼 것<\/th><th>테스트 정확도<\/th><th>훈련 정확도<\/th><th>검증 정확도<\/th><th>훈련−검증<\/th><th>마지막 loss<\/th><th>시간<\/th><\/tr><tr><td>epochs=5<\/td><td class=\"n\">0.844<\/td><td class=\"n\">0.862<\/td><td class=\"n\">0.868<\/td><td class=\"n\">-0.006<\/td><td class=\"n\">0.394<\/td><td class=\"n\">25초<\/td><\/tr><tr class=\"base\"><td>epochs=10 (기준)<\/td><td class=\"n\">0.867<\/td><td class=\"n\">0.882<\/td><td class=\"n\">0.878<\/td><td class=\"n\">+0.004<\/td><td class=\"n\">0.332<\/td><td class=\"n\">51초<\/td><\/tr><tr><td>epochs=20<\/td><td class=\"n\">0.877<\/td><td class=\"n\">0.904<\/td><td class=\"n\">0.887<\/td><td class=\"n\">+0.017<\/td><td class=\"n\">0.268<\/td><td class=\"n\">106초<\/td><\/tr><\/table><\/div><div style=\"margin-top:8px\"><ul><li>epoch를 늘리면 정확도가 오르지만 오르는 폭은 점점 줄어듦 (5→10: +2.3%p, 10→20: +1.0%p)<\/li><li>훈련−검증 차이가 −0.006 → +0.004 → +0.017로 커짐 → 오래 할수록 훈련 데이터에 맞춰지기 시작(과대적합 신호)<\/li><li>시간은 epoch에 비례 (25초 → 51초 → 106초)<\/li><li><b>답안 한 줄<\/b>: epoch를 늘리면 더 학습되어 정확도가 오르지만, 일정 이상에서는 개선이 작아지고 과대적합 위험이 커진다. 조기 종료로 적당한 지점에서 멈추는 것이 좋다.<\/li><\/ul><\/div>", "out": "", "extra": ""}, {"sec": "change", "title": "batch_size를 바꾸면", "kw": "batch 배치 batch_size 배치크기 미니배치 바꾸면 비교 실험 결과", "code": "# batch_size=128\nmodel.fit(..., batch_size=128)\n# batch_size=1024\nmodel.fit(..., batch_size=1024)", "note": "기준 모델: Fashion MNIST · 300-100 ReLU · SGD(lr 0.01) · batch 32 · 10 epoch · 기본 초기화. 한 번에 하나만 바꿔서 실행 (CPU, seed 42). 정확도는 같은 설정이라도 실행마다 ±0.5%p 정도 달라질 수 있음.", "html": "<div style=\"overflow-x:auto\"><table><tr><th>바꾼 것<\/th><th>테스트 정확도<\/th><th>훈련 정확도<\/th><th>검증 정확도<\/th><th>훈련−검증<\/th><th>마지막 loss<\/th><th>시간<\/th><\/tr><tr class=\"base\"><td>batch_size=32 (기준)<\/td><td class=\"n\">0.867<\/td><td class=\"n\">0.882<\/td><td class=\"n\">0.878<\/td><td class=\"n\">+0.004<\/td><td class=\"n\">0.332<\/td><td class=\"n\">51초<\/td><\/tr><tr><td>batch_size=128<\/td><td class=\"n\">0.840<\/td><td class=\"n\">0.852<\/td><td class=\"n\">0.860<\/td><td class=\"n\">-0.008<\/td><td class=\"n\">0.424<\/td><td class=\"n\">23초<\/td><\/tr><tr><td>batch_size=1024<\/td><td class=\"n\">0.770<\/td><td class=\"n\">0.777<\/td><td class=\"n\">0.787<\/td><td class=\"n\">-0.009<\/td><td class=\"n\">0.685<\/td><td class=\"n\">10초<\/td><\/tr><\/table><\/div><div style=\"margin-top:8px\"><ul><li>batch를 키우면 한 epoch 동안 가중치를 고치는 횟수가 줄어듦 (32 → 1,719번, 128 → 430번, 1024 → 54번)<\/li><li>그래서 같은 10 epoch에서는 덜 학습되어 정확도가 떨어짐 (0.867 → 0.840 → 0.770)<\/li><li>대신 한 번에 많이 처리해서 빠름 (51초 → 23초 → 10초)<\/li><li><b>답안 한 줄<\/b>: 배치 크기를 키우면 학습 속도는 빨라지지만 epoch당 업데이트 횟수가 줄어 같은 epoch에서는 정확도가 낮아진다. 큰 배치를 쓰려면 epoch나 학습률을 늘려야 한다.<\/li><\/ul><\/div>", "out": "", "extra": ""}, {"sec": "change", "title": "학습률을 바꾸면", "kw": "learning rate 학습률 lr 발산 nan 바꾸면 비교 실험 결과", "code": "# learning_rate=0.001\nkeras.optimizers.SGD(learning_rate=0.001)\n# learning_rate=0.1\nkeras.optimizers.SGD(learning_rate=0.1)\n# learning_rate=1.0\nkeras.optimizers.SGD(learning_rate=1.0)", "note": "기준 모델: Fashion MNIST · 300-100 ReLU · SGD(lr 0.01) · batch 32 · 10 epoch · 기본 초기화. 한 번에 하나만 바꿔서 실행 (CPU, seed 42). 정확도는 같은 설정이라도 실행마다 ±0.5%p 정도 달라질 수 있음.", "html": "<div style=\"overflow-x:auto\"><table><tr><th>바꾼 것<\/th><th>테스트 정확도<\/th><th>훈련 정확도<\/th><th>검증 정확도<\/th><th>훈련−검증<\/th><th>마지막 loss<\/th><th>시간<\/th><\/tr><tr><td>learning_rate=0.001<\/td><td class=\"n\">0.821<\/td><td class=\"n\">0.829<\/td><td class=\"n\">0.840<\/td><td class=\"n\">-0.011<\/td><td class=\"n\">0.505<\/td><td class=\"n\">53초<\/td><\/tr><tr class=\"base\"><td>learning_rate=0.01 (기준)<\/td><td class=\"n\">0.867<\/td><td class=\"n\">0.882<\/td><td class=\"n\">0.878<\/td><td class=\"n\">+0.004<\/td><td class=\"n\">0.332<\/td><td class=\"n\">51초<\/td><\/tr><tr><td>learning_rate=0.1<\/td><td class=\"n\">0.853<\/td><td class=\"n\">0.915<\/td><td class=\"n\">0.868<\/td><td class=\"n\">+0.047<\/td><td class=\"n\">0.226<\/td><td class=\"n\">49초<\/td><\/tr><tr><td>learning_rate=1.0<\/td><td class=\"n\">0.100<\/td><td class=\"n\">0.101<\/td><td class=\"n\">0.091<\/td><td class=\"n\">+0.009<\/td><td class=\"n\">nan (발산)<\/td><td class=\"n\">49초<\/td><\/tr><\/table><\/div><div style=\"margin-top:8px\"><ul><li>0.001: 너무 작아서 10 epoch 안에 덜 내려감 (loss 0.505, 정확도 0.821)<\/li><li>0.1: 훈련 정확도는 0.915로 가장 높지만 테스트는 0.853으로 기준보다 낮음 → 크게 움직이며 요동, 훈련 데이터에 과하게 맞춤<\/li><li>1.0: loss가 nan → <b>발산<\/b>. 정확도 0.10 = 10개 중 아무거나 찍는 수준<\/li><li><b>답안 한 줄<\/b>: 학습률이 너무 작으면 학습이 느리고, 너무 크면 최적점을 지나쳐 요동하거나 발산(loss=nan)한다.<\/li><\/ul><\/div>", "out": "", "extra": ""}, {"sec": "change", "title": "은닉층 크기를 바꾸면", "kw": "뉴런 수 은닉층 크기 units hidden 노드 개수 바꾸면 비교 실험 결과", "code": "# Dense(30) · Dense(10)\nDense(30, ...), Dense(10, ...)\n# Dense(1000) · Dense(500)\nDense(1000, ...), Dense(500, ...)", "note": "기준 모델: Fashion MNIST · 300-100 ReLU · SGD(lr 0.01) · batch 32 · 10 epoch · 기본 초기화. 한 번에 하나만 바꿔서 실행 (CPU, seed 42). 정확도는 같은 설정이라도 실행마다 ±0.5%p 정도 달라질 수 있음.", "html": "<div style=\"overflow-x:auto\"><table><tr><th>바꾼 것<\/th><th>테스트 정확도<\/th><th>훈련 정확도<\/th><th>검증 정확도<\/th><th>훈련−검증<\/th><th>마지막 loss<\/th><th>시간<\/th><\/tr><tr><td>Dense(30) · Dense(10)<\/td><td class=\"n\">0.844<\/td><td class=\"n\">0.860<\/td><td class=\"n\">0.857<\/td><td class=\"n\">+0.002<\/td><td class=\"n\">0.401<\/td><td class=\"n\">40초<\/td><\/tr><tr class=\"base\"><td>Dense(300) · Dense(100) (기준)<\/td><td class=\"n\">0.867<\/td><td class=\"n\">0.882<\/td><td class=\"n\">0.878<\/td><td class=\"n\">+0.004<\/td><td class=\"n\">0.332<\/td><td class=\"n\">51초<\/td><\/tr><tr><td>Dense(1000) · Dense(500)<\/td><td class=\"n\">0.866<\/td><td class=\"n\">0.886<\/td><td class=\"n\">0.882<\/td><td class=\"n\">+0.004<\/td><td class=\"n\">0.319<\/td><td class=\"n\">147초<\/td><\/tr><\/table><\/div><div style=\"margin-top:8px\"><ul><li>30·10: 파라미터 23,970개로 작아서 표현력이 부족 → 0.844<\/li><li>1000·500: 파라미터 1,290,510개(기준의 약 5배)인데 정확도는 0.866으로 거의 같고 시간은 3배 (147초)<\/li><li><b>답안 한 줄<\/b>: 뉴런이 너무 적으면 패턴을 충분히 못 배우고, 많이 늘려도 일정 이상에서는 정확도 개선 없이 계산량과 과대적합 위험만 커진다.<\/li><\/ul><\/div>", "out": "", "extra": ""}, {"sec": "change", "title": "활성화 함수를 바꾸면", "kw": "activation 활성화 sigmoid tanh relu elu selu leaky 바꾸면 비교 실험 결과", "code": "# sigmoid\nactivation=\"sigmoid\"\n# tanh\nactivation=\"tanh\"\n# elu\nactivation=\"elu\"\n# selu + lecun_normal\nactivation=\"selu\", kernel_initializer=\"lecun_normal\"\n# LeakyReLU(0.2)\

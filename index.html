 아래로 쌓음\nmodel = keras.models.Sequential([\n    keras.layers.Flatten(input_shape=[28, 28]),       # 28x28 그림 → 784개 한 줄\n    keras.layers.Dense(300, activation=\"relu\"),       # 은닉층1: 뉴런 300개, ReLU\n    keras.layers.Dense(100, activation=\"relu\"),       # 은닉층2: 뉴런 100개\n    keras.layers.Dense(10, activation=\"softmax\")      # 출력층: 10개 클래스 확률\n])\n\n# ⑤ 학습 방법 정하기: 무엇을 줄일지(loss), 어떻게 고칠지(optimizer), 무엇을 볼지(metrics)\nmodel.compile(loss=\"sparse_categorical_crossentropy\",  # 정답이 0~9 정수인 분류\n              optimizer=\"sgd\",                          # 경사 하강법\n              metrics=[\"accuracy\"])                     # 정확도 표시\n\n# ⑥ 학습: 전체 데이터를 10바퀴(epoch), 32장씩(batch) 보며 가중치 수정\nhistory = model.fit(X_train, y_train, epochs=10, batch_size=32,\n                    validation_data=(X_valid, y_valid))  # 매 epoch마다 검증 정확도 확인\n\n# ⑦ 평가: 한 번도 안 본 테스트 데이터로 최종 실력 확인 → [loss, accuracy]\nmodel.evaluate(X_test, y_test)\n\n# ⑧ 예측: 확률 10개 중 가장 큰 것의 번호가 예측 클래스\ny_proba = model.predict(X_test[:3])\ny_pred = np.argmax(y_proba, axis=-1)", "note": "수업 노트북(2. 케라스를 사용한 인공 신경망 소개)과 같은 흐름. 시험 코드도 거의 이 순서.", "html": "", "out": ""}, {"sec": "change", "title": "epochs를 바꾸면", "kw": "epoch 에포크 에폭 반복 횟수 epochs 바꾸면 비교 실험 결과", "code": "# epochs=5\nmodel.fit(..., epochs=5)\n# epochs=20\nmodel.fit(..., epochs=20)", "note": "기준 모델: Fashion MNIST · 300-100 ReLU · SGD(lr 0.01) · batch 32 · 10 epoch · 기본 초기화. 한 번에 하나만 바꿔서 실행 (CPU, seed 42). 정확도는 같은 설정이라도 실행마다 ±0.5%p 정도 달라질 수 있음.", "html": "<div style=\"overflow-x:auto\"><table><tr><th>바꾼 것<\/th><th>테스트 정확도<\/th><th>훈련 정확도<\/th><th>검증 정확도<\/th><th>훈련−검증<\/th><th>마지막 loss<\/th><th>시간<\/th><\/tr><tr><td>epochs=5<\/td><td class=\"n\">0.844<\/td><td class=\"n\">0.862<\/td><td class=\"n\">0.868<\/td><td class=\"n\">-0.006<\/td><td class=\"n\">0.394<\/td><td class=\"n\">25초<\/td><\/tr><tr class=\"base\"><td>epochs=10 (기준)<\/td><td class=\"n\">0.867<\/td><td class=\"n\">0.882<\/td><td class=\"n\">0.878<\/td><td class=\"n\">+0.004<\/td><td class=\"n\">0.332<\/td><td class=\"n\">51초<\/td><\/tr><tr><td>epochs=20<\/td><td class=\"n\">0.877<\/td><td class=\"n\">0.904<\/td><td class=\"n\">0.887<\/td><td class=\"n\">+0.017<\/td><td class=\"n\">0.268<\/td><td class=\"n\">106초<\/td><\/tr><\/table><\/div><div style=\"margin-top:8px\"><ul><li>epoch를 늘리면 정확도가 오르지만 오르는 폭은 점점 줄어듦 (5→10: +2.3%p, 10→20: +1.0%p)<\/li><li>훈련−검증 차이가 −0.006 → +0.004 → +0.017로 커짐 → 오래 할수록 훈련 데이터에 맞춰지기 시작(과대적합 신호)<\/li><li>시간은 epoch에 비례 (25초 → 51초 → 106초)<\/li><li><b>답안 한 줄<\/b>: epoch를 늘리면 더 학습되어 정확도가 오르지만, 일정 이상에서는 개선이 작아지고 과대적합 위험이 커진다. 조기 종료로 적당한 지점에서 멈추는 것이 좋다.<\/li><\/ul><\/div>", "out": "", "extra": ""}, {"sec": "change", "title": "batch_size를 바꾸면", "kw": "batch 배치 batch_size 배치크기 미니배치 바꾸면 비교 실험 결과", "code": "# batch_size=128\nmodel.fit(..., batch_size=128)\n# batch_size=1024\nmodel.fit(..., batch_size=1024)", "note": "기준 모델: Fashion MNIST · 300-100 ReLU · SGD(lr 0.01) · batch 32 · 10 epoch · 기본 초기화. 한 번에 하나만 바꿔서 실행 (CPU, seed 42). 정확도는 같은 설정이라도 실행마다 ±0.5%p 정도 달라질 수 있음.", "html": "<div style=\"overflow-x:auto\"><table><tr><th>바꾼 것<\/th><th>테스트 정확도<\/th><th>훈련 정확도<\/th><th>검증 정확도<\/th><th>훈련−검증<\/th><th>마지막 loss<\/th><th>시간<\/th><\/tr><tr class=\"base\"><td>batch_size=32 (기준)<\/td><td class=\"n\">0.867<\/td><td class=\"n\">0.882<\/td><td class=\"n\">0.878<\/td><td class=\"n\">+0.004<\/td><td class=\"n\">0.332<\/td><td class=\"n\">51초<\/td><\/tr><tr><td>batch_size=128<\/td><td class=\"n\">0.840<\/td><td class=\"n\">0.852<\/td><td class=\"n\">0.860<\/td><td class=\"n\">-0.008<\/td><td class=\"n\">0.424<\/td><td class=\"n\">23초<\/td><\/tr><tr><td>batch_size=1024<\/td><td class=\"n\">0.770<\/td><td class=\"n\">0.777<\/td><td class=\"n\">0.787<\/td><td class=\"n\">-0.009<\/td><td class=\"n\">0.685<\/td><td class=\"n\">10초<\/td><\/tr><\/table><\/div><div style=\"margin-top:8px\"><ul><li>batch를 키우면 한 epoch 동안 가중치를 고치는 횟수가 줄어듦 (32 → 1,719번, 128 → 430번, 1024 → 54번)<\/li><li>그래서 같은 10 epoch에서는 덜 학습되어 정확도가 떨어짐 (0.867 → 0.840 → 0.770)<\/li><li>대신 한 번에 많이 처리해서 빠름 (51초 → 23초 → 10초)<\/li><li><b>답안 한 줄<\/b>: 배치 크기를 키우면 학습 속도는 빨라지지만 epoch당 업데이트 횟수가 줄어 같은 epoch에서는 정확도가 낮아진다. 큰 배치를 쓰려면 epoch나 학습률을 늘려야 한다.<\/li><\/ul><\/div>", "out": "", "extra": ""}, {"sec": "change", "title": "학습률을 바꾸면", "kw": "learning rate 학습률 lr 발산 nan 바꾸면 비교 실험 결과", "code": "# learning_rate=0.001\nkeras.optimizers.SGD(learning_rate=0.001)\n# learning_rate=0.1\nkeras.optimizers.SGD(learning_rate=0.1)\n# learning_rate=1.0\nkeras.optimizers.SGD(learning_rate=1.0)", "note": "기준 모델: Fashion MNIST · 300-100 ReLU · SGD(lr 0.01) · batch 32 · 10 epoch · 기본 초기화. 한 번에 하나만 바꿔서 실행 (CPU, seed 42). 정확도는 같은 설정이라도 실행마다 ±0.5%p 정도 달라질 수 있음.", "html": "<div style=\"overflow-x:auto\"><table><tr><th>바꾼 것<\/th><th>테스트 정확도<\/th><th>훈련 정확도<\/th><th>검증 정확도<\/th><th>훈련−검증<\/th><th>마지막 loss<\/th><th>시간<\/th><\/tr><tr><td>learning_rate=0.001<\/td><td class=\"n\">0.821<\/td><td class=\"n\">0.829<\/td><td class=\"n\">0.840<\/td><td class=\"n\">-0.011<\/td><td class=\"n\">0.505<\/td><td class=\"n\">53초<\/td><\/tr><tr class=\"base\"><td>learning_rate=0.01 (기준)<\/td><td class=\"n\">0.867<\/td><td class=\"n\">0.882<\/td><td class=\"n\">0.878<\/td><td class=\"n\">+0.004<\/td><td class=\"n\">0.332<\/td><td class=\"n\">51초<\/td><\/tr><tr><td>learning_rate=0.1<\/td><td class=\"n\">0.853<\/td><td class=\"n\">0.915<\/td><td class=\"n\">0.868<\/td><td class=\"n\">+0.047<\/td><td class=\"n\">0.226<\/td><td class=\"n\">49초<\/td><\/tr><tr><td>learning_rate=1.0<\/td><td class=\"n\">0.100<\/td><td class=\"n\">0.101<\/td><td class=\"n\">0.091<\/td><td class=\"n\">+0.009<\/td><td class=\"n\">nan (발산)<\/td><td class=\"n\">49초<\/td><\/tr><\/table><\/div><div style=\"margin-top:8px\"><ul><li>0.001: 너무 작아서 10 epoch 안에 덜 내려감 (loss 0.505, 정확도 0.821)<\/li><li>0.1: 훈련 정확도는 0.915로 가장 높지만 테스트는 0.853으로 기준보다 낮음 → 크게 움직이며 요동, 훈련 데이터에 과하게 맞춤<\/li><li>1.0: loss가 nan → <b>발산<\/b>. 정확도 0.10 = 10개 중 아무거나 찍는 수준<\/li><li><b>답안 한 줄<\/b>: 학습률이 너무 작으면 학습이 느리고, 너무 크면 최적점을 지나쳐 요동하거나 발산(loss=nan)한다.<\/li><\/ul><\/div>", "out": "", "extra": ""}, {"sec": "change", "title": "은닉층 크기를 바꾸면", "kw": "뉴런 수 은닉층 크기 units hidden 노드 개수 바꾸면 비교 실험 결과", "code": "# Dense(30) · Dense(10)\nDense(30, ...), Dense(10, ...)\n# Dense(1000) · Dense(500)\nDense(1000, ...), Dense(500, ...)", "note": "기준 모델: Fashion MNIST · 300-100 ReLU · SGD(lr 0.01) · batch 32 · 10 epoch · 기본 초기화. 한 번에 하나만 바꿔서 실행 (CPU, seed 42). 정확도는 같은 설정이라도 실행마다 ±0.5%p 정도 달라질 수 있음.", "html": "<div style=\"overflow-x:auto\"><table><tr><th>바꾼 것<\/th><th>테스트 정확도<\/th><th>훈련 정확도<\/th><th>검증 정확도<\/th><th>훈련−검증<\/th><th>마지막 loss<\/th><th>시간<\/th><\/tr><tr><td>Dense(30) · Dense(10)<\/td><td class=\"n\">0.844<\/td><td class=\"n\">0.860<\/td><td class=\"n\">0.857<\/td><td class=\"n\">+0.002<\/td><td class=\"n\">0.401<\/td><td class=\"n\">40초<\/td><\/tr><tr class=\"base\"><td>Dense(300) · Dense(100) (기준)<\/td><td class=\"n\">0.867<\/td><td class=\"n\">0.882<\/td><td class=\"n\">0.878<\/td><td class=\"n\">+0.004<\/td><td class=\"n\">0.332<\/td><td class=\"n\">51초<\/td><\/tr><tr><td>Dense(1000) · Dense(500)<\/td><td class=\"n\">0.866<\/td><td class=\"n\">0.886<\/td><td class=\"n\">0.882<\/td><td class=\"n\">+0.004<\/td><td class=\"n\">0.319<\/td><td class=\"n\">147초<\/td><\/tr><\/table><\/div><div style=\"margin-top:8px\"><ul><li>30·10: 파라미터 23,970개로 작아서 표현력이 부족 → 0.844<\/li><li>1000·500: 파라미터 1,290,510개(기준의 약 5배)인데 정확도는 0.866으로 거의 같고 시간은 3배 (147초)<\/li><li><b>답안 한 줄<\/b>: 뉴런이 너무 적으면 패턴을 충분히 못 배우고, 많이 늘려도 일정 이상에서는 정확도 개선 없이 계산량과 과대적합 위험만 커진다.<\/li><\/ul><\/div>", "out": "", "extra": ""}, {"sec": "change", "title": "활성화 함수를 바꾸면", "kw": "activation 활성화 sigmoid tanh relu elu selu leaky 바꾸면 비교 실험 결과", "code": "# sigmoid\nactivation=\"sigmoid\"\n# tanh\nactivation=\"tanh\"\n# elu\nactivation=\"elu\"\n# selu + lecun_normal\nactivation=\"selu\", kernel_initializer=\"lecun_normal\"\n# LeakyReLU(0.2)\nDense(300), keras.layers.LeakyReLU(0.2)\n# sigmoid + Adam\nactivation=\"sigmoid\"  +  optimizer=\"adam\"", "note": "기준 모델: Fashion MNIST · 300-100 ReLU · SGD(lr 0.01) · batch 32 · 10 epoch · 기본 초기화. 한 번에 하나만 바꿔서 실행 (CPU, seed 42). 정확도는 같은 설정이라도 실행마다 ±0.5%p 정도 달라질 수 있음.", "html": "<div style=\"overflow-x:auto\"><table><tr><th>바꾼 것<\/th><th>테스트 정확도<\/th><th>훈련 정확도<\/th><th>검증 정확도<\/th><th>훈련−검증<\/th><th>마지막 loss<\/th><th>시간<\/th><\/tr><tr class=\"base\"><td>relu (기준)<\/td><td class=\"n\">0.867<\/td><td class=\"n\">0.882<\/td><td class=\"n\">0.878<\/td><td class=\"n\">+0.004<\/td><td class=\"n\">0.332<\/td><td class=\"n\">51초<\/td><\/tr><tr><td>sigmoid<\/td><td class=\"n\">0.792<\/td><td class=\"n\">0.798<\/td><td class=\"n\">0.812<\/td><td class=\"n\">-0.014<\/td><td class=\"n\">0.563<\/td><td class=\"n\">52초<\/td><\/tr><tr><td>tanh<\/td><td class=\"n\">0.859<\/td><td class=\"n\">0.875<\/td><td class=\"n\">0.873<\/td><td class=\"n\">+0.001<\/td><td class=\"n\">0.347<\/td><td class=\"n\">53초<\/td><\/tr><tr><td>elu<\/td><td class=\"n\">0.857<\/td><td class=\"n\">0.871<\/td><td class=\"n\">0.869<\/td><td class=\"n\">+0.002<\/td><td class=\"n\">0.359<\/td><td class=\"n\">49초<\/td><\/tr><tr><td>selu + lecun_normal<\/td><td class=\"n\">0.860<\/td><td class=\"n\">0.877<\/td><td class=\"n\">0.869<\/td><td class=\"n\">+0.008<\/td><td class=\"n\">0.339<\/td><td class=\"n\">51초<\/td><\/tr><tr><td>LeakyReLU(0.2)<\/td><td class=\"n\">0.860<\/td><td class=\"n\">0.876<\/td><td class=\"n\">0.874<\/td><td class=\"n\">+0.001<\/td><td class=\"n\">0.351<\/td><td class=\"n\">49초<\/td><\/tr><tr><td>sigmoid + Adam<\/td><td class=\"n\">0.877<\/td><td class=\"n\">0.917<\/td><td class=\"n\">0.890<\/td><td class=\"n\">+0.027<\/td><td class=\"n\">0.227<\/td><td class=\"n\">82초<\/td><\/tr><\/table><\/div><div style=\"margin-top:8px\"><ul><li>sigmoid가 0.792로 가장 낮음 → 도함수 최대 0.25라 기울기가 작아 SGD로는 학습이 느림 (기울기 소실)<\/li><li>tanh·ELU·SELU·LeakyReLU는 0.857~0.860, ReLU 0.867로 비슷<\/li><li><b>sigmoid + Adam = 0.877<\/b>: 같은 sigmoid라도 Adam이 걸음 크기를 자동으로 키워 주면 따라잡음 → sigmoid의 문제는 \"느리게 배운다\"는 것<\/li><li><b>답안 한 줄<\/b>: sigmoid는 기울기가 작아 깊어질수록 학습이 느려지고(기울기 소실), ReLU 계열은 양수에서 기울기가 1이라 빠르게 학습된다.<\/li><\/ul><\/div>", "out": "", "extra": ""}, {"sec": "change", "title": "초기화를 바꾸면", "kw": "initializer 초기화 he glorot random 정규분포 바꾸면 비교 실험 결과", "code": "# he_normal\nkernel_initializer=\"he_normal\"\n# RandomNormal(stddev=1.0)\nkernel_initializer=keras.initializers.RandomNormal(stddev=1.0)", "note": "기준 모델: Fashion MNIST · 300-100 ReLU · SGD(lr 0.01) · batch 32 · 10 epoch · 기본 초기화. 한 번에 하나만 바꿔서 실행 (CPU, seed 42). 정확도는 같은 설정이라도 실행마다 ±0.5%p 정도 달라질 수 있음.", "html": "<div style=\"overflow-x:auto\"><table><tr><th>바꾼 것<\/th><th>테스트 정확도<\/th><th>훈련 정확도<\/th><th>검증 정확도<\/th><th>훈련−검증<\/th><th>마지막 loss<\/th><th>시간<\/th><\/tr><tr class=\"base\"><td>glorot_uniform (기본값, 기준)<\/td><td class=\"n\">0.867<\/td><td class=\"n\">0.882<\/td><td class=\"n\">0.878<\/td><td class=\"n\">+0.004<\/td><td class=\"n\">0.332<\/td><td class=\"n\">51초<\/td><\/tr><tr><td>he_normal<\/td><td class=\"n\">0.863<\/td><td class=\"n\">0.881<\/td><td class=\"n\">0.879<\/td><td class=\"n\">+0.002<\/td><td class=\"n\">0.331<\/td><td class=\"n\">51초<\/td><\/tr><tr><td>RandomNormal(stddev=1.0)<\/td><td class=\"n\">0.721<\/td><td class=\"n\">0.732<\/td><td class=\"n\">0.743<\/td><td class=\"n\">-0.011<\/td><td class=\"n\">0.797<\/td><td class=\"n\">62초<\/td><\/tr><\/table><\/div><div style=\"margin-top:8px\"><ul><li>He(0.863)와 기본 Glorot(0.867)는 거의 같음 → 층이 2개뿐인 얕은 모델이라 초기화 차이가 작음 (깊은 모델일수록 차이가 커짐)<\/li><li>표준편차 1.0으로 크게 초기화하면 0.721로 크게 떨어짐 → 시작부터 층 출력이 너무 커져 학습이 불안정<\/li><li><b>답안 한 줄<\/b>: 초기 가중치가 너무 크거나 작으면 층을 지나며 신호가 커지거나 사라져 학습이 어렵다. He·Glorot 초기화는 층마다 분산을 유지해 이를 막는다.<\/li><\/ul><\/div>", "out": "", "extra": ""}, {"sec": "change", "title": "배치 정규화를 넣으면", "kw": "batch normalization 배치정규화 BN 바꾸면 비교 실험 결과", "code": "# 각 Dense 뒤에 BatchNormalization()\nkeras.layers.BatchNormalization()", "note": "기준 모델: Fashion MNIST · 300-100 ReLU · SGD(lr 0.01) · batch 32 · 10 epoch · 기본 초기화. 한 번에 하나만 바꿔서 실행 (CPU, seed 42). 정확도는 같은 설정이라도 실행마다 ±0.5%p 정도 달라질 수 있음.", "html": "<div style=\"overflow-x:auto\"><table><tr><th>바꾼 것<\/th><th>테스트 정확도<\/th><th>훈련 정확도<\/th><th>검증 정확도<\/th><th>훈련−검증<\/th><th>마지막 loss<\/th><th>시간<\/th><\/tr><tr class=\"base\"><td>없음 (기준)<\/td><td class=\"n\">0.867<\/td><td class=\"n\">0.882<\/td><td class=\"n\">0.878<\/td><td class=\"n\">+0.004<\/td><td class=\"n\">0.332<\/td><td class=\"n\">51초<\/td><\/tr><tr><td>각 Dense 뒤에 BatchNormalization()<\/td><td class=\"n\">0.875<\/td><td class=\"n\">0.929<\/td><td class=\"n\">0.882<\/td><td class=\"n\">+0.046<\/td><td class=\"n\">0.202<\/td><td class=\"n\">59초<\/td><\/tr><\/table><\/div><div style=\"margin-top:8px\"><ul><li>정확도 0.867 → 0.875, loss 0.332 → 0.202: 같은 10 epoch에 훨씬 많이 학습됨<\/li><li>훈련 정확도 0.929로 빠르게 올라 훈련−검증 차이도 커짐 (+0.046)<\/li><li>파라미터 +1,600개(BN 층의 γ·β·이동평균·이동분산), 시간 약간 증가 (51 → 59초)<\/li><li><b>답안 한 줄<\/b>: 배치 정규화는 층마다 출력의 분포를 맞춰 학습을 빠르고 안정적으로 만든다.<\/li><\/ul><\/div>", "out": "", "extra": ""}, {"sec": "change", "title": "드롭아웃 · L2 규제를 넣으면", "kw": "dropout 드롭아웃 l2 규제 과대적합 바꾸면 비교 실험 결과", "code": "# Dropout(0.2)\nkeras.layers.Dropout(0.2)\n# Dropout(0.5)\nkeras.layers.Dropout(0.5)\n# L2(0.01)\nkernel_regularizer=keras.regularizers.l2(0.01)", "note": "기준 모델: Fashion MNIST · 300-100 ReLU · SGD(lr 0.01) · batch 32 · 10 epoch · 기본 초기화. 한 번에 하나만 바꿔서 실행 (CPU, seed 42). 정확도는 같은 설정이라도 실행마다 ±0.5%p 정도 달라질 수 있음.", "html": "<div style=\"overflow-x:auto\"><table><tr><th>바꾼 것<\/th><th>테스트 정확도<\/th><th>훈련 정확도<\/th><th>검증 정확도<\/th><th>훈련−검증<\/th><th>마지막 loss<\/th><th>시간<\/th><\/tr><tr class=\"base\"><td>없음 (기준)<\/td><td class=\"n\">0.867<\/td><td class=\"n\">0.882<\/td><td class=\"n\">0.878<\/td><td class=\"n\">+0.004<\/td><td class=\"n\">0.332<\/td><td class=\"n\">51초<\/td><\/tr><tr><td>Dropout(0.2)<\/td><td class=\"n\">0.867<\/td><td class=\"n\">0.865<\/td><td class=\"n\">0.878<\/td><td class=\"n\">-0.013<\/td><td class=\"n\">0.372<\/td><td class=\"n\">67초<\/td><\/tr><tr><td>Dropout(0.5)<\/td><td class=\"n\">0.854<\/td><td class=\"n\">0.840<\/td><td class=\"n\">0.869<\/td><td class=\"n\">-0.028<\/td><td class=\"n\">0.456<\/td><td class=\"n\">59초<\/td><\/tr><tr><td>L2(0.01)<\/td><td class=\"n\">0.824<\/td><td class=\"n\">0.844<\/td><td class=\"n\">0.844<\/td><td class=\"n\">-0.000<\/td><td class=\"n\">0.616<\/td><td class=\"n\">60초<\/td><\/tr><\/table><\/div><div style=\"margin-top:8px\"><ul><li>Dropout 0.2: 테스트 0.867로 기준과 같음. <b>훈련 정확도(0.865)가 검증(0.878)보다 낮음<\/b> → 드롭아웃은 학습 중에만 뉴런을 꺼서, 훈련 정확도는 일부가 꺼진 상태로 계산되기 때문<\/li><li>Dropout 0.5: 절반을 꺼서 10 epoch로는 덜 학습 (0.854)<\/li><li>L2(0.01): 0.824. loss가 높은 건 벌점이 더해져서<\/li><li>이 모델은 원래 훈련−검증 차이가 0.004로 과대적합이 거의 없어서, 규제가 정확도를 올리지 못함. 규제는 과대적합이 생길 때(오래 학습, 큰 모델) 효과가 있음<\/li><li><b>답안 한 줄<\/b>: 드롭아웃과 L2는 과대적합을 줄이는 규제로, 과대적합이 없는 상황에서 너무 강하게 쓰면 오히려 덜 학습된다.<\/li><\/ul><\/div>", "out": "", "extra": ""}, {"sec": "change", "title": "옵티마이저를 바꾸면", "kw": "optimizer 옵티마이저 sgd momentum nag adam rmsprop adagrad nadam 바꾸면 비교 실험 결과", "code": "# SGD + momentum 0.9\nSGD(learning_rate=0.01, momentum=0.9)\n# NAG\nSGD(learning_rate=0.01, momentum=0.9, nesterov=True)\n# Adagrad lr 0.01\nAdagrad(learning_rate=0.01)\n# RMSprop lr 0.001\nRMSprop(learning_rate=0.001)\n# Adam lr 0.001\nAdam(learning_rate=0.001)\n# Nadam lr 0.001\nNadam(learning_rate=0.001)", "note": "기준 모델: Fashion MNIST · 300-100 ReLU · SGD(lr 0.01) · batch 32 · 10 epoch · 기본 초기화. 한 번에 하나만 바꿔서 실행 (CPU, seed 42). 정확도는 같은 설정이라도 실행마다 ±0.5%p 정도 달라질 수 있음.", "html": "<div style=\"overflow-x:auto\"><table><tr><th>바꾼 것<\/th><th>테스트 정확도<\/th><th>훈련 정확도<\/th><th>검증 정확도<\/th><th>훈련−검증<\/th><th>마지막 loss<\/th><th>시간<\/th><\/tr><tr class=\"base\"><td>SGD lr 0.01 (기준)<\/td><td class=\"n\">0.867<\/td><td class=\"n\">0.882<\/td><td class=\"n\">0.878<\/td><td class=\"n\">+0.004<\/td><td class=\"n\">0.332<\/td><td class=\"n\">51초<\/td><\/tr><tr><td>SGD + momentum 0.9<\/td><td class=\"n\">0.881<\/td><td class=\"n\">0.913<\/td><td class=\"n\">0.893<\/td><td class=\"n\">+0.020<\/td><td class=\"n\">0.232<\/td><td class=\"n\">60초<\/td><\/tr><tr><td>NAG<\/td><td class=\"n\">0.876<\/td><td class=\"n\">0.915<\/td><td class=\"n\">0.885<\/td><td class=\"n\">+0.030<\/td><td class=\"n\">0.228<\/td><td class=\"n\">73초<\/td><\/tr><tr><td>Adagrad lr 0.01<\/td><td class=\"n\">0.874<\/td><td class=\"n\">0.895<\/td><td class=\"n\">0.888<\/td><td class=\"n\">+0.008<\/td><td class=\"n\">0.289<\/td><td class=\"n\">66초<\/td><\/tr><tr><td>RMSprop lr 0.001<\/td><td class=\"n\">0.855<\/td><td class=\"n\">0.899<\/td><td class=\"n\">0.865<\/td><td class=\"n\">+0.035<\/td><td class=\"n\">0.293<\/td><td class=\"n\">76초<\/td><\/tr><tr><td>Adam lr 0.001<\/td><td class=\"n\">0.875<\/td><td class=\"n\">0.917<\/td><td class=\"n\">0.890<\/td><td class=\"n\">+0.027<\/td><td class=\"n\">0.218<\/td><td class=\"n\">78초<\/td><\/tr><tr><td>Nadam lr 0.001<\/td><td class=\"n\">0.872<\/td><td class=\"n\">0.919<\/td><td class=\"n\">0.889<\/td><td class=\"n\">+0.030<\/td><td class=\"n\">0.212<\/td><td class=\"n\">82초<\/td><\/tr><\/table><\/div><div style=\"margin-top:8px\"><ul><li>관성·적응형 옵티마이저는 같은 10 epoch에 loss를 더 많이 줄임 (SGD 0.332 → Momentum 0.232, NAG 0.228, Adam 0.218, Nadam 0.212)<\/li><li>테스트 정확도: Momentum 0.881 · NAG 0.876 · Adam 0.875 · Adagrad 0.874 · Nadam 0.872 · SGD 0.867 · RMSprop 0.855<\/li><li>RMSprop은 훈련 0.899인데 검증 0.865 → 요동하며 훈련 데이터에 더 맞춤<\/li><li>Adagrad의 \"너무 일찍 멈춤\"은 오래 학습할 때 나타나는 단점이라 10 epoch에서는 안 보임<\/li><li><b>답안 한 줄<\/b>: 모멘텀·Adam 같은 옵티마이저는 SGD보다 빠르게 수렴해 같은 epoch에서 손실이 더 낮다.<\/li><\/ul><\/div>", "out": "", "extra": ""}, {"sec": "change", "title": "255로 나누지 않으면", "kw": "정규화 normalize 255 스케일 전처리 나누기 바꾸면 비교 실험 결과", "code": "# 나누지 않음 (0~255 그대로)\nX_train = X_train_full[5000:]  # /255 없음", "note": "기준 모델: Fashion MNIST · 300-100 ReLU · SGD(lr 0.01) · batch 32 · 10 epoch · 기본 초기화. 한 번에 하나만 바꿔서 실행 (CPU, seed 42). 정확도는 같은 설정이라도 실행마다 ±0.5%p 정도 달라질 수 있음.", "html": "<div style=\"overflow-x:auto\"><table><tr><th>바꾼 것<\/th><th>테스트 정확도<\/th><th>훈련 정확도<\/th><th>검증 정확도<\/th><th>훈련−검증<\/th><th>마지막 loss<\/th><th>시간<\/th><\/tr><tr class=\"base\"><td>/ 255. (기준)<\/td><td class=\"n\">0.867<\/td><td class=\"n\">0.882<\/td><td class=\"n\">0.878<\/td><td class=\"n\">+0.004<\/td><td class=\"n\">0.332<\/td><td class=\"n\">51초<\/td><\/tr><tr><td>나누지 않음 (0~255 그대로)<\/td><td class=\"n\">0.100<\/td><td class=\"n\">0.101<\/td><td class=\"n\">0.091<\/td><td class=\"n\">+0.009<\/td><td class=\"n\">nan (발산)<\/td><td class=\"n\">51초<\/td><\/tr><\/table><\/div><div style=\"margin-top:8px\"><ul><li>255로 나누지 않으면 입력이 0~255로 커서 가중치 합이 지나치게 커짐 → loss가 nan으로 <b>발산<\/b>, 정확도 0.10<\/li><li><b>답안 한 줄<\/b>: 입력 스케일이 크면 학습이 불안정해져 발산할 수 있으므로 0~1로 정규화한다.<\/li><\/ul><\/div>", "out": "", "extra": ""}, {"sec": "change", "title": "CNN: MLP 대신 CNN을 쓰면", "kw": "cnn mlp fcn 비교 완전연결 합성곱 바꾸면 비교 실험 결과 cnn", "code": "# MLP (Flatten → Dense 200 → 100)\nkeras.layers.Flatten(), Dense(200), Dense(100), Dense(10)", "note": "기준 CNN: 교수님 7-1 노트북 구조 — Conv2D(32,3×3,same) → MaxPool → Conv2D(64,3×3,same) → MaxPool → Flatten → Dense(128, relu) → Dropout(0.2) → Dense(10). Fashion MNIST 표준화, Nadam, 5 epoch, CPU, seed 42.", "html": "<div style=\"overflow-x:auto\"><table><tr><th>바꾼 것<\/th><th>테스트 정확도<\/th><th>훈련 정확도<\/th><th>검증 정확도<\/th><th>파라미터<\/th><th>시간<\/th><\/tr><tr><td>MLP (Flatten → Dense 200 → 100)<\/td><td class=\"n\">0.865<\/td><td class=\"n\">0.914<\/td><td class=\"n\">0.870<\/td><td class=\"n\">178,110<\/td><td class=\"n\">43초<\/td><\/tr><tr class=\"base\"><td>CNN (교수님 구조, 기준)<\/td><td class=\"n\">0.900<\/td><td class=\"n\">0.943<\/td><td class=\"n\">0.908<\/td><td class=\"n\">421,642<\/td><td class=\"n\">137초<\/td><\/tr><\/table><\/div><div style=\"margin-top:8px\"><ul><li>CNN 0.900 vs MLP 0.865: 같은 5 epoch에서 CNN이 3.5%p 높음<\/li><li>MLP는 그림을 784개 한 줄로 펴서 주변 픽셀 관계(위치 정보)를 잃고, CNN은 그림 모양 그대로 필터로 훑어 선·모서리 같은 공간 패턴을 잡음<\/li><li>대신 CNN은 계산이 많아 느림 (43초 → 137초)<\/li><li><b>답안 한 줄<\/b>: CNN은 이미지의 공간 구조를 유지한 채 지역 특징을 추출하므로 이미지 분류에서 MLP보다 정확도가 높다.<\/li><\/ul><\/div>", "out": "", "extra": ""}, {"sec": "change", "title": "CNN: 합성곱 층에 ReLU를 넣으면", "kw": "cnn activation relu 활성화 conv2d 바꾸면 비교 실험 결과 cnn", "code": "# Conv2D(..., activation=\"relu\")\nkeras.layers.Conv2D(32, kernel_size=(3, 3), padding=\"same\", activation=\"relu\")", "note": "기준 CNN: 교수님 7-1 노트북 구조 — Conv2D(32,3×3,same) → MaxPool → Conv2D(64,3×3,same) → MaxPool → Flatten → Dense(128, relu) → Dropout(0.2) → Dense(10). Fashion MNIST 표준화, Nadam, 5 epoch, CPU, seed 42.", "html": "<div style=\"overflow-x:auto\"><table><tr><th>바꾼 것<\/th><th>테스트 정확도<\/th><th>훈련 정확도<\/th><th>검증 정확도<\/th><th>파라미터<\/th><th>시간<\/th><\/tr><tr class=\"base\"><td>Conv2D 활성화 없음 (교수님 코드 그대로, 기준)<\/td><td class=\"n\">0.900<\/td><td class=\"n\">0.943<\/td><td class=\"n\">0.908<\/td><td class=\"n\">421,642<\/td><td class=\"n\">137초<\/td><\/tr><tr><td>Conv2D(..., activation=\"relu\")<\/td><td class=\"n\">0.911<\/td><td class=\"n\">0.940<\/td><td class=\"n\">0.915<\/td><td class=\"n\">421,642<\/td><td class=\"n\">177초<\/td><\/tr><\/table><\/div><div style=\"margin-top:8px\"><ul><li>교수님 코드는 Conv2D에 activation이 없음(선형). ReLU를 넣으면 0.900 → 0.911<\/li><li>활성화가 없으면 합성곱 층은 곱하고 더하기만 하는 선형 계산이라, 층을 쌓아도 복잡한 패턴 표현이 제한됨 (MaxPooling이 약간의 비선형성은 줌)<\/li><li><b>답안 한 줄<\/b>: 합성곱 층 뒤에 ReLU 같은 비선형 활성화를 넣어야 층을 쌓는 효과가 커진다.<\/li><\/ul><\/div>", "out": "", "extra": ""}, {"sec": "change", "title": "CNN: 필터 수 · 커널 크기를 바꾸면", "kw": "filters 필터 개수 kernel_size 커널 크기 conv2d 바꾸면 비교 실험 결과 cnn", "code": "# 필터 8 · 16\nConv2D(8, ...), Conv2D(16, ...)\n# 필터 64 · 128\nConv2D(64, ...), Conv2D(128, ...)\n# kernel_size=5\nConv2D(32, kernel_size=(5, 5), ...)", "note": "기준 CNN: 교수님 7-1 노트북 구조 — Conv2D(32,3×3,same) → MaxPool → Conv2D(64,3×3,same) → MaxPool → Flatten → Dense(128, relu) → Dropout(0.2) → Dense(10). Fashion MNIST 표준화, Nadam, 5 epoch, CPU, seed 42.", "html": "<div style=\"overflow-x:auto\"><table><tr><th>바꾼 것<\/th><th>테스트 정확도<\/th><th>훈련 정확도<\/th><th>검증 정확도<\/th><th>파라미터<\/th><th>시간<\/th><\/tr><tr><td>필터 8 · 16<\/td><td class=\"n\">0.901<\/td><td class=\"n\">0.921<\/td><td class=\"n\">0.907<\/td><td class=\"n\">103,018<\/td><td class=\"n\">72초<\/td><\/tr><tr class=\"base\"><td>필터 32 · 64 (기준)<\/td><td class=\"n\">0.900<\/td><td class=\"n\">0.943<\/td><td class=\"n\">0.908<\/td><td class=\"n\">421,642<\/td><td class=\"n\">137초<\/td><\/tr><tr><td>필터 64 · 128<\/td><td class=\"n\">0.901<\/td><td class=\"n\">0.942<\/td><td class=\"n\">0.907<\/td><td class=\"n\">878,730<\/td><td class=\"n\">314초<\/td><\/tr><tr><td>kernel_size=5<\/td><td class=\"n\">0.901<\/td><td class=\"n\">0.935<\/td><td class=\"n\">0.904<\/td><td class=\"n\">454,922<\/td><td class=\"n\">156초<\/td><\/tr><\/table><\/div><div style=\"margin-top:8px\"><ul><li>필터 8·16 / 32·64 / 64·128 모두 약 0.90 → 이 데이터에서는 필터 수가 정확도에 큰 영향이 없음<\/li><li>필터를 줄이면 파라미터 103,018개·72초, 늘리면 878,730개·314초 → <b>계산량과 시간만 크게 달라짐<\/b><\/li><li>커널 3×3 → 5×5도 0.901로 거의 같음<\/li><li><b>답안 한 줄<\/b>: 필터 수를 늘리면 더 많은 특징을 뽑을 수 있지만 파라미터와 계산량이 늘어나며, 데이터가 단순하면 정확도 향상은 작다.<\/li><\/ul><\/div>", "out": "", "extra": ""}, {"sec": "change", "title": "CNN: 풀링을 빼거나 스트라이드로 바꾸면", "kw": "pooling 풀링 제거 stride 스트라이드 maxpooling 바꾸면 비교 실험 결과 cnn", "code": "# 풀링 없음\n# MaxPooling2D 줄 삭제\n# 풀링 대신 Conv2D(strides=2)\nConv2D(32, kernel_size=(3, 3), strides=2, padding=\"same\")", "note": "기준 CNN: 교수님 7-1 노트북 구조 — Conv2D(32,3×3,same) → MaxPool → Conv2D(64,3×3,same) → MaxPool → Flatten → Dense(128, relu) → Dropout(0.2) → Dense(10). Fashion MNIST 표준화, Nadam, 5 epoch, CPU, seed 42.", "html": "<div style=\"overflow-x:auto\"><table><tr><th>바꾼 것<\/th><th>테스트 정확도<\/th><th>훈련 정확도<\/th><th>검증 정확도<\/th><th>파라미터<\/th><th>시간<\/th><\/tr><tr class=\"base\"><td>MaxPooling2D(2) (기준)<\/td><td class=\"n\">0.900<\/td><td class=\"n\">0.943<\/td><td class=\"n\">0.908<\/td><td class=\"n\">421,642<\/td><td class=\"n\">137초<\/td><\/tr><tr><td>풀링 없음<\/td><td class=\"n\">0.852<\/td><td class=\"n\">0.912<\/td><td class=\"n\">0.858<\/td><td class=\"n\">6,442,762<\/td><td class=\"n\">688초<\/td><\/tr><tr><td>풀링 대신 Conv2D(strides=2)<\/td><td class=\"n\">0.871<\/td><td class=\"n\">0.906<\/td><td class=\"n\">0.877<\/td><td class=\"n\">421,642<\/td><td class=\"n\">80초<\/td><\/tr><\/table><\/div><div style=\"margin-top:8px\"><ul><li>풀링을 빼면 특성맵이 28×28로 그대로 남아 Flatten 뒤 Dense 입력이 50,176개 → 파라미터 <b>6,442,762개(15배)<\/b>, 시간 688초(5배), 정확도는 0.852로 오히려 하락 (훈련 0.912 / 검증 0.858)<\/li><li>풀링 대신 strides=2: 크기는 똑같이 줄지만 0.871로 MaxPooling(0.900)보다 낮음<\/li><li><b>답안 한 줄<\/b>: 풀링은 특성맵 크기를 줄여 파라미터·계산량을 크게 줄이고, 작은 위치 변화에 둔감하게 만들어 일반화에 도움을 준다.<\/li><\/ul><\/div>", "out": "", "extra": ""}, {"sec": "change", "title": "CNN: 패딩을 VALID로 바꾸면", "kw": "padding 패딩 valid same 바꾸면 비교 실험 결과 cnn", "code": "# padding=\"valid\"\nConv2D(32, kernel_size=(3, 3), padding=\"valid\")", "note": "기준 CNN: 교수님 7-1 노트북 구조 — Conv2D(32,3×3,same) → MaxPool → Conv2D(64,3×3,same) → MaxPool → Flatten → Dense(128, relu) → Dropout(0.2) → Dense(10). Fashion MNIST 표준화, Nadam, 5 epoch, CPU, seed 42.", "html": "<div style=\"overflow-x:auto\"><table><tr><th>바꾼 것<\/th><th>테스트 정확도<\/th><th>훈련 정확도<\/th><th>검증 정확도<\/th><th>파라미터<\/th><th>시간<\/th><\/tr><tr class=\"base\"><td>padding=\"same\" (기준)<\/td><td class=\"n\">0.900<\/td><td class=\"n\">0.943<\/td><td class=\"n\">0.908<\/td><td class=\"n\">421,642<\/td><td class=\"n\">137초<\/td><\/tr><tr><td>padding=\"valid\"<\/td><td class=\"n\">0.894<\/td><td class=\"n\">0.930<\/td><td class=\"n\">0.903<\/td><td class=\"n\">225,034<\/td><td class=\"n\">97초<\/td><\/tr><\/table><\/div><div style=\"margin-top:8px\"><ul><li>VALID는 가장자리를 채우지 않아 층마다 크기가 줄어듦: 28 → 26 → 풀링 13 → 11 → 풀링 5<\/li><li>마지막 특성맵 5×5×64 = 1,600 (SAME은 7×7×64 = 3,136) → 파라미터 225,034개로 절반, 정확도 0.894로 약간 낮음<\/li><li><b>답안 한 줄<\/b>: VALID 패딩은 출력 크기가 줄어 계산량은 적지만 가장자리 정보가 줄어들고, SAME은 크기를 유지한다.<\/li><\/ul><\/div>", "out": "", "extra": ""}, {"sec": "mock", "title": "모의 중간고사 (작년 같은 교수님 형식)", "kw": "모의고사 모의시험 중간고사 문제 답안 다운로드 colab", "code": "", "note": "", "out": "", "extra": "", "html": "<p>작년 같은 교수님 시험(받은 Colab 노트북 작성 → .ipynb 제출) 형식으로 만든 1~7장 연습 문제 7개. 이론 서술(<code>&lt;pre&gt;<\/code> 칸) + Pandas + 단계형 실습.<\/p><p><a href=\"nb_src/%EB%AA%A8%EC%9D%98%EC%A4%91%EA%B0%84%EA%B3%A0%EC%82%AC_%EB%AC%B8%EC%A0%9C.ipynb\" download><b>문제 노트북(.ipynb) 받기<\/b><\/a> → Colab에서 파일 → 노트 업로드 · <a href=\"nb/mock_q.html\" target=\"_blank\" rel=\"noopener\">문제 미리보기<\/a> · <a href=\"nb/mock.html\" target=\"_blank\" rel=\"noopener\">답안 노트북(실행 결과 포함)<\/a><\/p>"}, {"sec": "mock", "title": "모의 1. 심층 신경망에서 그레이디언트 소실(Vanishing Gradient)이 무엇인지, 왜 생기는지, 해결 방법 3가지를 설명하시오.", "kw": "모의고사 모의시험 중간고사 답안 정답 문제 1. 심층 신경망에서 그레이디언트 소실(Vanishing Gradient)이 무엇인지, 왜 생기는지, 해결 방법 3가지를 설명하시오.", "code": "", "note": "", "html": "<div><b>답안<\/b><pre style=\"white-space:pre-wrap\">그레이디언트 소실: 역전파로 출력층에서 입력층 쪽으로 기울기를 전달할 때,\n아래층으로 갈수록 기울기가 0에 가까워져 앞쪽 층의 가중치가 거의 갱신되지 않는 현상.\n\n원인: sigmoid의 도함수는 최대 0.25이고 입력이 크거나 작으면 0에 가까워진다(포화).\n체인 룰로 층마다 이 값이 곱해지므로 층이 깊을수록 기울기가 기하급수적으로 작아진다.\n또 층을 지날수록 출력의 평균·분산이 입력과 달라지는 것도 원인이다.\n\n해결 방법\n1) 초기화: 층의 입력·출력 분산이 비슷하도록 가중치를 초기화 (ReLU에는 He, sigmoid·tanh에는 Glorot)\n2) 활성화 함수: 양수에서 포화되지 않는 ReLU 계열 사용 (죽은 ReLU는 LeakyReLU·ELU로 완화)\n3) 배치 정규화: 층마다 미니배치 단위로 평균 0, 분산 1로 맞춘 뒤 γ, β로 조정<\/pre><\/div><p class=\"note\"><a href=\"nb/mock.html\" target=\"_blank\" rel=\"noopener\">실행 결과 포함 답안 노트북 열기 →<\/a><\/p>", "out": "", "extra": ""}, {"sec": "mock", "title": "모의 2. 주어진 Salary2024.csv를 업로드하여, Pandas를 이용하여 다음을 구하시오.", "kw": "모의고사 모의시험 중간고사 답안 정답 문제 2. 주어진 Salary2024.csv를 업로드하여, Pandas를 이용하여 다음을 구하시오.", "code": "# a. 경력 수준별 연봉 최소·최대·평균, 평균 내림차순\ndatafile = '/content/Salary2024.csv'\ndf = pd.read_csv(datafile)\nresult_a = df.groupby('experience_level')['salary_in_usd'].agg(['min', 'max', 'mean'])\nresult_a = result_a.sort_values(by='mean', ascending=False)     # 정렬 결과를 다시 저장해야 반영됨\nresult_a\n\n# b. 2024년 직종별 평균 연봉 상위 10개\ndf_2024 = df[df['work_year'] == 2024]                               # 2024년만 먼저 거르기\nresult_b = df_2024.groupby('job_title')['salary_in_usd'].mean()\nresult_b.sort_values(ascending=False).head(10)", "note": "", "html": "<div><b>문제<\/b><p>### a. 경력 수준(experience_level)별 연봉(salary_in_usd)의 최소, 최대, 평균을 구하고, 평균이 높은 순으로 정렬하시오.<\/p><p>### b. 2024년 데이터만으로 직종(job_title)별 평균 연봉 상위 10개를 구하시오.<\/p><\/div><p class=\"note\"><a href=\"nb/mock.html\" target=\"_blank\" rel=\"noopener\">실행 결과 포함 답안 노트북 열기 →<\/a><\/p>", "out": "min     max           mean\nexperience_level                              \nExecutive-level   15000  465000  189687.346457\nSenior-level      15809  750000  162071.063581\nMid-level         15000  750000  119019.812537\nEntry-level       15000  350000   84448.916814\n\njob_title\nMachine Learning Scientist        282916.666667\nManaging Director Data Science    260000.000000\nAI Architect                      229662.500000\nResearch Engineer                 227896.782609\nApplied Scientist                 222618.875000\nML Engineer                       222600.000000\nData Product Manager              213150.000000\nComputer Vision Engineer          210000.000000\nResearch Scientist                207876.190476\nDirector of Data Science          202500.000000\nName: salary_in_usd, dtype: float64", "extra": ""}, {"sec": "mock", "title": "모의 3. 다음 사양의 신경망으로 Fashion MNIST를 학습하고 테스트 정확도와 학습 곡선을 출력하시오.", "kw": "모의고사 모의시험 중간고사 답안 정답 문제 3. 다음 사양의 신경망으로 Fashion MNIST를 학습하고 테스트 정확도와 학습 곡선을 출력하시오.", "code": "# 데이터 로딩, 정규화(0~1), 학습/검증 분리\n(X_train_full, y_train_full), (X_test, y_test) = keras.datasets.fashion_mnist.load_data()\nX_valid, X_train = X_train_full[:5000] / 255., X_train_full[5000:] / 255.\ny_valid, y_train = y_train_full[:5000], y_train_full[5000:]\nX_test = X_test / 255.\nprint(X_train.shape, X_valid.shape, X_test.shape)\n\n# 모델 생성 및 summary\nmodel = keras.models.Sequential([\n    keras.layers.Input(shape=[28, 28]),\n    keras.layers.Flatten(),\n    keras.layers.Dense(300, activation=\"elu\", kernel_initializer=\"he_normal\"),\n    keras.layers.BatchNormalization(),\n    keras.layers.Dense(100, activation=\"elu\", kernel_initializer=\"he_normal\"),\n    keras.layers.BatchNormalization(),\n    keras.layers.Dense(10, activation=\"softmax\")\n])\nmodel.summary()\n\n# 컴파일, 학습\nmodel.compile(loss=\"sparse_categorical_crossentropy\",\n              optimizer=keras.optimizers.SGD(learning_rate=0.01, momentum=0.9, nesterov=True),\n              metrics=[\"accuracy\"])\nhistory = model.fit(X_train, y_train, epochs=10, validation_data=(X_valid, y_valid), verbose=2)\n\n# 테스트 정확도, 학습 곡선\ntest_loss, test_acc = model.evaluate(X_test, y_test)\nprint(f\"테스트 정확도: {test_acc:.4f}\")\npd.DataFrame(history.history).plot(figsize=(8, 5))\nplt.grid(True); plt.xlabel(\"epoch\"); plt.show()", "note": "", "html": "<div><b>문제<\/b><p>Hidden Layer<br>* 300개, 100개의 2개의 Hidden<br>* Activation: ELU<br>* Initializer: He<br>* 각 Hidden 다음에 배치 정규화 적용<br>* Optimizer: NAG (learning_rate 0.01, momentum 0.9)<br><br>Output Layer<br>* Activation: Softmax<br><br>학습: 10 epoch, 검증 세트 5,000개<\/p><p>### 위 모델에서 BatchNormalization 층의 파라미터 수가 Dense(300) 뒤에서 1,200개인 이유와, 그중 훈련되지 않는 파라미터가 무엇인지 설명하시오.<\/p><\/div><div><b>답안<\/b><pre style=\"white-space:pre-wrap\">BatchNormalization은 입력 특성(뉴런) 하나마다 4개의 파라미터를 가진다.\nDense(300) 뒤이므로 300 × 4 = 1,200개.\n\n- γ(스케일), β(이동): 역전파로 학습되는 파라미터\n- 이동 평균, 이동 분산: 학습 중 배치 통계를 누적해 두었다가 테스트(예측) 때 쓰는 값으로,\n  역전파로 학습되지 않는다 (Non-trainable)<\/pre><\/div><p class=\"note\"><a href=\"nb/mock.html\" target=\"_blank\" rel=\"noopener\">실행 결과 포함 답안 노트북 열기 →<\/a><\/p>", "out": "\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\b\r\u001b[1m313/313\u001b[0m \u001b[32m━━━━━━━━━━━━━━━━━━━━\u001b[0m\u001b[37m\u001b[0m \u001b[1m1s\u001b[0m 2ms/step - accuracy: 0.8502 - loss: 0.4944\n\n테스트 정확도: 0.8502\n\n<Figure size 800x500 with 1 Axes>", "extra": ""}, {"sec": "mock", "title": "모의 4. 옵티마이저 비교", "kw": "모의고사 모의시험 중간고사 답안 정답 문제 4. 옵티마이저 비교", "code": "# 모델을 만드는 함수\ndef build_model():\n    return keras.models.Sequential([\n        keras.layers.Input(shape=[28, 28]),\n        keras.layers.Flatten(),\n        keras.layers.Dense(300, activation=\"relu\"),\n        keras.layers.Dense(100, activation=\"relu\"),\n        keras.layers.Dense(10, activation=\"softmax\")\n    ])\n\n# 옵티마이저별 학습\noptimizers = {\n    \"SGD\": lambda: keras.optimizers.SGD(learning_rate=0.01),\n    \"Momentum\": lambda: keras.optimizers.SGD(learning_rate=0.01, momentum=0.9),\n    \"Adam\": lambda: keras.optimizers.Adam(learning_rate=0.001),\n}\nhistories, results = {}, {}\nfor name, make_opt in optimizers.items():\n    m = build_model()\n    m.compile(loss=\"sparse_categorical_crossentropy\", optimizer=make_opt(), metrics=[\"accuracy\"])\n    histories[name] = m.fit(X_train, y_train, epochs=5, validation_data=(X_valid, y_valid), verbose=0)\n    results[name] = m.evaluate(X_test, y_test, verbose=0)[1]\n\n# val_loss 그래프, 테스트 정확도 표\nfor name, h in histories.items():\n    plt.plot(h.history[\"val_loss\"], label=name)\nplt.xlabel(\"epoch\"); plt.ylabel(\"val_loss\"); plt.legend(); plt.grid(True); plt.show()\npd.DataFrame({\"test_accuracy\": results}).sort_values(\"test_accuracy\", ascending=False)", "note": "", "html": "<div><b>문제<\/b><p>같은 모델(Flatten → Dense(300, relu) → Dense(100, relu) → Dense(10, softmax))로<br>SGD(lr 0.01), Momentum(lr 0.01, 0.9), Adam(lr 0.001)을 각각 5 epoch 학습하여<br><br>**a)** 검증 손실(val_loss) 곡선을 한 그래프에 그리고, 테스트 정확도를 표로 정리하시오.<br><br>**b)** 결과를 근거로 세 옵티마이저의 차이를 설명하시오.<\/p><\/div><div><b>답안<\/b><pre style=\"white-space:pre-wrap\">(정확도 숫자는 실행 결과를 보고 채운다)\n- SGD: 배치마다 기울기만큼만 이동해서 같은 5 epoch 동안 손실이 가장 천천히 줄었다.\n- Momentum: 이전 이동 방향을 관성처럼 누적해 같은 방향이면 더 크게 이동 → SGD보다 빨리 수렴.\n- Adam: Momentum(기울기의 지수 평균) + RMSProp(기울기 제곱의 지수 평균으로 방향별 학습률 조정)\n  + 초기 편향 보정. 학습률을 자동으로 조정해 적은 epoch에서도 손실이 빠르게 줄었다.\n결론: 같은 epoch이면 관성·적응형 옵티마이저가 SGD보다 빨리 수렴한다.\nSGD는 느리지만 오래 학습하면 최종 품질은 좋을 수 있다.<\/pre><\/div><p class=\"note\"><a href=\"nb/mock.html\" target=\"_blank\" rel=\"noopener\">실행 결과 포함 답안 노트북 열기 →<\/a><\/p>", "out": "<Figure size 640x480 with 1 Axes>\n\ntest_accuracy\nMomentum         0.8677\nAdam             0.8658\nSGD              0.8458", "extra": ""}, {"sec": "mock", "title": "모의 5. CNN", "kw": "모의고사 모의시험 중간고사 답안 정답 문제 5. CNN", "code": "# CNN 입력은 채널 차원이 필요 (28, 28) → (28, 28, 1)\nX_train_c, X_valid_c, X_test_c = X_train[..., np.newaxis], X_valid[..., np.newaxis], X_test[..., np.newaxis]\nprint(X_train_c.shape)\n\n# CNN 모델 생성, 학습, 평가\ncnn = keras.models.Sequential([\n    keras.layers.Input(shape=[28, 28, 1]),\n    keras.layers.Conv2D(32, kernel_size=(3, 3), padding=\"same\"),\n    keras.layers.MaxPooling2D(pool_size=(2, 2)),\n    keras.layers.Conv2D(64, kernel_size=(3, 3), padding=\"same\"),\n    keras.layers.MaxPooling2D(pool_size=(2, 2)),\n    keras.layers.Flatten(),\n    keras.layers.Dense(128, activation=\"relu\"),\n    keras.layers.Dropout(0.2),\n    keras.layers.Dense(10, activation=\"softmax\")\n])\ncnn.summary()\ncnn.compile(loss=\"sparse_categorical_crossentropy\", optimizer=\"nadam\", metrics=[\"accuracy\"])\ncnn.fit(X_train_c, y_train, epochs=5, validation_data=(X_valid_c, y_valid), verbose=2)\nprint(\"CNN 테스트 정확도:\", cnn.evaluate(X_test_c, y_test, verbose=0)[1])", "note": "", "html": "<div><b>문제<\/b><p>**a)** 아래 구조의 CNN을 만들어 Fashion MNIST를 5 epoch 학습하고 테스트 정확도를 구하시오.<br><br>Conv2D(32, 3×3, same) → MaxPooling2D(2×2) → Conv2D(64, 3×3, same) → MaxPooling2D(2×2) → Flatten → Dense(128, relu) → Dropout(0.2) → Dense(10, softmax), Optimizer: nadam<br><br>**b)** 첫 번째 Conv2D의 파라미터가 320개, 두 번째가 18,496개인 이유를 계산식으로 설명하시오.<br><br>**c)** 3번의 Dense 신경망과 비교하여, 이미지에서 CNN이 유리한 이유를 설명하시오.<\/p><\/div><div><b>답안<\/b><pre style=\"white-space:pre-wrap\">b) Conv2D 파라미터 = (커널 높이 × 커널 너비 × 입력 채널 + 편향 1) × 필터 수\n- 첫 번째: 입력 채널 1 → (3×3×1 + 1) × 32 = 10 × 32 = 320\n- 두 번째: 입력 채널은 앞 층의 필터 수 32 → (3×3×32 + 1) × 64 = 289 × 64 = 18,496\n\nc) Dense 신경망은 28×28 그림을 784개 한 줄로 펴서 입력하므로 픽셀 사이의 위치 관계가 사라진다.\nCNN은 그림 모양 그대로 작은 필터를 이동시키며 주변 픽셀을 함께 보므로 선·모서리 같은 지역 특징을 잡고,\n같은 필터를 이미지 전체에 공유해 파라미터가 적다. 풀링으로 크기를 줄여 위치가 조금 달라도 같은 결과를 낸다.<\/pre><\/div><p class=\"note\"><a href=\"nb/mock.html\" target=\"_blank\" rel=\"noopener\">실행 결과 포함 답안 노트북 열기 →<\/a><\/p>", "out": "1719/1719 - 27s - 15ms/step - accuracy: 0.9245 - loss: 0.2029 - val_accuracy: 0.9192 - val_loss: 0.2356\n\n1719/1719 - 25s - 15ms/step - accuracy: 0.9342 - loss: 0.1738 - val_accuracy: 0.9128 - val_loss: 0.2595\n\nCNN 테스트 정확도: 0.9082000255584717", "extra": ""}, {"sec": "mock", "title": "모의 6. 텐서플로 자동 미분", "kw": "모의고사 모의시험 중간고사 답안 정답 문제 6. 텐서플로 자동 미분", "code": "# GradientTape로 기울기 구하기\nw1, w2 = tf.Variable(5.), tf.Variable(3.)        # constant면 기록되지 않음\nwith tf.GradientTape() as tape:\n    z = 3 * w1 ** 2 + 2 * w1 * w2\nprint(tape.gradient(z, [w1, w2]))", "note": "", "html": "<div><b>문제<\/b><p>함수 z = 3·w1² + 2·w1·w2 에서 (w1, w2) = (5, 3)일 때의 기울기를<br><br>**a)** 손으로 편미분한 식으로 구하고 (`&lt;pre&gt;`에 작성)<br><br>**b)** `tf.GradientTape`로 구해서 같은지 확인하시오.<\/p><\/div><div><b>답안<\/b><pre style=\"white-space:pre-wrap\">∂z/∂w1 = 6·w1 + 2·w2 = 6×5 + 2×3 = 36\n∂z/∂w2 = 2·w1 = 2×5 = 10\n→ 기울기 (36, 10)<\/pre><\/div><p class=\"note\"><a href=\"nb/mock.html\" target=\"_blank\" rel=\"noopener\">실행 결과 포함 답안 노트북 열기 →<\/a><\/p>", "out": "[<tf.Tensor: shape=(), dtype=float32, numpy=36.0>, <tf.Tensor: shape=(), dtype=float32, numpy=10.0>]", "extra": ""}, {"sec": "mock", "title": "모의 7. 과대적합(Overfitting)이 무엇인지 설명하고, 학습 곡선에서 어떻게 알아볼 수 있는지와 방지 방법 3가지를 쓰시오.", "kw": "모의고사 모의시험 중간고사 답안 정답 문제 7. 과대적합(Overfitting)이 무엇인지 설명하고, 학습 곡선에서 어떻게 알아볼 수 있는지와 방지 방법 3가지를 쓰시오.", "code": "", "note": "", "html": "<div><b>답안<\/b><pre style=\"white-space:pre-wrap\">과대적합: 모델이 훈련 데이터에 지나치게 맞춰져 새로운 데이터(검증·테스트)에서 성능이 떨어지는 상태.\n\n학습 곡선: 훈련 손실(loss)은 계속 줄어드는데 검증 손실(val_loss)이 줄지 않거나 다시 올라가면\n과대적합이 시작된 것이다. 훈련 정확도와 검증 정확도의 차이가 벌어진다.\n\n방지 방법\n1) 드롭아웃: 학습 중 뉴런 일부를 랜덤하게 꺼서 특정 뉴런에 의존하지 않게 함\n2) L1/L2 규제: 큰 가중치에 벌점을 주어 모델을 단순하게 유지\n3) 조기 종료: 검증 손실이 더 나아지지 않으면 학습을 멈추고 가장 좋았던 가중치로 되돌림\n(그 외: 데이터 증강, 모델 크기 줄이기)<\/pre><\/div><p class=\"note\"><a href=\"nb/mock.html\" target=\"_blank\" rel=\"noopener\">실행 결과 포함 답안 노트북 열기 →<\/a><\/p>", "out": "", "extra": ""}, {"sec": "notebook", "title": "교수님 노트북 · 2. 케라스 신경망", "kw": "교수님 노트북 원본 강의 예제 10장 · Fashion MNIST 시퀀셜 API, 함수형 API(와이드&딥), 저장·복원, 콜백", "code": "", "note": "", "out": ""
